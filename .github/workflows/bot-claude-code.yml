name: Bot · Claude Code

# Triggered cross-repo by erp-namthuan/.github/workflows/bot-claude-code-dispatch.yml
# via workflow_dispatch. The dispatcher pre-computes a structured agent prompt
# (because anthropics/claude-code-action@beta now rejects repository_dispatch
# in its prepare step) and passes it as an input here.
#
# Uses PAT_TOKEN (same token as deploy/sync/CI, ppap-side copy). It must have
# Contents R/W + Issues R/W + Pull requests R/W on erp-namthuan so the action
# can clone the private repo and post comments / open PRs as part of agent
# mode tool use. See .claude/ppap.md § PAT_TOKEN.
#
# Authenticates the Anthropic side via CLAUDE_CODE_OAUTH_TOKEN, which binds
# bot runs to a Claude Code subscription's weekly quota (Pro / Max) rather
# than per-token Anthropic Console billing. See .claude/ppap.md § Secrets & PATs.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number on NamThuanVn/erp-namthuan'
        required: true
        type: string
      is_pr:
        description: 'true when the target is a PR (use refs/pull/N/head); false for plain issues (use main)'
        required: true
        type: string
      title:
        description: 'Issue / PR title (becomes the run-name)'
        required: true
        type: string
      prompt:
        description: 'Agent-mode prompt built by the dispatcher'
        required: true
        type: string

run-name: ${{ inputs.title }}

permissions: read-all

concurrency:
  group: bot-claude-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ inputs.is_pr }}" = "true" ]; then
            echo "checkout_ref=refs/pull/${{ inputs.issue_number }}/head" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout erp-namthuan
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ steps.ref.outputs.checkout_ref }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          direct_prompt: ${{ inputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_TOKEN }}
          timeout_minutes: 15
