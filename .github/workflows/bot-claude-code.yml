name: Bot · Claude Code

# Triggered cross-repo by erp-namthuan/.github/workflows/bot-claude-code-dispatch.yml
# via workflow_dispatch. The dispatcher forwards raw event fields (issue number,
# author, body, etc.); the agent prompt itself is assembled here after checkout
# from .github/claude-agent-protocol.md, which lives in erp-namthuan as the
# canonical, reviewable source for the bot's conversational protocol.
#
# Uses PAT_TOKEN (same token as deploy/sync/CI, ppap-side copy). It must have
# Contents R/W + Issues R/W + Pull requests R/W on erp-namthuan so the action
# can clone the private repo and post comments / open PRs as part of agent
# mode tool use. See .claude/ppap.md § PAT_TOKEN.
#
# Authenticates the Anthropic side via CLAUDE_CODE_OAUTH_TOKEN, which binds
# bot runs to a Claude Code subscription's weekly quota (Pro / Max) rather
# than per-token Anthropic Console billing. See .claude/ppap.md § Secrets & PATs.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue or PR number on NamThuanVn/erp-namthuan'
        required: true
        type: string
      is_pr:
        description: 'true when the target is a PR (use refs/pull/N/head); false for plain issues (use main)'
        required: true
        type: string
      title:
        description: 'Issue / PR title (becomes the run-name)'
        required: true
        type: string
      event_name:
        description: 'Original triggering event name (issue_comment / issues / pull_request_review / pull_request_review_comment)'
        required: true
        type: string
      author:
        description: 'Login of the user who mentioned @claude'
        required: true
        type: string
      body:
        description: 'Body / comment text that contained @claude (truncated to ~3 KB by the dispatcher)'
        required: true
        type: string

run-name: ${{ inputs.title }}

permissions: read-all

concurrency:
  group: bot-claude-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve checkout ref + run metadata
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ inputs.is_pr }}" = "true" ]; then
            {
              echo "checkout_ref=refs/pull/${{ inputs.issue_number }}/head"
              echo "kind=PR"
              echo "gh_cmd=pr"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "checkout_ref=main"
              echo "kind=issue"
              echo "gh_cmd=issue"
            } >> "$GITHUB_OUTPUT"
          fi
          # Datestamp for the execution branch name + run URL for the
          # sticky-comment header. UTC so it's stable across the team.
          {
            echo "datestamp=$(date -u +%Y%m%d-%H%M)"
            echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout erp-namthuan
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ steps.ref.outputs.checkout_ref }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      # Install the project's full dev toolchain so the repo's own quality
      # gates can fire from inside the bot run:
      #   - Stop hook (.claude/hooks/stop-checks.sh) needs pnpm to run audit:code
      #   - Claude's pre-commit recipe (pnpm format:fix + typecheck + lint:biome) needs pnpm
      #   - lefthook's pre-commit gate (pnpm test:ci) needs both pnpm AND the
      #     prepare script to have run (lefthook install)
      # The composite is the same one ppap CI + deploys already use, so the
      # cache is shared across runs.
      - name: Install dev toolchain (pnpm + node + cached modules)
        uses: ./.github/actions/install

      # pnpm prepare runs `lefthook install` (per package.json). Needed as a
      # separate step because the composite's `pnpm install` is skipped on
      # cache hit, and actions/checkout above recreates .git/hooks/ fresh
      # every run — so without this, lefthook only activates on the rare
      # cache-miss runs.
      - name: Activate lefthook
        shell: bash
        run: pnpm prepare

      # codegraph is the only MCP server from `pnpm mcp:setup` that works in
      # CI — mcp:sentry needs an interactive OAuth flow (impossible in CI) and
      # mcp:playwright relies on the `claude` CLI binary registering user-scope
      # state; both fail here. codegraph ships on npm and runs via npx, so no
      # extra toolchain (uv) is needed. Pre-build the index now: the MCP
      # server's native file watcher is the source of truth for incremental
      # updates locally (no PostToolUse hook), but that watcher is disabled in
      # sandboxed CI, so we build the graph up front before Claude runs. The
      # SessionStart hook also runs `codegraph status`, which needs the index
      # to exist.
      - name: Build codegraph index
        shell: bash
        run: pnpm mcp:codegraph

      # Git needs a user identity to make commits. Without this step, the
      # commit phase of Step 6 fails with "Author identity unknown" (seen on
      # ppap run 26357015231). Use a bot-flavored identity that's clearly
      # not a human contributor.
      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.name  "Claude Bot"
          git config --global user.email "claude-bot@namthuan.vn"

      - name: Assemble agent prompt
        id: assemble
        env:
          KIND: ${{ steps.ref.outputs.kind }}
          GH_CMD: ${{ steps.ref.outputs.gh_cmd }}
          NUMBER: ${{ inputs.issue_number }}
          EVENT: ${{ inputs.event_name }}
          AUTHOR: ${{ inputs.author }}
          BODY: ${{ inputs.body }}
          RUN_URL: ${{ steps.ref.outputs.run_url }}
          DATESTAMP: ${{ steps.ref.outputs.datestamp }}
        run: |
          set -euo pipefail
          if [ ! -f .github/claude-agent-protocol.md ]; then
            echo "::error::Missing .github/claude-agent-protocol.md in erp-namthuan@${{ steps.ref.outputs.checkout_ref }}. Bot cannot proceed."
            exit 1
          fi
          # Substitute {{VAR}} placeholders via jq so untrusted BODY content
          # (from a fork-PR comment) is treated as a literal string — no
          # shell re-evaluation or regex metacharacters can leak through.
          PROMPT=$(jq -nr \
            --rawfile template .github/claude-agent-protocol.md \
            --arg kind      "$KIND" \
            --arg gh_cmd    "$GH_CMD" \
            --arg number    "$NUMBER" \
            --arg event     "$EVENT" \
            --arg author    "$AUTHOR" \
            --arg body      "$BODY" \
            --arg run_url   "$RUN_URL" \
            --arg datestamp "$DATESTAMP" \
            '$template
              | gsub("\\{\\{KIND\\}\\}";      $kind)
              | gsub("\\{\\{GH_CMD\\}\\}";    $gh_cmd)
              | gsub("\\{\\{NUMBER\\}\\}";    $number)
              | gsub("\\{\\{EVENT\\}\\}";     $event)
              | gsub("\\{\\{AUTHOR\\}\\}";    $author)
              | gsub("\\{\\{BODY\\}\\}";      $body)
              | gsub("\\{\\{RUN_URL\\}\\}";   $run_url)
              | gsub("\\{\\{DATESTAMP\\}\\}"; $datestamp)')
          {
            echo "prompt<<__EOF__"
            echo "$PROMPT"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "✓ Assembled agent prompt for $KIND #$NUMBER (event=$EVENT, author=@$AUTHOR)"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          direct_prompt: ${{ steps.assemble.outputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_TOKEN }}
          # 45 min budget. Real bot tasks (read context + plan + apply +
          # pre-commit gates + lefthook test:ci + push + open PR) routinely
          # take 8–20 minutes; the previous 15-min cap was too tight and
          # truncated runs mid-execution.
          timeout_minutes: 45
          # CRITICAL: the action's default allowed_tools is
          # "Edit,MultiEdit,Glob,Grep,LS,Read,Write" with Bash EXCLUDED. Our
          # protocol relies on `gh issue comment` / `gh api .../comments/N -X
          # PATCH` to post and update the sticky comment, plus `git` for the
          # execution branch — all of which are Bash invocations. Without
          # this opt-in the action silently denies the gh/git commands, runs
          # to completion, and never posts a single comment. (Symptom seen on
          # ppap run 26354917125 for issue #132: 52 turns, $0.43 burned, no
          # comment.)
          #
          # mcp__codegraph__* wildcard grants Claude access to the graph's MCP
          # tools (impact analysis, callers, callees, context, etc.). Without
          # this, Claude requests them and gets a permission denial mid-turn
          # (symptom from ppap run 26357015231 on issue #137: "Claude requested
          # permissions to use mcp__codegraph__codegraph_impact, but you
          # haven't granted it yet").
          allowed_tools: "Bash,Edit,MultiEdit,Glob,Grep,LS,Read,Write,mcp__codegraph__*"
