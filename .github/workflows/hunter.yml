name: Hunter · Timeouts + CI noise

# Two daily hunts that share a schedule and nothing else. Each takes one thing
# the per-PR gates can only refuse to make WORSE, re-derives it from the ground
# truth, and drives the stock down.
#
#   hunt-timeouts — the inline `{ timeout: N }` stock in the e2e suite, read
#                   from the TREE. Codemod + PR.
#   hunt-noise    — the "green but not clean" residue (flaky · dup-testid ·
#                   hydration · i18n · font · 404 · biome · vitest stderr), read
#                   from the FLEET'S LOGS over a multi-day window. Auto-fix for
#                   the one mechanically-fixable class, ranked report for the
#                   rest, in a sticky `ci-noise` issue.
#
# Why the second one cannot be the per-PR gate: ci-pr.yml's noise scan answers
# "is THIS run clean?" and gates auto-merge on it, which is the right question
# for a PR and the wrong one for a flake. A spec that fails one run in thirty is
# green on every single PR — `flaky 0`, clean, merged — and unmistakable the
# moment 40 runs across the 16 fleet repos are pooled. Same logs, same tags,
# wider window.
#
# ONE JOB PER HUNT, not one job with two steps: the timeout codemod rewrites the
# working tree, so a noise scan sharing that checkout would have to run before
# it or read a mutated tree, and a failure in either would take the other's
# report down with it. They also open different things (a PR vs an issue).
#
# Daily bite out of the inline-timeout stock: delete the `{ timeout: N }`
# overrides that playwright.config.ts's global defaults already cover, and open a
# PR with the batch. The full e2e suite on that PR is what judges whether the
# batch was safe — nothing here decides that.
#
# The backlog is already drained — the suite sits at zero inline overrides and
# zero per-test budgets — so on a healthy repo this reports "the stock is
# drained" and exits without opening anything. Expected, not a fault.
#
# It earns its keep as the second half of a pair that fail differently: the
# per-turn/per-PR gate refuses an INCREASE, while this re-derives the count from
# the tree, catching anything that landed by a path the gate never saw (a direct
# push, a merge of two individually-clean branches, a revert). Batching exists
# for that case: one unreviewable PR's e2e run cannot be bisected, a batch names
# the module.
#
# It shares BOTH its scanner and its codemod with the per-turn gate
# (scripts/gate/shape/no-timeouts.sh, scripts/dev/strip-timeouts.mjs) rather
# than reimplementing either — a second copy would drift, and the drift would
# show up as the hunter cheerfully reporting nothing to do.
#
# Filename is deliberately NOT ci-*.yml → the sync mirrors it to
# NamThuanVn/ppap only, never to the CI fleet's 20-job budget
# (docs/engineering/platform/ppap.md § To which workflows ppap runs).

on:
  schedule:
    # 02:00 Vietnam time (ICT) daily = 19:00 UTC. Actions cron is UTC-only, and
    # ICT is UTC+7 with NO daylight saving, so this one offset holds all year —
    # no seasonal drift to re-check.
    #
    # EXPECT IT LATE. Actions does not honour a schedule to the minute; a
    # scheduled run is queued and commonly starts minutes to tens of minutes
    # after its cron time, more so on a busy hour. A run appearing at 02:25 ICT
    # is the platform behaving normally, not a broken schedule — don't "fix" the
    # cron over it. The corollary is that shifting this by a few minutes to
    # dodge another job's minute buys nothing: with that much jitter, the actual
    # start minute is not the cron's to decide. The time here says WHEN WE WANT
    # IT, and the middle of the Vietnam night is the point — the fleet is idle,
    # so a ~1.5k-call REST sweep competes with nobody's PR CI.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the batch without opening a PR'
        type: boolean
        default: true
      batch_max:
        description: 'Approximate number of overrides to remove in one PR'
        type: string
        default: '400'
      days:
        description: 'Noise hunt: how many days of fleet CI logs to pool'
        type: string
        default: '7'

permissions:
  contents: read

concurrency:
  group: hunter
  cancel-in-progress: false

jobs:
  hunt-timeouts:
    name: Hunt timeouts
    runs-on: ubuntu-latest
    # Generous but finite. The work is a checkout, an install and an AST pass
    # over ~450 files; anything approaching this cap means something hung, and a
    # hung job with no cap burns six hours of billed time saying nothing.
    timeout-minutes: 30
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. Inlined
      # rather than calling scripts/ci/ppap/pat-pool.sh (the canonical copy —
      # keep the two in step) because the private-repo checkout itself needs a
      # token, so the pool cannot live behind it. GET /rate_limit does not count
      # against the limit, so probing every token is free.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      # The checkout is the UPSTREAM repo — always the freshest main, so the
      # planner reads current BA spec files (the fork's main is only as fresh
      # as its last sync). The next step rewires remotes into the fork layout
      # the skill expects for upstream-slug resolution. No fork sync here —
      # planning creates no claim refs (sync-agent-fork.yml + the solve job's
      # own freshen keep the fork current).

      - name: Checkout upstream main
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          fetch-depth: 1
          persist-credentials: false

      # Never stack two batches. The previous PR's e2e run is the ONLY evidence
      # that the codemod's judgement holds on real specs, so opening tomorrow's
      # batch before today's has landed would compound an unverified change —
      # and a red suite could then no longer be attributed to one batch.
      - name: Skip while a hunter PR is still open
        id: guard
        run: |
          set -uo pipefail
          OPEN=$(gh pr list --repo NamThuanVn/erp-namthuan \
                   --state open --head-prefix chore/strip-timeouts \
                   --json number --jq 'length' 2>/dev/null || echo 0)
          # --head-prefix is not universally available; fall back to a listing.
          if [ "$OPEN" = "0" ] || [ -z "$OPEN" ]; then
            OPEN=$(gh pr list --repo NamThuanVn/erp-namthuan --state open \
                     --json number,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("chore/strip-timeouts"))] | length')
          fi
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "::notice::a timeout-hunter PR is still open — skipping today's batch"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/install
        if: steps.guard.outputs.skip == 'false'

      - name: Take a batch
        id: hunt
        if: steps.guard.outputs.skip == 'false'
        env:
          BATCH_MAX: ${{ inputs.batch_max || '400' }}
        # --apply is REQUIRED to write; the script is dry by default so that a bare
        # invocation (an operator checking, a harness running it with no args)
        # cannot rewrite 35 spec files as a side effect. On the schedule trigger
        # `inputs.dry_run` is null, so the daily run takes the --apply branch.
        run: bash scripts/ci/timeout-hunter.sh ${{ inputs.dry_run && '--dry-run' || '--apply' }}

      # The gate must agree before the PR is opened. If the codemod and the
      # baseline disagree here, the PR would land red on its own repo-gates job —
      # better to fail the hunter and leave main untouched.
      - name: Verify the ratchet agrees
        if: steps.guard.outputs.skip == 'false' && steps.hunt.outputs.found == 'true'
        run: bash scripts/gate/shape/no-timeouts.sh

      - name: Open the PR
        if: steps.guard.outputs.skip == 'false' && steps.hunt.outputs.found == 'true' && !inputs.dry_run
        env:
          REMOVED: ${{ steps.hunt.outputs.removed }}
          FILES: ${{ steps.hunt.outputs.files }}
          SCOPE: ${{ steps.hunt.outputs.scope }}
          REMAINING: ${{ steps.hunt.outputs.remaining }}
        run: |
          set -euo pipefail
          BRANCH="chore/strip-timeouts-$(date -u +%Y%m%d)"
          git config user.name  'timeout-hunter'
          git config user.email 'noreply@github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -F - <<EOF
          chore(e2e): drop $REMOVED redundant timeouts ($SCOPE)

          Removes inline { timeout: N } overrides that playwright.config.ts's
          global defaults already cover, across $FILES file(s). Each removal is
          a value at or below the global backing that exact call shape, so no
          wait gets shorter.

          Left alone on purpose: values ABOVE their global, per-test budgets,
          and any call that inherits no global at all (waitForEvent) — those are
          judgement calls, not boilerplate. $REMAINING removable site(s) remain.

          Generated by .github/ppap/workflows/hunter.yml (hunt-timeouts).
          The full e2e suite on this PR is the evidence that the batch is safe.
          EOF
          git push "https://x-access-token:${RESOLVED_PAT}@github.com/NamThuanVn/erp-namthuan.git" "$BRANCH"
          gh pr create --repo NamThuanVn/erp-namthuan \
            --base main --head "$BRANCH" \
            --title "chore(e2e): drop $REMOVED redundant timeouts ($SCOPE)" \
            --body "Automated batch from the timeout hunter. $REMOVED override(s) across $FILES file(s); $REMAINING removable site(s) remain.

          Every removal is a value at or below the global that backs its call shape (\`expect.timeout\` 15s, \`expect.toPass.timeout\` 30s, \`use.actionTimeout\` 15s, \`use.navigationTimeout\` 15s), so no wait gets shorter. Values above their global, \`test.setTimeout\`, and calls inheriting no global are deliberately untouched — see [\`no-timeout-waits\`](.claude/skills/no-timeout-waits/SKILL.md).

          **The full e2e suite on this PR is the evidence.** A failure here is a real finding: it names a spec that was relying on a hand-typed budget."

  # ------------------------------------------------------------------ noise
  #
  # The "green is not clean" hunt. ci-pr.yml already counts this residue PER RUN
  # and blocks auto-merge on it; this pools the SAME tags across the fleet and a
  # multi-day window, which is the only way a 1-in-30 flake becomes visible —
  # on any single PR it is green.
  #
  # It opens two different things, because the categories divide cleanly:
  #   • biome warnings have a provable mechanical fix (`biome check --write`), so
  #     they get a PR, batched exactly like the timeout hunt's.
  #   • everything else is a judgement call — which of two responsive branches
  #     owns a testid, whether a wait is racing a cache hit — so they get a
  #     RANKED, ATTRIBUTED report in a sticky issue. A codemod that guessed at
  #     those would land an unreviewable diff across 400 specs, and the e2e run
  #     judging it could not be bisected.
  #
  # Never fails the workflow. Its product is a report and an issue; a red daily
  # job that nobody can act on is itself noise.
  hunt-noise:
    name: Hunt CI noise
    runs-on: ubuntu-latest
    # ~1.5k REST calls for a 7-day window over the 16-repo fleet (two run
    # listings per repo, one job listing per run, one log download per
    # test-bearing job), six in flight at a time. Measured serially at ~35
    # minutes for a 5-day window, so a pooled run has a lot of headroom under
    # this cap; anything approaching it means a download is hanging, and an
    # uncapped hang bills six hours to say nothing.
    timeout-minutes: 45
    steps:
      # Same inlined PAT pool as hunt-timeouts above, and for the same reason:
      # the private-repo checkout needs a token, so the pool cannot live behind
      # it in a composite action. scripts/ci/ppap/pat-pool.sh is the canonical
      # copy — keep all three in step.
      #
      # BYTE-IDENTICAL to the other 31 copies, and it has to stay that way:
      # scripts/gate/ci/pat-pool-drift.mjs fails the build on any divergence,
      # because 32 hand-maintained copies that are allowed to differ stop being
      # one resolver. So the note that belongs to THIS job lives out here rather
      # than inside the body — the sweep is the fleet's single biggest REST
      # consumer (~1.5k calls), so the body's own "below 500 remaining" warning
      # is generous for it: a pooled token near that floor will be throttled
      # mid-sweep and the report will describe a partial window as a whole one.
      # The `truncated` line in the report is what catches that after the fact.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - name: Checkout upstream main
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Scan the fleet's CI logs
        id: scan
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -uo pipefail
          # The fleet list is read from the repo VARIABLE, never inlined here:
          # PPAP_CI_REPOS grew from 3 repos to 16, and a stale literal would
          # sweep a fraction of the fleet while reporting a clean window — the
          # exact way a scanner lies. The script itself refuses an empty list.
          REPOS="$(gh api repos/NamThuanVn/erp-namthuan/actions/variables/PPAP_CI_REPOS --jq .value 2>/dev/null || true)"
          if [ -z "$REPOS" ]; then
            echo "::error::PPAP_CI_REPOS is unset on NamThuanVn/erp-namthuan — the sweep would scan nothing and call the fleet clean"
            exit 1
          fi
          mkdir -p noise
          # --max-logs is set HERE, above the script's own hand-run default of
          # 400: a 5-day window over this fleet already offers ~720 job logs, so
          # 400 would silently describe half the window. The script says when it
          # truncates, but a scheduled sweep should not need to.
          PPAP_CI_REPOS="$REPOS" node scripts/ci/noise-hunter.mjs scan \
            --days "$DAYS" \
            --max-logs 1200 \
            --json noise/ci-noise-fleet.json \
            --markdown noise/ci-noise-fleet.md

      - name: Upload the fleet noise report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-noise-fleet
          path: noise/
          retention-days: 14
          if-no-files-found: ignore

      # Never stack two batches, same rule as hunt-timeouts: the PR's own CI is
      # the only evidence the batch was safe, so opening tomorrow's before
      # today's has landed makes a red run unattributable.
      - name: Skip the fix PR while one is still open
        id: fix_guard
        if: steps.scan.outputs.fixable_files != ''
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
        run: |
          set -uo pipefail
          OPEN=$(gh pr list --repo NamThuanVn/erp-namthuan --state open \
                   --json number,headRefName \
                   --jq '[.[] | select(.headRefName | startswith("chore/ci-noise"))] | length' 2>/dev/null || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "::notice::a noise-hunter PR is still open — skipping today's fix batch"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/install
        if: steps.scan.outputs.fixable_files != '' && steps.fix_guard.outputs.skip == 'false'

      # Biome IS the codemod — the hunter never reimplements a fixer, exactly as
      # hunt-timeouts borrows strip-timeouts.mjs from the gate. Scoped to the
      # files the scan named rather than the whole tree, so the diff is
      # attributable to the finding.
      - name: Fix the biome warnings the sweep named
        id: fix
        if: steps.scan.outputs.fixable_files != '' && steps.fix_guard.outputs.skip == 'false'
        env:
          FIXABLE: ${{ steps.scan.outputs.fixable_files }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086  # FIXABLE is an intentional space-separated path list
          pnpm exec biome check --write $FIXABLE || true
          if git diff --quiet; then
            echo "::notice::biome had nothing left to rewrite in the named files (already fixed on main)"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files=$(git diff --name-only | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the fix PR
        if: steps.fix.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          FILES: ${{ steps.fix.outputs.files }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
        run: |
          set -euo pipefail
          BRANCH="chore/ci-noise-$(date -u +%Y%m%d)"
          git config user.name  'noise-hunter'
          git config user.email 'noreply@github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -F - <<EOF
          chore(ci): clear the biome warnings the fleet noise sweep found ($FILES file(s))

          \`biome check --write\` over exactly the files the sweep named. Biome's own
          fixer did the edit; the hunter only chose the inputs.

          Fleet window: $SUMMARY.
          Generated by .github/ppap/workflows/hunter.yml (hunt-noise).
          EOF
          git push "https://x-access-token:${RESOLVED_PAT}@github.com/NamThuanVn/erp-namthuan.git" "$BRANCH"
          gh pr create --repo NamThuanVn/erp-namthuan \
            --base main --head "$BRANCH" \
            --title "chore(ci): clear the biome warnings the fleet noise sweep found ($FILES file(s))" \
            --body "Automated batch from the CI noise hunter — \`biome check --write\` over exactly the files the fleet sweep named, nothing else.

          Fleet window: \`$SUMMARY\`. Full inventory in this run's \`ci-noise-fleet\` artifact.

          Biome's own fixer produced every edit here, so the diff is as safe as running \`pnpm biome check --write\` locally. The remaining categories (flaky, dup-testid, hydration, i18n, font, 404, vitest stderr) are judgement calls and are tracked in the sticky [\`ci-noise\`](https://github.com/NamThuanVn/erp-namthuan/issues?q=is%3Aissue+is%3Aopen+label%3Aci-noise) issue instead."

      # The sticky inventory. ONE issue, refreshed in place — a new issue per day
      # would bury the trend under 30 duplicates, and the trend (which spec, how
      # many distinct runs) is the entire product. Closed automatically the day
      # the window comes back clean, so "issue open" means exactly "the fleet has
      # noise right now".
      - name: Open or refresh the sticky ci-noise issue
        if: ${{ always() && steps.scan.conclusion == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          FOUND: ${{ steps.scan.outputs.found }}
          TOTAL: ${{ steps.scan.outputs.total }}
          RUNS: ${{ steps.scan.outputs.runs }}
          SUMMARY: ${{ steps.scan.outputs.summary }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          REPO=NamThuanVn/erp-namthuan
          # Found BY LABEL, not by title. `ci-noise` is unique to this issue, so
          # someone renaming the title cannot make the hunter open a second one
          # every morning — which is what a title search would do silently.
          NUM=$(gh api "repos/$REPO/issues?state=open&labels=ci-noise&per_page=100" \
                  --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$FOUND" != true ]; then
            if [ -n "$NUM" ]; then
              jq -n --arg b "✅ Fleet sweep clean across $RUNS run(s) — no flaky, no report-only tags, no biome warnings, no vitest stderr. Closing; the hunter reopens this the day noise comes back. ([sweep]($RUN_URL))" \
                '{body: $b}' | gh api -X POST "repos/$REPO/issues/$NUM/comments" --input - >/dev/null
              jq -n '{state: "closed", state_reason: "completed"}' \
                | gh api -X PATCH "repos/$REPO/issues/$NUM" --input - >/dev/null
              echo "closed #$NUM — the window is clean"
            else
              echo "::notice::fleet sweep clean across $RUNS run(s) — nothing to file"
            fi
            exit 0
          fi

          {
            cat noise/ci-noise-fleet.md
            printf '\n---\n\n'
            printf 'Refreshed daily by [`hunter.yml` · hunt-noise](%s). ' "$RUN_URL"
            printf 'Ranked by DISTINCT PRs first, then runs: a row on six PRs is ambient and will meet '
            printf 'everyone, while the same count inside one PR is that branch problem and there is '
            printf 'nothing to fix on `main` (a one-PR row prints as `#3061`, not `1`). '
            printf 'How to read and act on this: '
            printf '[ppap-hunters](https://github.com/NamThuanVn/erp-namthuan/blob/main/docs/engineering/platform/ppap-hunters.md). '
            printf 'Per-category fix guidance: '
            printf '[hydration double-mount race](https://github.com/NamThuanVn/erp-namthuan/blob/main/docs/engineering/runbooks/hydration-double-mount-race.md) '
            printf 'for `dup`/`hyd`, '
            printf '[`no-timeout-waits`](https://github.com/NamThuanVn/erp-namthuan/blob/main/.claude/skills/no-timeout-waits/SKILL.md) '
            printf 'for a wait you are tempted to widen.\n\n'
            printf 'This issue closes itself the day the sweep comes back clean.\n'
          } > noise/issue-body.md

          if [ -n "$NUM" ]; then
            jq -n --rawfile b noise/issue-body.md '{body: $b}' \
              | gh api -X PATCH "repos/$REPO/issues/$NUM" --input - >/dev/null \
              && echo "refreshed #$NUM — $SUMMARY"
          else
            NUM=$(jq -n --rawfile b noise/issue-body.md \
                    '{title: "CI noise inventory — fleet log sweep", body: $b, labels: ["ci-noise", "chore", "scope:infra"]}' \
                    | gh api -X POST "repos/$REPO/issues" --input - --jq '.number')
            echo "filed #$NUM — $SUMMARY"
          fi
          exit 0
