name: CI · Lint · Typecheck · Test

# Reusable PR CI for NamThuanVn/erp-namthuan, executed on ppap's free public
# Actions minutes. Triggered cross-repo by erp-namthuan/.github/workflows/
# ci-dispatch.yml via repository_dispatch[ci]; `workflow_dispatch` is the
# manual re-run escape hatch. Each tool runs in its own parallel job; the
# final `report` job patches the pending Check Run on erp-namthuan to
# success/failure with a per-job markdown summary.
#
# Uses PAT_TOKEN (same token as deploy/sync, ppap-side copy). It must have
# Checks:R/W on erp-namthuan so the `report` job can PATCH the Check Run.
# Note: this collapses the fork-safety boundary that a separate CI_PAT
# would have provided — see the trade-off note in .claude/ppap.md § PAT_TOKEN.

run-name: "${{ github.event.client_payload.title || format('CI — PR #{0}', inputs.pr_number) }}"

on:
  repository_dispatch:
    types: [ci]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number on NamThuanVn/erp-namthuan to (re)run CI for'
        required: true
        type: string

permissions: read-all

concurrency:
  group: ci-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
  # refs/pull/<N>/merge resolves to the merge commit GitHub computes between
  # the PR head and the base. Mirrors what `pull_request` would test. If the
  # PR has merge conflicts this ref is absent and the checkout step fails —
  # which surfaces as a Check Run failure with a clear "resolve conflict"
  # hint in the report summary.
  MERGE_REF: refs/pull/${{ github.event.client_payload.pr_number || inputs.pr_number }}/merge

jobs:
  biome:
    name: Biome (format + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm typecheck

  lint:
    name: ESLint (workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm lint:workspaces

  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ env.MERGE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm test:run

  # Patches the pending Check Run created by erp-namthuan's ci-dispatch.yml.
  # `if: always()` so failures still get a final pingback; the shell step
  # itself no-ops if `check_run_id` is empty (manual workflow_dispatch).
  report:
    name: Report CI
    needs: [biome, typecheck, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Patch Check Run on erp-namthuan
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          CHECK_ID: ${{ github.event.client_payload.check_run_id }}
          R_BIOME: ${{ needs.biome.result }}
          R_TYPE: ${{ needs.typecheck.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TEST: ${{ needs.test.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${CHECK_ID:-}" ]; then
            echo "No check_run_id in payload (manual workflow_dispatch?) — skipping pingback."
            exit 0
          fi
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🟡" ;;
              *)         echo "❌" ;;
            esac
          }
          if [ "$R_BIOME" = "success" ] && [ "$R_TYPE" = "success" ] && [ "$R_LINT" = "success" ] && [ "$R_TEST" = "success" ]; then
            CONCLUSION="success"
            TITLE="All checks passed"
          else
            CONCLUSION="failure"
            TITLE="Some checks failed"
          fi
          SUMMARY=$(printf '**Jobs**\n\n%s Biome — `%s`\n%s Typecheck — `%s`\n%s ESLint — `%s`\n%s Vitest — `%s`\n\n[Open run on ppap](%s)\n\n_If `checkout` failed across all jobs, the PR likely has a merge conflict with `main` — rebase and push to retrigger._' \
            "$(icon "$R_BIOME")" "$R_BIOME" \
            "$(icon "$R_TYPE")"  "$R_TYPE" \
            "$(icon "$R_LINT")"  "$R_LINT" \
            "$(icon "$R_TEST")"  "$R_TEST" \
            "$RUN_URL")
          PAYLOAD=$(jq -n \
            --arg conclusion "$CONCLUSION" \
            --arg url        "$RUN_URL" \
            --arg title      "$TITLE" \
            --arg summary    "$SUMMARY" \
            '{conclusion: $conclusion, status: "completed", details_url: $url, output: {title: $title, summary: $summary}}')
          echo "$PAYLOAD" | gh api "repos/${{ env.PRIVATE_REPO }}/check-runs/$CHECK_ID" --method PATCH --input -
          echo "✓ Patched Check Run $CHECK_ID — $CONCLUSION"
