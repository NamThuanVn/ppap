name: Bot · Dispatch Fork Sync

# Fans out `upstream-main-updated` repository_dispatch events to every fork
# listed in `vars.FORK_REPOS` (comma-separated `owner/repo`). Lives on ppap
# (public, free Actions minutes) so the private repo's billed-minutes
# footprint is unchanged. See .claude/ppap.md for the cross-repo dispatch
# architecture and `.github/workflows/sync-fork-from-upstream.yml` (in
# erp-namthuan) for the fork-side handler that consumes these events.
#
# Triggers:
#   - repository_dispatch[deploy-staging]: piggybacks on the event the
#     private repo already sends on every push to main — multiple workflows
#     can react to the same event, so deploy-staging.yml and this file run
#     in parallel without coupling.
#   - repository_dispatch[fork-sync]: explicit channel if we ever want to
#     re-fan-out without a deploy.
#   - workflow_dispatch: manual UI button on ppap → Actions.

on:
  repository_dispatch:
    types: [deploy-staging, fork-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-fork-sync
  cancel-in-progress: false

jobs:
  dispatch:
    name: Fan out fork-sync to ${{ vars.FORK_REPOS }}
    if: vars.FORK_REPOS != ''
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream-main-updated to each fork
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          FORK_REPOS: ${{ vars.FORK_REPOS }}
          SHA: ${{ github.event.client_payload.sha }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.actor }}
          TITLE: ${{ github.event.client_payload.title || 'manual fork-sync' }}
        run: |
          set -euo pipefail
          IFS=',' read -ra FORKS <<< "$FORK_REPOS"
          TOTAL=0
          OK=0
          for raw in "${FORKS[@]}"; do
            FORK=$(echo "$raw" | xargs)
            [ -z "$FORK" ] && continue
            TOTAL=$((TOTAL+1))
            if gh api "repos/$FORK/dispatches" \
              -f event_type=upstream-main-updated \
              -f client_payload[sha]="$SHA" \
              -f client_payload[triggered_by]="$TRIGGERED_BY" \
              -f client_payload[title]="$TITLE"; then
              echo "✓ Dispatched fork-sync → $FORK"
              OK=$((OK+1))
            else
              echo "✗ Failed to dispatch fork-sync → $FORK"
            fi
          done
          echo "Dispatched $OK/$TOTAL forks"
          # Fail only if every dispatch failed (one stale fork shouldn't
          # block the rest — the fork-side cron is the safety net anyway).
          if [ "$TOTAL" -gt 0 ] && [ "$OK" -eq 0 ]; then
            exit 1
          fi
