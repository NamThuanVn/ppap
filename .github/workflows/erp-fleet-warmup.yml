name: ERP · Fleet · Warm-up scheduler

# ONE hourly run that decides which CI-fleet orgs still need their concurrency
# ceiling proven, and dispatches erp-ci-warmup.yml to just those.
#
# WHY IT IS CENTRAL. erp-ci-warmup.yml measures an org's real concurrent-job ceiling
# into that org's own E2E_HOST_CEILING variable, which is what lets
# scripts/ci/fanout.mjs size the host's e2e batch instead of guessing (see
# ppap-ci-fleet.md § CI fan-out). It used to carry its OWN hourly cron, so all
# seventeen copies — sixteen fleet repos plus this one — woke every hour to read
# one variable each and each conclude it had nothing to do. Seventeen schedules
# to run zero probes is the STEADY state, because a proven org never needs
# another probe.
#
# The waste was the smaller half. Nothing owned the fleet-wide view, and two
# rules only exist once something does:
#
#   · Never probe a BUSY org. A probe fills the org on purpose — that is how it
#     measures — so firing one into a repo running someone's PR shards steals
#     those slots AND mismeasures, because the PR's jobs hold the very slots the
#     probe wants to count. (The monotonic guard in `record` stops a low reading
#     from being written down, so the cost is a wasted burn plus a queued PR,
#     not a corrupted variable.)
#   · Probe at most MAX_HOSTS per hour, weakest first. A probe removes a host
#     from the recruitable pool for ~4 minutes; on a fresh fleet every unproven
#     org used to saturate itself at :30 simultaneously, so a PR landing in that
#     window could recruit nobody. Ascending-ceiling order spends the budget
#     where it buys most — an unmeasured host is sized at WARMUP_SLOTS (5)
#     however roomy it really is, and probing is itself the Actions usage that
#     lifts a young org's ceiling.
#
# Filename is deliberately NOT erp-ci-*.yml → the sync mirrors it to
# NamThuanVn/ppap only, never to the CI fleet's 20-job budget
# (docs/engineering/platform/ppap.md § What lives where). That is also what
# makes it a scheduler rather than a seventeenth copy of the thing it schedules.
#
# This repo is not in PPAP_CI_REPOS and never probes ITSELF: its own e2e
# fallback is sized by COORD_FALLBACK_SLOTS, a constant, so nothing here reads a
# ceiling for it.

on:
  # No `schedule:`. The hourly clock moved OUT of GitHub — it delayed the
  # schedule EVENT at its own scheduler and dropped ticks it could not place.
  # erp-heartbeat.yml dispatches the WRAPPER erp-new-org-warmup.yml (catalogue id
  # `new-org-warmup`) when its last run is over an hour old, driven by a
  # Cloudflare cron on the ERP's service-utilities worker. The whole-fleet
  # catalogue job was retired once every PPAP_CI_REPOS org measured 20, so this
  # workflow_dispatch trigger is now manual-only — dispatch it by hand to re-probe
  # the live fleet. See erp-heartbeat.yml's header, and `/settings/agent-control`
  # in the ERP for the on/off switch.
  workflow_dispatch:
    inputs:
      target:
        description: 'Ceiling to prove (default 20 = the documented GitHub Free ceiling).'
        required: false
        default: '20'
        type: string
      max_hosts:
        description: 'How many hosts may be probed in this run.'
        required: false
        default: '4'
        type: string
      dry_run:
        description: 'Plan and report which hosts WOULD be probed, dispatch nothing.'
        required: false
        default: false
        type: boolean
  # erp-new-org-warmup.yml calls this with list_var=PPAP_WARMUP_REPOS — new orgs
  # warmed BEFORE they join PPAP_CI_REPOS, so routing, fan-out and agent lanes
  # never hand real work to a 5-slot org. Same decision, a different list.
  workflow_call:
    inputs:
      list_var:
        description: 'erp-namthuan repo variable holding the host list.'
        required: false
        default: 'PPAP_CI_REPOS'
        type: string
      target:
        required: false
        default: '20'
        type: string
      max_hosts:
        required: false
        default: '4'
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  # Two schedulers would each read the fleet before either dispatched, and both
  # would pick the same weakest hosts. Keyed by list: the fleet and the new-org
  # lists share no host, so neither run should queue behind the other.
  group: fleet-warmup-${{ inputs.list_var || 'PPAP_CI_REPOS' }}
  cancel-in-progress: false

jobs:
  schedule:
    name: Probe the hosts that need it
    runs-on: ubuntu-latest
    # A whole fleet sweep is ~1 REST call per proven host and ~9 per unproven
    # one, then one dispatch each. Minutes, not tens of them; anything near this
    # cap means a call is hanging.
    timeout-minutes: 15
    steps:
      # Same inlined PAT pool as every other ppap workflow, and for the same
      # reason: the private-repo checkout below needs a token, so the pool
      # cannot live behind it. scripts/ci/ppap/pat-pool.sh is the canonical copy
      # — scripts/gate/ci/pat-pool-drift.mjs fails the build if these diverge.
      #
      # This token needs Actions WRITE on every fleet org, not just read: the
      # dispatch below is a POST. A read-only pool member fails the dispatch for
      # every selected host, which the script turns into a red run rather than a
      # quiet no-op.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0
      - name: Checkout upstream main
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch warm-up to the unproven hosts
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          TARGET: ${{ inputs.target || '20' }}
          MAX_HOSTS: ${{ inputs.max_hosts || '4' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          WARMUP_LIST_VAR: ${{ inputs.list_var || 'PPAP_CI_REPOS' }}
        run: |
          set -uo pipefail
          # The fleet list is read from the repo VARIABLE, never inlined here:
          # PPAP_CI_REPOS grew from 3 repos to 16, and a stale literal would
          # probe a fraction of the fleet while reporting it proven. The script
          # itself refuses an empty list rather than reporting success.
          case "$WARMUP_LIST_VAR" in
            PPAP_CI_REPOS|PPAP_WARMUP_REPOS) ;;
            *) echo "::error::list_var must be PPAP_CI_REPOS or PPAP_WARMUP_REPOS, got '$WARMUP_LIST_VAR'"; exit 1 ;;
          esac
          REPOS="$(gh api "repos/NamThuanVn/erp-namthuan/actions/variables/$WARMUP_LIST_VAR" --jq .value 2>/dev/null || true)"
          if [ -z "$REPOS" ]; then
            echo "::error::$WARMUP_LIST_VAR is unset on NamThuanVn/erp-namthuan — there is no fleet to warm up"
            exit 1
          fi
          export "$WARMUP_LIST_VAR=$REPOS"
          node scripts/ci/warmup-fleet.mjs
