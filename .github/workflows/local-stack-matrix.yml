name: Local Stack · macOS / Linux / Windows

# Boots the LOCAL-DEV stack exactly the way a developer does on a fresh clone —
# `pnpm worktree:init`, then `pnpm dev:lite` — on all three platforms, and
# asserts it actually serves. NOTHING else runs here: no unit tests, no e2e, no
# lint, no build. The only question this answers is
#
#     "does a fresh checkout come up on this OS?"
#
# The other checks already have homes (ci-checks.yml). What they do NOT cover is
# the local developer path: worktree:init's bootstrap, db:reset across 13 D1s,
# link-monolith's ~360 per-file symlinks (Windows needs symlink privilege for
# FILE links — junctions only cover dirs), and the bash-3.2/Git-Bash assumptions
# in scripts/serve-monolith.sh. Those break per-OS, silently, and only a real
# boot finds it.
#
# THE MCP WIRING IS IN SCOPE. `worktree:init`'s last three steps register the
# Claude Code MCP servers, and scripts/mcp-{sentry,playwright}.sh hard-fail
# without the `claude` CLI while mcp-databases.sh needs `uv` (it skips with a
# hint otherwise). So this workflow installs BOTH toolchains up front and then
# asserts, per OS, that every expected server actually landed in the registry —
# a missing tool must be a red job, never a quiet skip. That is deliberately
# the only place in CI where the Claude Code CLI is installed as a dependency
# under test rather than as an agent runtime.
#
# WHY IT LIVES IN PPAP: macOS runners bill at 10× and Windows at 2× of Linux
# minutes on a PRIVATE repo. On a PUBLIC ppap repo every OS is free — the same
# economics that put the rest of CI here (.claude/ppap.md).
#
# WHY NOT NAMED ci-*.yml: sync-workflows-to-ppap.yml mirrors `ci-*.yml` to every
# repo in PPAP_CI_REPOS. This is not a per-PR gate and must not eat a fleet
# org's 20-concurrent-job budget, so the non-`ci-` name keeps it in
# NamThuanVn/ppap only (the full-set target).
#
# HOW TO RUN: NamThuanVn/ppap → Actions → this workflow → "Run workflow".
# Pick a ref to boot, and optionally narrow to one OS (Windows is the usual
# suspect, and re-running just that leg is cheap). The weekly cron catches
# environment rot nobody would otherwise notice until a developer hits it: a
# runner-image Node bump, a new API leaf missing from monolith/api, a script
# that grew a Linux-only assumption.
#
# USE `main` AS checkout_ref. It must be a ref in NamThuanVn/erp-namthuan (a
# fork-only branch fails with `couldn't find remote ref`), and a PR merge ref is
# a trap: this repo auto-merges agent PRs on green, and merging DELETES
# refs/pull/<N>/merge. Three verification runs died at `actions/checkout` that
# way — one 20s after dispatch, the PR having merged between dispatch and
# checkout — skipping every real step while looking like a genuine failure.
# Land the fix, then verify against main. See .claude/ppap.md § Local-stack matrix.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'NamThuanVn/erp-namthuan ref to boot. Keep `main` — a fork-only branch does not resolve, and a PR merge ref is deleted the moment the PR auto-merges.'
        type: string
        required: false
        default: main
      platforms:
        description: 'Runners to boot on.'
        type: choice
        required: false
        default: all
        options:
          - all
          - ubuntu-latest
          - macos-latest
          - windows-latest
  schedule:
    # Mondays 06:00 UTC — before the week starts, after any weekend image roll.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# One run per ref: a re-dispatch supersedes an in-flight boot of the same ref.
concurrency:
  group: local-stack-${{ inputs.checkout_ref || 'main' }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  # Pre-seed init.defaultBranch so actions/checkout's internal `git init` stops
  # printing the "hint: git config --global init.defaultBranch" line. Same
  # cosmetic fix as ci-checks.yml.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # The `platforms` input can't be interpolated straight into `strategy.matrix`
  # (matrices are resolved before job-level expressions), so one tiny job turns
  # the choice into the matrix JSON. Also normalizes the cron trigger, where
  # `inputs` is empty, to all three.
  resolve:
    name: 0 · Resolve runners
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          SELECTION: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          if [ "$SELECTION" = all ]; then
            os='["ubuntu-latest","macos-latest","windows-latest"]'
          else
            os="[\"$SELECTION\"]"
          fi
          echo "os=$os" >>"$GITHUB_OUTPUT"
          echo "Booting on: $os"

  boot:
    needs: resolve
    name: 1 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows install + 13 D1 migrations + a Turbopack cold compile is the slow
    # corner; 60 leaves headroom without letting a hung boot burn an hour.
    timeout-minutes: 60
    strategy:
      # Never cancel siblings: "Linux fine, Windows broken" is the whole point.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.resolve.outputs.os) }}
    defaults:
      run:
        # Every script under test is bash. windows-latest defaults to pwsh, so
        # pin bash (Git Bash ships on the image and is what a Windows developer
        # uses per README's Quick Start).
        shell: bash
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - name: Checkout erp-namthuan
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref || 'main' }}
          persist-credentials: false

      # Deliberately NOT ./.github/actions/install. That action pre-creates
      # node_modules, and `pnpm worktree:init` IS the install path under test —
      # it bootstraps ensure-local-env (which writes the Windows
      # node-linker=hoisted .npmrc BEFORE installing) and then `pnpm install`,
      # exactly like a new developer's first run. Here we only put pnpm + Node
      # on PATH; `cache: pnpm` warms the pnpm STORE, which speeds the install up
      # without skipping it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
        env:
          NODE_OPTIONS: --no-deprecation

      # ── worktree:init's MCP dependencies ────────────────────────────────────
      # Installed BEFORE init so its mcp:* steps do the real thing.
      #
      # Claude Code via npm, not the native installer: npm also drops an
      # extensionless `claude` sh shim, which is what `command -v claude` in
      # scripts/mcp-*.sh needs to find under Git Bash on Windows. Registration
      # (`claude mcp add/get/list`) is config-file work — no login required, and
      # no token is used anywhere in this workflow.
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      # uv backs mcp-databases.sh (`uvx mcp-server-sqlite`). Official installer
      # rather than a third-party action: the ppap repos run an allowed-actions
      # policy (.claude/ppap.md § Public-repo security hardening), so adding an
      # action would need a policy change; a script needs none. Same command the
      # script itself prints when uv is missing.
      - name: Install uv
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "irm https://astral.sh/uv/install.ps1 | iex"
            printf '%s\n' "$USERPROFILE\\.local\\bin" >>"$GITHUB_PATH"
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
            printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"
          fi

      - name: Print toolchain
        run: |
          echo "os        : ${{ matrix.os }} ($(uname -s 2>/dev/null || echo windows))"
          echo "node      : $(node -v)"
          echo "pnpm      : $(pnpm -v)"
          echo "bash      : $BASH_VERSION"
          echo "claude    : $(claude --version 2>&1 | head -1)"
          echo "uv        : $(uv --version 2>&1 | head -1)"
          # Fail here rather than 15 minutes later inside worktree:init, where
          # the same miss reads as an unrelated init failure.
          for tool in node pnpm claude uv npx; do
            command -v "$tool" >/dev/null 2>&1 || { echo "❌  '$tool' is not on PATH"; exit 1; }
          done

      # `--verbose` swaps @clack's per-step spinners for each step's raw output.
      # Two reasons: the log IS the deliverable of this workflow, and a spinner
      # has no TTY to render into on a runner.
      #
      # This runs ALL seven steps for real: machine-check → install → (db:reset ∥
      # codegraph index) → mcp:sentry → mcp:playwright → mcp:databases. With
      # claude + uv present above, none of the mcp:* steps take their skip path.
      - name: pnpm worktree:init
        # Per-step cap so a step that WAITS (rather than fails) surfaces in ~25
        # min instead of eating the job's whole hour: the mcp:* steps shell out
        # to `claude`, and an unexpected interactive prompt would otherwise hang.
        timeout-minutes: 25
        env:
          # Force the COLD migration path. This workflow exists to prove a
          # from-scratch three-OS bootstrap still works; letting db:reset restore
          # ppap's pre-migrated snapshot would skip the very thing under test and
          # leave the cold path with no regression guard anywhere. The snapshot
          # restore path gets continuous coverage instead from every PR's
          # e2e-seed job and every agent-clear-todo run.
          DB_SNAPSHOT: '0'
        run: pnpm worktree:init --verbose

      # worktree:init exits 0 on a SKIPPED mcp step (mcp-databases.sh prints a
      # hint and exits 0 when uv is missing), so green init is not proof the
      # registry was written. Assert it directly, per OS.
      - name: Assert MCP servers registered
        run: |
          set -uo pipefail

          echo "── claude mcp list ──"
          # Newer CLIs probe each server and print a connect status; sentry is
          # unauthenticated here, so match on NAMES only — registration is what
          # worktree:init is responsible for, not a live session.
          claude mcp list 2>&1 | tee mcp-list.txt || true
          echo ""

          # sentry     → user scope   (mcp-sentry.sh)
          # playwright → local scope  (mcp-playwright.sh)
          # codegraph  → project scope, from the committed .mcp.json
          # sqlite-*   → one per D1-backed service (mcp-databases.sh, needs uv
          #              AND the sqlite files db:reset just created)
          missing=""
          for server in sentry playwright codegraph sqlite-auth sqlite-hris; do
            if grep -q "$server" mcp-list.txt; then
              echo "✓  $server"
            else
              echo "✗  $server — NOT registered"
              missing="$missing $server"
            fi
          done

          # The codegraph index is the other half of that init step.
          if [ -d .codegraph ]; then
            echo "✓  .codegraph/ index built"
          else
            echo "✗  .codegraph/ missing — mcp:codegraph did not index"
            missing="$missing codegraph-index"
          fi

          if [ -n "$missing" ]; then
            echo ""
            echo "❌  worktree:init finished green but these did not register:$missing"
            echo "    (mcp-databases.sh exits 0 when uv is absent — check the uv step above)"
            exit 1
          fi

          # Registration is config-file work; this proves the wiring RUNS. The
          # `claude mcp list` health check spawns each server, so one line with a
          # connected status is end-to-end evidence: uv resolved, `uvx
          # mcp-server-sqlite` launched, and the D1 file db:reset produced is
          # readable at the absolute path mcp-databases.sh recorded.
          #
          # Only sqlite-auth is gated. `sentry` legitimately reports "Needs
          # authentication" (no OAuth in CI, by design) and the npx-backed
          # servers depend on a registry download, so demanding a green status
          # from all of them would trade signal for flake.
          if grep -E 'sqlite-auth.*(Connected|✔)' mcp-list.txt >/dev/null 2>&1; then
            echo "✓  sqlite-auth connects (uv + uvx + the seeded D1 file all work)"
          else
            echo "❌  sqlite-auth is registered but does not connect:"
            grep sqlite-auth mcp-list.txt || true
            exit 1
          fi

          echo ""
          echo "🎉  MCP wiring complete on ${{ matrix.os }}."

      - name: Show what init produced
        run: |
          set -uo pipefail
          echo "── D1 files (should be one .sqlite per D1-backed service)"
          pnpm db:map || true
          echo "── monolith/app materialized?"
          node -e "const {existsSync}=require('node:fs');for(const p of['monolith/app/src/app','monolith/app/src/messages/en.json','monolith/app/.env.local'])console.log((existsSync(p)?'✓':'✗'),p)"

      # The one real assertion: boot `pnpm dev:lite` and prove the single origin
      # serves both halves — `/api/health` (proxy → API worker → gateway) and a
      # page (proxy → next). Boot + probe + teardown live in ONE step on purpose:
      # a background process surviving across steps is the least portable thing
      # in Actions, and keeping it in one shell makes all three OSes behave the
      # same.
      - name: pnpm dev:lite → serve on :3008
        # Both probes deadline at 300s, so 15 min is a hard backstop around them.
        timeout-minutes: 15
        run: |
          set -uo pipefail

          LOG=".wrangler/dev-lite.log"
          mkdir -p .wrangler

          pnpm dev:lite >"$LOG" 2>&1 &
          BOOT_PID=$!
          # Best-effort teardown. The runner is discarded either way; this just
          # stops a wedged child from holding the step open.
          trap 'kill "$BOOT_PID" 2>/dev/null || true' EXIT

          # probe <url> <deadline-seconds> <label>
          # Liveness via `kill -0` (same idiom as wait_for_port in
          # scripts/serve-monolith.sh, which already runs on Git Bash) so a dead
          # boot fails in seconds instead of burning the whole deadline.
          # 127.0.0.1, not localhost: the proxy binds dual-stack, but pinning
          # IPv4 removes the ::1-first resolution flake (.claude/testing.md).
          probe() {
            url="$1"; deadline="$2"; label="$3"; waited=0; code=""
            while [ "$waited" -lt "$deadline" ]; do
              if ! kill -0 "$BOOT_PID" 2>/dev/null; then
                echo "❌  the stack exited before $label answered"
                return 1
              fi
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)"
              case "$code" in
                2* | 3*) echo "✓  $label → HTTP $code after ${waited}s"; return 0 ;;
              esac
              sleep 2
              waited=$((waited + 2))
            done
            echo "❌  $label never answered within ${deadline}s (last status: '${code:-none}')"
            return 1
          }

          fail() {
            echo ""
            echo "════════ dev:lite log (tail) ════════"
            tail -60 "$LOG" 2>/dev/null || true
            echo "════════ API worker log (tail) ════════"
            tail -40 .wrangler/state/api.log 2>/dev/null || echo "(no api.log — the worker never started)"
            echo "════════ next log (tail) ════════"
            tail -40 .wrangler/state/next.log 2>/dev/null || echo "(no next.log — next never started)"
            exit 1
          }

          # /api/health: install + seed already happened in the previous step, so
          # this is just process startup — but Windows is slow, so 300s.
          probe "http://127.0.0.1:3008/api/health" 300 "/api/health" || fail

          # A page proves the `next` half AND the proxy's non-/api route. First
          # hit compiles the route on demand (Turbopack), which is the slowest
          # single thing in the run — hence the separate, generous deadline.
          probe "http://127.0.0.1:3008/en/login" 300 "/en/login (first hit compiles)" || fail

          echo ""
          echo "🎉  ${{ matrix.os }}: the local stack boots and serves."

      # Always upload: on failure these are the diagnosis, on success they show
      # how long each half took to come up.
      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-stack-${{ matrix.os }}
          path: |
            .wrangler/dev-lite.log
            .wrangler/state/api.log
            .wrangler/state/next.log
            .wrangler/logs/worktree-init/*.log
            mcp-list.txt
          if-no-files-found: warn
          retention-days: 7

  summary:
    needs: boot
    if: always()
    name: 2 · Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.boot.result }}
        run: |
          set -euo pipefail
          {
            echo "## Local stack boot — \`${{ inputs.checkout_ref || 'main' }}\`"
            echo ""
            echo "Per runner: \`pnpm worktree:init\` (install + db:reset + codegraph index"
            echo "+ all MCP servers registered and asserted) → \`pnpm dev:lite\` → probes of"
            echo "\`/api/health\` and \`/en/login\`."
            echo ""
            echo "Matrix result: **$RESULT** — per-OS detail is in the job list;"
            echo "boot logs are attached as artifacts."
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$RESULT" = success ] || exit 1
