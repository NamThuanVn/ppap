    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.variant == 'prod' && 'mobile-production' || 'mobile-staging' }}
    timeout-minutes: 60
    steps:
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
