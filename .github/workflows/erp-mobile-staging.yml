      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Release notes
        env:
          NOTES_PLATFORM: ios
          NOTES_BASE: ${{ needs.plan.outputs.ios_base }}
          NOTES_HEAD: ${{ needs.plan.outputs.sha }}
        run: bash scripts/ci/native/release-notes.sh | tee "$RUNNER_TEMP/notes.txt"

      # The one environment secret unlocks the encrypted NamThuanVn/mobile-secrets repo (its README).
      - name: Unlock the ios credentials
        env:
          MOBILE_SECRETS_PASSWORD: ${{ secrets.MOBILE_SECRETS_PASSWORD }}
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
        run: bash scripts/ci/native/unlock-secrets.sh ios

