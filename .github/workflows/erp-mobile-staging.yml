        if: always()
        run: rm -rf "$RUNNER_TEMP/mobile-secrets"

      - name: Record the built commit
        if: ${{ inputs.variant != 'prod' }}
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh variable set MOBILE_STG_IOS_LAST_BUILT_SHA --body "$SHA" -R "$GITHUB_REPOSITORY"
          echo "✓ MOBILE_STG_IOS_LAST_BUILT_SHA = $SHA"

