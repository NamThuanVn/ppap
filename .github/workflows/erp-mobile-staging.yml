        working-directory: apps/mobile
        env:
          VARIANT: ${{ inputs.variant || 'stg' }}
          NT_RELEASE_NOTES_FILE: ${{ runner.temp }}/notes.txt
        run: bundle exec fastlane ios beta "variant:$VARIANT"

