name: ERP · Hot files

# Daily measurement of the files that still conflict between lane PRs (issue
# #5784). `scripts/agent/merge/hot-files.mjs` replays every merge commit on the
# last 14 days of merged lane PRs with `git merge-tree`, marks a path hot when it
# conflicted in 2+ distinct PRs, and writes the list to the fleet hub's loop
# state under HOT_FILES — paths and PR numbers only. The claim step reads it from
# the hub at zero GitHub cost; nothing is committed to the repo.
#
# Dispatched once a day by the heartbeat (job `hot-files` in
# erp-heartbeat-schedule.json), never per loop tick: the PAT pool is shared.
# Readers fail open on a missing/stale key, so a red run here costs nothing.
#
# LIGHT bootstrap like erp-release-notes.yml: the script is Node built-ins plus
# `gh` and `git`, so no `pnpm install` — just the PAT pool and a full-history
# checkout (merge-tree needs the merge bases).
#
# Filename is deliberately NOT erp-ci-*.yml → the sync mirrors it to
# NamThuanVn/ppap only, never to the CI fleet.

run-name: ERP · Hot files

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hot-files
  cancel-in-progress: false

jobs:
  hot-files:
    name: Measure + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. Inlined
      # rather than calling scripts/ci/ppap/pat-pool.sh (the canonical copy —
      # keep the two in step) because the private-repo checkout itself needs a
      # token, so the pool cannot live behind it. GET /rate_limit does not count
      # against the limit, so probing every token is free.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      # fetch-depth: 0 — merge-tree replays merges whose parents sit anywhere in
      # history, and `refs/hot/*` heads are fetched on top of it.
      - name: Checkout upstream main
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Measure and publish HOT_FILES
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          git config user.name 'erp-hot-files'
          git config user.email 'erp-hot-files@users.noreply.github.com'
          node scripts/agent/merge/hot-files.mjs --publish
