name: Agent · loop heartbeat

# Standalone scheduled heartbeat for the agent loop, split OUT of agent-loop.yml
# so it can be enabled/disabled on its own from the Actions UI (Actions →
# "Agent · loop heartbeat" → ••• → Disable/Enable workflow) WITHOUT touching the
# event-driven controller.
#
# The loop is normally edge-triggered: every agent-clear-todo / rel-plan
# completion re-probes agent-loop via its `workflow_run` trigger, and a
# productive run chains the next lane immediately. This 15-min tick is a BACKSTOP
# for the one gap those can't cover — the controller job ITSELF getting
# spot-reclaimed right after the last run completed, so nothing re-triggers it.
#
# It does NOTHING but complete on schedule: agent-loop lists this workflow in its
# `workflow_run` trigger, so THIS run finishing IS the signal (no gh-api /
# repository_dispatch call, no token needed here). Frequent (15 min) is fine
# because this workflow is independently disableable — turn it off if it ever
# gets noisy; the event-driven loop keeps running either way.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

# One heartbeat at a time.
concurrency:
  group: agent-loop-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    name: Heartbeat tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tick
        run: echo "✓ heartbeat tick — agent-loop re-probes on this run's workflow_run completion"
