name: ERP · Pit wall

# Top-up controller for the self-perpetuating /clear-todo agent loop.
# Level-triggered: EVERY invocation recomputes K = min(candidates, cap − active)
# from live API state and fires K repository_dispatch[agent-car] events at its
# own repo (erp-agent-car.yml). It never carries state between invocations,
# so a lost or coalesced trigger is harmless — the next one recounts.
#
# Invoked several ways (all end up here):
#   · manually — workflow_dispatch on this workflow (gh workflow run
#     erp-agent-pit-wall.yml -R NamThuanVn/ppap);
#   · by ba-to-issues.yml in the private repo after a merged BA-docs PR minted
#     at least one sweepable (`bug`/`task`) issue;
#   · by each agent run that EXECUTED a solve-verdict (MERGED / PARK / SPLIT /
#     ABANDONED / BLOCKED with green executor steps) — the "Continue loop" step in
#     erp-agent-car.yml chains the next lane immediately (lowest latency);
#   · by the `workflow_run` trigger on ANY agent-clear-todo / rel-plan
#     completion — success, failure, cancelled, or spot-reclaimed. This is what
#     catches a run that DIED (the "Continue loop" step never fired) and
#     re-probes, so a failed lane no longer silently winds the loop down. It is
#     gated to repository_dispatch-origin completions (see the controller `if:`)
#     so a one-shot manual run doesn't auto-start the loop. Termination still
#     holds: when the backlog drains the probe dispatches 0, so no new run is
#     created → no new completion → nothing re-triggers;
#   · by erp-agent-qualifying.yml after a successful planning pass — the
#     rel-planning gate below defers lane dispatch to that chain whenever any
#     open BA leaf still lacks the `rel-planned` marker;
#   · by the `workflow_run` completion of erp-race-clock.yml (also in the
#     workflow_run list above) — a rare 15-min backstop for the
#     controller-self-reclaim gap, kept in its own workflow so it can be toggled
#     on/off from the Actions UI independently.
#
# Cap = repo variable AGENT_CAR_LIMIT (unset → 6) — a hard CEILING only. How
# many lanes actually run is computed every tick from the pool's own quota (see
# "Count active runs + dispatch top-up"), so there is no per-dispatch override:
# the old max_parallel input + its 24h sticky AGENT_CAP_OVERRIDE were retired
# once the budget became automatic.
# KILL SWITCH:
#   gh variable set AGENT_CAR_LIMIT -R NamThuanVn/ppap --body 0
# → this controller dispatches nothing; in-flight agents finish their current
# item and their lanes die (top-up yields 0). Keep the cap conservative: agent
# jobs occupy an org job slot for up to 330 min each, and NamThuanVn shares a
# 20-concurrent-job cap with the deploy graph (peaks 12–23 jobs) and fallback
# PR CI (see docs/engineering/platform/ppap-agent-runs.md § Agent runs).
#
# Hardening: triggers are repository_dispatch + workflow_dispatch ONLY (ppap
# public-repo rule). repository_dispatch requires a write-capable token, i.e.
# pool holders. All dispatches BY this workflow use a pooled PAT too —
# GITHUB_TOKEN-created events do not trigger workflows (same footgun class as
# release.yml's `gh release create`).

# No actor in the run-name: most ticks are pure automation (the 15-min schedule
# heartbeat, or a chained dispatch), and GitHub attributes those to the
# workflow's last committer — misleading. The native "triggered by <identity>"
# line already shows the real dispatcher underneath.
run-name: 'ERP · Pit wall'

on:
  # Primary recovery trigger: re-probe after EVERY agent-clear-todo / rel-plan
  # run completes — success, failure, cancelled, or spot-reclaimed. A productive
  # run still chains the next lane immediately via the "Continue loop" step
  # (lower latency than a workflow_run event); this trigger adds the cases that
  # step can't cover — a FAILED / cancelled / runner-reclaimed run that silently
  # ends a lane with no re-arm. That is exactly what the old */15 cron existed to
  # catch, now event-driven instead of polled. Gated in the controller `if:`
  # below to repository_dispatch-origin completions (loop participants) so a
  # one-shot manual run (workflow_dispatch, e.g. a human debugging one item)
  # never auto-starts the autonomous loop.
  #
  # This trigger fires on the very failures it recovers from, so on its own it
  # would re-spin the fleet at run-duration pace — which is exactly what it used
  # to do, bounded only by a human flipping AGENT_CAR_LIMIT=0. The bound is
  # now structural: the "Read loop hold" step runs FIRST and dispatches nothing
  # while a hold stands. A spent token pool holds until its window reopens; a
  # harness fault holds until an ambulance repairs it, for at most three
  # attempts. So a re-trigger on a failure is cheap — the controller looks, sees
  # the hold, and stops.
  #
  # An "ERP · Agent · ambulance" completion is in this list for the same reason a
  # lane completion is: an ambulance that dies without a verdict must still
  # re-arm the controller. That cannot loop, because the attempt is charged at
  # DISPATCH (scripts/agent/board/pit-wall/gate.mjs), not at verdict.
  # "ERP · Race clock" is the 15-min tick, now driven by the ERP's own Cloudflare
  # cron rather than a GitHub `schedule:` block (GitHub delayed and dropped those
  # — see that file's header). It fans out to the due scheduled workflows and
  # then completes; this workflow_run entry IS how its tick reaches the loop (no
  # gh-api/dispatch on that side). Its workflow_dispatch-origin completion is
  # allowed through the controller `if:` below by NAME (unlike clear-todo/
  # rel-plan, which are gated to repository_dispatch-origin so a one-shot manual
  # run can't start the loop).
  #
  # ⚠ THESE ARE DISPLAY NAMES, NOT FILENAMES. `workflow_run.workflows` matches
  # the `name:` at the top of each workflow — it is the ONE place in this tree
  # where a workflow's human-readable name is load-bearing. A name edited on one
  # side and not here matches nothing, GitHub raises no error, and the entire
  # agent loop simply stops chaining: every lane runs once and the controller is
  # never re-armed. Keep this list in lockstep with the four `name:` lines, and
  # note they now carry the `ERP · ` prefix that separates this repo's workflows
  # from website-namthuan's in the shared deploy repo.
  # Guarded by scripts/gate/ci/workflow-run-names.mjs.
  workflow_run:
    workflows:
      [
        'ERP · Car',
        'ERP · Qualifying',
        'ERP · Agent · ambulance',
        'ERP · Race clock',
      ]
    types: [completed]
  repository_dispatch:
    types: [agent-pit-wall]
  workflow_dispatch:
    # A non-empty `item` is a ONE-SHOT manual lane (the "Start lane" dialog on
    # /settings/admin/race-control): the `wildcard-car` job below places it on a host
    # and seals the bundle for it, and the loop's controller does not run. It
    # comes through here rather than straight to erp-agent-car.yml
    # because only this repo holds the secrets a fleet lane must be handed.
    inputs:
      item:
        description: 'Optional: issue URL/number, PR number, or docs/ba folder path → ONE manual lane on that item. Empty = an ordinary controller tick.'
        required: false
        default: ''
        type: string
      model:
        description: 'Manual lane only: --model override for the session.'
        required: false
        default: ''
        type: string
      claude_version:
        description: 'Manual lane only: Claude Code CLI version to install.'
        required: false
        default: ''
        type: string

permissions: read-all

# Coalescing debounce: at most one running + one queued controller; a third
# arrival replaces the queued one. Nothing is lost — whichever run executes
# recounts everything from live state. cancel-in-progress stays false: an
# in-flight dispatch burst must never be killed halfway.
#
# A manual lane gets a group of its own: queued behind `pit-wall`, the next
# controller tick would REPLACE it and the requested item would silently never
# start.
concurrency:
  group: ${{ (inputs.item || '') != '' && format('wildcard-car-{0}', github.run_id) || 'pit-wall' }}
  cancel-in-progress: false

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  AGENT_WORKFLOW: erp-agent-car.yml

jobs:
  controller:
    name: Top up agent pool
    # A workflow_run completion continues the loop when EITHER the finished run
    # is the heartbeat (the intended backstop tick, any origin) OR it was a loop
    # participant (repository_dispatch-driven clear-todo/rel-plan). A one-shot
    # manual agent-clear-todo (workflow_dispatch — a human debugging a single
    # item) must NOT auto-start the loop. Non-workflow_run triggers
    # (repository_dispatch, workflow_dispatch on THIS workflow) always proceed.
    # A manual lane (`item` set) is the `wildcard-car` job's, never a tick.
    if: >-
      (inputs.item || '') == '' && (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.name == 'ERP · Race clock' ||
        github.event.workflow_run.event == 'repository_dispatch'
      )
    runs-on: ubuntu-latest
    # A hung API call must not wedge the loop's concurrency slot for the
    # default 360 min — the job is a sparse checkout + the eligibility sweep
    # (a few dozen API calls on a big backlog) + a 20s settle.
    timeout-minutes: 10
    env:
      CAP_VAR: ${{ vars.AGENT_CAR_LIMIT || '' }}
      TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.actor }}
    steps:
      # The board scripts keep their run state here (dead-lanes.json is handed
      # from the dead-lane sweep to the stranded sweep through it). Set at STEP
      # level, never in `jobs.<id>.env`: `runner` is not a context there, and
      # GitHub rejects the whole workflow file rather than evaluating it to empty
      # — see the same note in erp-agent-car.yml.
      - name: Pin the harness state dir
        run: |
          set -euo pipefail
          echo "AGENT_STATE_DIR=${RUNNER_TEMP}/agent-state" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/agent-state"

      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      # Moved ahead of "Resolve cap" (issue #4543): that step now needs
      # scripts/ci/turbo-expiry.mjs to apply the turbo-mode effective-cap rule
      # before anything below reads its output. Board hygiene further down
      # still runs unconditionally, exactly as the comments there describe —
      # only the checkout itself moved earlier.
      - name: Checkout board scripts (sparse)
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          fetch-depth: 1
          # The whole `scripts` tree: this job runs scripts/ci/turbo-expiry.mjs
          # and scripts/ci/manual-expiry.mjs ("Resolve cap"), scripts/ci/ppap/pat-pool.sh
          # ("Resolve PAT pool logins") AND scripts/agent/board/*.mjs, and the
          # board scripts import a sibling lib/api.mjs.
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve cap
        id: cap
        env:
          AGENT_TURBO_UNTIL: ${{ vars.AGENT_TURBO_UNTIL }}
          AGENT_TURBO_RESTORE_LIMIT: ${{ vars.AGENT_TURBO_RESTORE_LIMIT }}
          AGENT_TURBO_MAX: ${{ vars.AGENT_TURBO_MAX || '30' }}
          AGENT_MANUAL_UNTIL: ${{ vars.AGENT_MANUAL_UNTIL }}
          AGENT_MANUAL_CARS: ${{ vars.AGENT_MANUAL_CARS }}
        run: |
          set -euo pipefail
          CAP="${CAP_VAR:-6}"
          MODE=normal

          if ! printf '%s' "$CAP" | grep -qE '^[0-9]+$'; then
            echo "::error::cap '$CAP' is not a non-negative integer (AGENT_CAR_LIMIT)"
            exit 1
          fi

          # The kill switch wins outright, manual mode and turbo mode included —
          # checked on the RAW AGENT_CAR_LIMIT value before any override
          # below can raise it back up (precedence: Pause > hold > exhausted
          # pool > manual > thermostat > turbo > normal; the thermostat is its
          # own step, after the hold).
          if [ "$CAP" -eq 0 ]; then
            echo "::notice::cap is 0 (kill switch) — dispatching nothing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "cap=0" >> "$GITHUB_OUTPUT"
            echo "mode=normal" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Manual mode outranks turbo mode (issue #4744, this slice #4789). It
          # never writes AGENT_CAR_LIMIT, so there is nothing to restore on
          # expiry: an expired AGENT_MANUAL_UNTIL just stops applying and falls
          # through to the turbo-mode check below, same as if it had never
          # been set — the heartbeat's own "Clear manual mode after it expires"
          # step deletes the pair on its next tick.
          MANUAL_VERDICT=$(node scripts/ci/manual-expiry.mjs \
            --manual-until "$AGENT_MANUAL_UNTIL" --manual-lanes "$AGENT_MANUAL_CARS")
          MANUAL_STATE=$(printf '%s' "$MANUAL_VERDICT" | cut -f1)
          MANUAL_CARS=$(printf '%s' "$MANUAL_VERDICT" | cut -f2)
          MANUAL_REASON=$(printf '%s' "$MANUAL_VERDICT" | cut -f3-)

          if [ "$MANUAL_STATE" = not-expired ] && [ -n "$AGENT_MANUAL_UNTIL" ]; then
            echo "::notice::manual mode active until $AGENT_MANUAL_UNTIL — effective cap is $MANUAL_CARS lane(s), ignoring AGENT_CAR_LIMIT ($CAP) and turbo mode"
            MODE=manual
            CAP="$MANUAL_CARS"
          else
            if [ "$MANUAL_STATE" = expired ]; then
              echo "::notice::$MANUAL_REASON — manual mode no longer applies this tick"
            fi

            # turbo mode's expiry is enforced here too, not only by the
            # heartbeat's restore step (issue #4538 Part B / #4543): an expired
            # AGENT_TURBO_UNTIL must hold THIS run to the restore cap even
            # before the heartbeat's next tick (up to 15 minutes later) writes
            # AGENT_CAR_LIMIT back down — otherwise a stale
            # AGENT_CAR_LIMIT=12 lets the loop dispatch 12 lanes off a window
            # that already closed.
            VERDICT=$(node scripts/ci/turbo-expiry.mjs \
              --turbo-until "$AGENT_TURBO_UNTIL" --restore-cap "$AGENT_TURBO_RESTORE_LIMIT")
            STATE=$(printf '%s' "$VERDICT" | cut -f1)
            RESTORE_CAP=$(printf '%s' "$VERDICT" | cut -f2)
            REASON=$(printf '%s' "$VERDICT" | cut -f3-)
            if [ "$STATE" = expired ]; then
              echo "::notice::$REASON — using the restore cap for this run"
              CAP="$RESTORE_CAP"
            elif [ -n "$AGENT_TURBO_UNTIL" ]; then
              # turbo mode is genuinely active (not expired, and the variable is
              # actually set — turbo-expiry.mjs also reports "not-expired" when
              # it's unset). The effective dispatch cap becomes AGENT_TURBO_MAX
              # itself — AGENT_CAR_LIMIT (today's AGENT_CRAZY_CAP write) no
              # longer bounds it (#4690 Decision 2). Cars still only go out
              # while some Claude account has ≥20% fuel left.
              echo "::notice::turbo mode active until $AGENT_TURBO_UNTIL — effective cap is AGENT_TURBO_MAX ($AGENT_TURBO_MAX), overriding AGENT_CAR_LIMIT ($CAP)"
              MODE=turbo
              CAP="$AGENT_TURBO_MAX"
            fi
          fi

          if [ "$CAP" -eq 0 ]; then
            echo "::notice::cap is 0 — dispatching nothing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cap=$CAP — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # The claim script's own eligibility sweep runs the probe (COUNT_ONLY):
      # leaf marker + board Todo + unassigned + no open blockers — the SAME
      # rules the claim step enforces, so K never over-provisions. The old
      # label count treated batch mains, parked (Pending) leaves, and blocked
      # leaves as candidates — observed 6 lanes dispatched for 2 claimable
      # tasks, 4 dying at the claim step. It also counts genuinely-Todo
      # `feature` leaves now (a human promoting a feature to Todo makes it
      # claimable — the old blanket exclusion was an artifact of the dumb
      # count). Still racy vs in-flight sibling lanes by design: the atomic
      # claim stays the authority; a raced candidate costs one cheap
      # backlog-empty run.

      # NOT gated on the cap: the stranded sweep below must tick even while the
      # kill switch (AGENT_CAR_LIMIT=0) holds dispatch at zero — otherwise a
      # switch flip while a lane was mid-item leaves that item assigned + In
      # Progress with nothing left to release it.
      #
      # Stranded-claim sweep — release items whose backing run is provably dead
      # (assigned to us + In Progress/Todo + last claimed > STRANDED_HOURS ago,
      # which must exceed erp-agent-car.yml's timeout-minutes). A hosted-
      # runner reclaim skips the in-job tow-in-or-revert (always() does not
      # survive a runner shutdown), stranding the item; this is the decoupled
      # backstop. Runs BEFORE the count so a released item is a candidate this
      # same tick, and BEFORE the cap gate so the kill switch can't suspend
      # board hygiene. Best-effort, never reds the controller.
      # Every login in the PAT pool, so the sweep below can see a claim held by
      # ANY pooled account — not just the one this tick authenticated as. Without
      # it, a pool silently breaks the sweep: lane A claims as account X, the
      # controller runs as Y, and X's stranded items are never released.
      # Best-effort: on failure AGENT_LOGINS stays empty and the sweep falls back
      # to its own login (single-PAT behaviour).
      - name: Resolve PAT pool logins
        id: logins
        continue-on-error: true
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          L=$(bash scripts/ci/ppap/pat-pool.sh --logins || true)
          echo "AGENT_LOGINS=$L" >> "$GITHUB_ENV"
          echo "claim owners: ${L:-<none — sweep uses its own login>}"

      # ── Dead-lane sweep: the EXTERNAL dead-man's switch ───────────────────
      # A lane the RUNNER killed (OOM 137, SIGTERM 143, lost communication) never
      # runs its own `always()` steps — not "Capture failure", not "Salvage or
      # revert", not even "Notify Telegram on failure". So the fleet used to lose
      # the item AND the alert AND the classification on exactly the failure mode
      # that was killing most lanes. Classifying from out here is the only place
      # it can be done, and it must run BEFORE the stranded sweep, which consumes
      # its dead-lanes.json to release those claims without a grace period.
      # ── Board sweeps: once per race-clock interval, not every tick ─────────
      # This controller fires on every lane completion, race-clock tick and cap
      # change (~10/h at five cars), and the five sweeps below re-read the board on
      # the NamThuanVn App quota each time — the same 5,000/h every lane spends on
      # its writes. They repair things measured in hours, so one pass per
      # AGENT_SWEEP_EVERY_MIN (default 15) is enough. The stamp is compare-and-swap
      # in the fleet hub, so ticks that start together cannot both sweep. Fails
      # open: hub off or unreachable → sweep, as before. A manual run always sweeps.
      - name: Decide board sweeps
        id: sweep
        env:
          EVENT_NAME: ${{ github.event_name }}
          AGENT_SWEEP_EVERY_MIN: ${{ vars.AGENT_SWEEP_EVERY_MIN || '15' }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/pit-wall/sweep-due.mjs

      - name: Sweep dead lanes
        id: dead
        if: steps.sweep.outputs.due != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
          AGENT_CRASH_LOOKBACK_H: ${{ vars.AGENT_CRASH_LOOKBACK_H || '3' }}
        run: node scripts/agent/board/recover/sweep-crashed-cars.mjs

      # The alert the dead lane could not send for itself. Gated on held_first so
      # a teardown that kills six lanes at once pages once — the hold coalesces
      # them by fingerprint, exactly as the in-lane notify does.
      - name: Notify Telegram on a torn-down lane
        if: steps.dead.outputs.held_first == 'true'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          CLASSES: ${{ steps.dead.outputs.classes }}
          DEAD_RUN_URL: ${{ steps.dead.outputs.run_url }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Telegram not configured — skipping notify."
            exit 0
          fi
          TEXT="🤖🚨 <b>Agent lane torn down by the runner</b> — ${CLASSES:-unknown}"
          TEXT="${TEXT}"$'\n'"The loop is held; an ambulance is being dispatched."
          TEXT="${TEXT}"$'\n'"<a href=\"${DEAD_RUN_URL}\">View the killed run</a>"
          THREAD_ARGS=()
          if [ -n "${THREAD_ID:-}" ]; then THREAD_ARGS=(-d "message_thread_id=${THREAD_ID}"); fi
          curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            && echo "✓ Telegram torn-down alert sent." \
            || echo "::warning::Telegram notify failed."
          exit 0

      - name: Reclaim stranded items
        if: steps.sweep.outputs.due != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          STRANDED_HOURS: ${{ vars.STRANDED_HOURS || '6' }}
          AGENT_LOGINS: ${{ env.AGENT_LOGINS }}
          FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          # In `on` the candidates, their board status and the live lanes come from
          # the hub instead of an issue list per pool login + a GraphQL read per item.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/claim/reclaim-stranded.mjs

      # A salvage PR is dead the moment its issue closes — the work either
      # landed through a later claim or was decided against, and the branch is
      # protecting nothing. Left open they accumulate one per interrupted run
      # and, because a PR is a board item too, they bury the In-Progress column:
      # after the 2026-08-28…30 pool-exhaustion burst, 21 of 24 open PRs and 21
      # of 31 In-Progress cards were superseded salvages. Swept here rather than
      # from finalize-merged because most items close with no executor at all
      # (a `Closes #` trailer, a lost verdict, a human).
      - name: Reap superseded salvage PRs
        if: steps.sweep.outputs.due != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
        run: node scripts/agent/board/recover/reap-tow-in.mjs

      # #4338 stops NEW merged-head leftovers at merge time; this drains the
      # existing pile (615 branches as of 2026-09-28) and catches anything
      # #4338 misses (a delete that 403'd, a merge that landed another way). A
      # branch is deleted only when a PR for it is MERGED and its tip never
      # moved since — see docs/engineering/platform/ppap-agent-runs.md §
      # Reaping merged heads.
      - name: Reap merged-head branches
        if: steps.sweep.outputs.due != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/recover/reap-merged-heads.mjs

      # The ONE place a parent closes: any open issue whose sub-issues are all
      # closed is closed + flipped Done, a whole chain in one pass. Decided by
      # the sub-issue edge, never a body marker, so a hand-made split closes
      # too — see scripts/agent/board/pit-wall/close-parents.mjs.
      - name: Close finished parents
        if: steps.sweep.outputs.due != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
        run: node scripts/agent/board/pit-wall/close-parents.mjs

      # ── Loop hold: the FIRST question, before the backlog matters ─────────
      # A lane that died outside its Claude session left a `harness-broken` hold;
      # a spent token pool left a timed `pool-exhausted` one. Either way no lane
      # can make progress, and this workflow's `workflow_run: [completed]`
      # trigger fires on those very failures — which is how a broken harness used
      # to re-spin the fleet at bootstrap pace until a human flipped the kill
      # switch. Now: dispatch nothing, and for a harness fault dispatch ONE
      # ambulance to reproduce and repair the root cause. Fix the problem before
      # continuing the loop.
      #
      # Placed AFTER the stranded sweep on purpose — board hygiene must keep
      # running while the loop is held, exactly as it does under the kill switch.
      # It also publishes how many Claude accounts are usable, which the dispatch
      # step folds into K.
      - name: Read loop hold
        id: hold
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.actor }}
          # NT quota hold threshold, % of the hourly limit left (unset → 15).
          AGENT_NT_FLOOR_PCT: ${{ vars.AGENT_NT_FLOOR_PCT || '' }}
          # The fleet hub's NT sample stands in when the header read fails
          # (lib/nt-quota.mjs chooseNtReading).
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/pit-wall/gate.mjs

      # ── The NT thermostat (#6134) ─────────────────────────────────────────
      # Sizes the fleet from NT's hourly quota: cuts to lowCars when NT runs
      # hot, restores after the reset, grows a step per window while it stays
      # cool — never above AGENT_CAR_LIMIT, which it never writes. Manual mode
      # is untouched; turbo is clamped (precedence: Pause > hold > exhausted
      # pool > manual > thermostat > turbo / normal). The live reading is the
      # gate's NT reading (a real call's headers, or the hub sample when there
      # is none); history and the stored level come from the
      # fleet hub, so this costs no GitHub call. Config: AGENT_THERMOSTAT
      # (race-control cockpit). Best-effort: if it dies, its `cap` output is
      # empty and the dispatch below uses the mode's cap, exactly as before.
      - name: NT thermostat
        id: thermostat
        if: steps.cap.outputs.proceed == 'true' && steps.hold.outputs.proceed == 'true'
        continue-on-error: true
        env:
          CAP: ${{ steps.cap.outputs.cap }}
          MODE: ${{ steps.cap.outputs.mode }}
          AGENT_THERMOSTAT: ${{ vars.AGENT_THERMOSTAT }}
          NT_REMAINING: ${{ steps.hold.outputs.nt_remaining }}
          NT_LIMIT: ${{ steps.hold.outputs.nt_limit }}
          NT_RESET: ${{ steps.hold.outputs.nt_reset }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/pit-wall/thermostat.mjs

      # ── Refresh a STALE pool probe before sizing K ────────────────────────
      # AGENT_FUEL_STATE is written by each lane's own pre-claim probe, so after a
      # quiet spell (or on a manual start) it is older than its 15-min TTL and the
      # gate above publishes an empty usable_accounts. The dispatch step
      # used to read "unknown" as "uncapped" — controller 36113823869 sent 6 lanes
      # at ONE account off a 79-min-old probe, and all 6 died on its usage limit.
      # So the controller measures the pool itself in exactly that case: the same
      # PROBE_ONLY pass a lane runs (real 5h/7d quota via the usage endpoint, at
      # zero model cost; the haiku ping only as a per-account fallback), published
      # the same way, so the lanes that follow reuse it too.
      #
      # Best-effort: a probe that cannot answer leaves the outputs empty and the
      # dispatch step falls back to ONE lane, which re-probes on its own.
      - name: Probe Claude pool (stale cache only)
        id: pool
        if: steps.cap.outputs.proceed == 'true' && steps.hold.outputs.proceed == 'true' && steps.hold.outputs.usable_accounts == ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
          AGENT_FUEL_PROBE: ${{ vars.AGENT_FUEL_PROBE || '1' }}
          # The fuel cut-offs (percent USED; 80 = an account takes cars while it
          # has ≥20% left). Defaults here MUST agree with DEFAULT_THRESHOLDS in
          # scripts/agent/run/usage.mjs, claude.sh's own fallbacks and
          # secret-bundle.mjs VAR_DEFAULTS.
          AGENT_FUEL_MAX_5H_PCT: ${{ vars.AGENT_FUEL_MAX_5H_PCT || '100' }}
          AGENT_FUEL_MAX_7D_PCT: ${{ vars.AGENT_FUEL_MAX_7D_PCT || '100' }}
          AGENT_FUEL_WARN_5H_PCT: ${{ vars.AGENT_FUEL_WARN_5H_PCT || '75' }}
          AGENT_FUEL_WARN_7D_PCT: ${{ vars.AGENT_FUEL_WARN_7D_PCT || '100' }}
          PROBE_ONLY: '1'
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          # Always the newest release, like every other agent workflow.
          CLAUDE_VERSION: 'latest'
        run: |
          set -uo pipefail
          # Only the per-account fallback probe needs the CLI; a failed install
          # just means that fallback reports the account as available.
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION" >/dev/null 2>&1 \
            && export PATH="$HOME/.local/bin:$PATH" \
            || echo "::warning::Claude CLI install failed — the fallback probe cannot run"
          RC=0
          bash scripts/agent/run/claude.sh || RC=$?
          node scripts/agent/board/pit-wall/publish-pool.mjs || true
          F="${AGENT_STATE_DIR}/pool-state.json"
          if [ ! -s "$F" ]; then
            echo "::warning::pool probe wrote nothing (rc=$RC) — dispatch falls back to one lane"
            exit 0
          fi
          USABLE=$(jq -r '(.available // 0) + (.warn // 0)' "$F")
          echo "usable_accounts=$USABLE" >> "$GITHUB_OUTPUT"
          echo "- fresh probe: $USABLE usable account(s) (rc=$RC)"

      - name: Count claimable candidates
        id: count
        if: steps.cap.outputs.proceed == 'true' && steps.hold.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          COUNT_ONLY: '1'
          # The probe and the claim walk must see the same cap, or the probe counts
          # items the lanes refuse (claimable.mjs header). Unset → todo.mjs default.
          AGENT_TEAMMATE_CAP: ${{ vars.AGENT_TEAMMATE_CAP }}
          # In scope even though COUNT_ONLY never touches the fork: every step
          # that runs a board script passes it, so nothing depends on which code
          # path happens to avoid it. scripts/gate/ci/agent-board-env.mjs enforces.
          FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          # Without it the probe read GitHub every tick — 8 label listings plus one
          # GraphQL read per unassigned leaf, ~48 PAT calls — although the hub has
          # served the sweep and every leaf's edges since #5587.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/claim/todo.mjs

      - name: Probe private-repo backlog (exact eligibility)
        id: probe
        if: steps.cap.outputs.proceed == 'true' && steps.hold.outputs.proceed == 'true'
        env:
          TOTAL: ${{ steps.count.outputs.eligible || '0' }}
          CRITICAL: ${{ steps.count.outputs.critical }}
        run: |
          set -euo pipefail
          echo "candidates=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::notice::backlog empty (no Todo · unassigned · unblocked leaf) — dispatching nothing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ $TOTAL claimable candidate(s)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rel-planning gate: lanes must not start while ANY open BA leaf lacks
      # the `rel-planned` marker — the scripted claim respects blockedBy edges
      # but PLANNING is what sets them (Phase 0-pre's planning half, shared
      # skill /order-todo-queue). Unplanned leaves → dispatch ONE agent-qualifying
      # run INSTEAD of lanes; on success it re-dispatches agent-pit-wall, and this
      # gate then passes. All three kinds are swept (a bug can be blocked by a
      # feature) by scripts/agent/board/pit-wall/unplanned.mjs, which the planner's
      # sweep and its coverage recount call too — one definition, so the gate
      # and the planner can no longer ping-pong over a leaf one counts and the
      # other refuses to plan (batch mains and SPLIT-decomposed originals are
      # excluded there, and the module says why).
      # An unreadable backlog dispatches NOTHING: a count that silently missed
      # a label reads as "all planned" and would send lanes at unplanned work.
      # Duplicate gate dispatches coalesce
      # in agent-qualifying's concurrency group (the extra run no-ops + chains).
      - name: Sweep unplanned leaves
        id: relsweep
        if: steps.probe.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          # One fleet-hub read instead of one GitHub listing per label; GitHub when
          # the hub cannot vouch for every open issue (scripts/agent/board/pit-wall/unplanned.mjs).
          UNPLANNED_SOURCE: hub
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/pit-wall/unplanned.mjs

      # A rate-limited dispatch skips the tick instead of failing the controller
      # (ppap run 37741799957) — see the script's header.
      - name: Rel-planning gate
        id: relplan
        if: steps.probe.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.actor }}
          UNPLANNED: ${{ steps.relsweep.outputs.unplanned }}
          READABLE: ${{ steps.relsweep.outputs.readable }}
        run: node scripts/agent/board/pit-wall/qualifying-gate.mjs

      # The sealed bundle a FLEET lane opens in its "Load lane config" step: this
      # repo's Claude pool + Telegram secrets + the AGENT_* settings, encrypted
      # with a key derived from PAT_TOKEN_POOL (identical on every fleet repo), so
      # no fleet repo ever has to hold them. Sealed only when lanes go to the
      # fleet: with AGENT_CAR_HOSTS unset the lanes run here and read this
      # repo's secrets directly, exactly as before — rollback is one variable.
      # See scripts/agent/run/secret-bundle.mjs for why the payload must be sealed.
      - name: Seal lane bundle
        if: steps.relplan.outputs.proceed == 'true' && vars.AGENT_CAR_HOSTS == 'fleet'
        env:
          PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BUILD_THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          B=$(node scripts/agent/run/secret-bundle.mjs build)
          echo "LANE_BUNDLE=$B" >> "$GITHUB_ENV"
          echo "✓ lane bundle sealed (${#B} chars)"

      # Count live lanes on EVERY host (this repo + the CI fleet), compute K
      # (scripts/ci/dispatch-k.mjs, unchanged), place each new lane on a host and
      # dispatch it — scripts/agent/board/pit-wall/dispatch-cars.mjs owns all four;
      # its header says why lanes left this repo. AGENT_CAR_HOSTS=fleet places
      # on the fleet at AGENT_CARS_PER_CIRCUIT (default 2) per host; unset places
      # here, the old behaviour.
      - name: Count active runs + dispatch top-up
        if: steps.relplan.outputs.proceed == 'true'
        env:
          # Reads now cross repos, so the pooled PAT does both reads and writes
          # (GITHUB_TOKEN events don't trigger workflows anyway).
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          # The thermostat's clamp when it ran, the mode's cap otherwise.
          CAP: ${{ steps.thermostat.outputs.cap || steps.cap.outputs.cap }}
          MODE: ${{ steps.cap.outputs.mode }}
          CANDIDATES: ${{ steps.probe.outputs.candidates }}
          # The Critical Todo leaves among them, and how many extra cars (above the
          # cap, pinned, Critical only) may take them: unset = 2, 0 = off.
          CRITICAL_ITEMS: ${{ steps.probe.outputs.critical }}
          # The cap before the thermostat's cut: only a car above THIS is a reserve car.
          CAP_CEILING: ${{ steps.cap.outputs.cap }}
          AGENT_CRITICAL_RESERVE: ${{ vars.AGENT_CRITICAL_RESERVE }}
          # How many Claude accounts the last pool probe found with ≥20% fuel
          # left on both windows: 0 dispatches nothing, any more leaves K to the
          # cap. Empty when no probe is fresh enough to trust (one lane, which
          # re-probes). The controller's own probe wins when it ran.
          USABLE_ACCOUNTS: ${{ steps.pool.outputs.usable_accounts || steps.hold.outputs.usable_accounts }}
          AGENT_CAR_HOSTS: ${{ vars.AGENT_CAR_HOSTS }}
          AGENT_CARS_PER_CIRCUIT: ${{ vars.AGENT_CARS_PER_CIRCUIT || '2' }}
          BUNDLE: ${{ env.LANE_BUNDLE }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          node scripts/agent/board/pit-wall/dispatch-cars.mjs
          # Hold the concurrency slot while the just-created runs become
          # visible to the Actions API — the NEXT queued controller then
          # counts them and can't over-provision past the cap.
          echo "settling 20s for run-creation visibility…"
          sleep 20

      # The controller's own death used to be the quietest failure in the system:
      # no lane is dispatched, no hold is written (the hold step may never have
      # run), and every board and dashboard stays green. The NEXT tick's
      # control-plane sweep holds the fleet and calls an ambulance for it; this
      # step is the immediate human-facing half, because "the fleet stopped" is
      # worth knowing before the next tick.
      - name: Notify Telegram on controller failure
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Telegram not configured — skipping notify."
            exit 0
          fi
          TEXT="🤖🚨 <b>Agent loop CONTROLLER failed</b>"
          TEXT="${TEXT}"$'\n'"No lanes can be dispatched until this clears."
          TEXT="${TEXT}"$'\n'"<a href=\"${RUN_URL}\">View run</a>"
          THREAD_ARGS=()
          if [ -n "${THREAD_ID:-}" ]; then THREAD_ARGS=(-d "message_thread_id=${THREAD_ID}"); fi
          curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${TEXT}" -d parse_mode=HTML \
            -d disable_web_page_preview=true >/dev/null \
            && echo "✓ Telegram controller-failure alert sent." \
            || echo "::warning::Telegram notify failed."
          exit 0

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true

  # ONE lane on a named item, from the "Start lane" dialog on
  # /settings/admin/race-control — outside the loop's cap, gates and backlog, exactly
  # as the dialog always behaved when it dispatched erp-agent-car.yml
  # directly. It routes through here now because a lane may run on a CI-fleet
  # repo, and only this repo can seal the bundle such a lane needs. Placement is
  # the controller's (scripts/agent/board/pit-wall/dispatch-cars.mjs with ITEM set):
  # K is exactly 1, `loop` is false, so the lane never chains.
  wildcard-car:
    name: Start a wildcard car
    if: github.event_name == 'workflow_dispatch' && inputs.item != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same resolver as the controller's (the canonical copy is
      # scripts/ci/ppap/pat-pool.sh) — inlined because the checkout below
      # needs the token.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      - name: Checkout board scripts (sparse)
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          fetch-depth: 1
          sparse-checkout: scripts
          persist-credentials: false

      - name: Seal lane bundle
        if: vars.AGENT_CAR_HOSTS == 'fleet'
        env:
          PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BUILD_THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          B=$(node scripts/agent/run/secret-bundle.mjs build)
          echo "LANE_BUNDLE=$B" >> "$GITHUB_ENV"
          echo "✓ lane bundle sealed (${#B} chars)"

      - name: Place + dispatch the lane
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          ITEM: ${{ inputs.item }}
          MODEL: ${{ inputs.model }}
          CLAUDE_VERSION: ${{ inputs.claude_version }}
          TRIGGERED_BY: ${{ github.actor }}
          AGENT_CAR_HOSTS: ${{ vars.AGENT_CAR_HOSTS }}
          AGENT_CARS_PER_CIRCUIT: ${{ vars.AGENT_CARS_PER_CIRCUIT || '2' }}
          BUNDLE: ${{ env.LANE_BUNDLE }}
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs): off | shadow | on.
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: node scripts/agent/board/pit-wall/dispatch-cars.mjs

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true
