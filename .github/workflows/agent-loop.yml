name: Agent · loop

# Top-up controller for the self-perpetuating /clear-todo-issue agent loop.
# Level-triggered: EVERY invocation recomputes K = min(candidates, cap − active)
# from live API state and fires K repository_dispatch[agent-todo] events at its
# own repo (agent-clear-todo.yml). It never carries state between invocations,
# so a lost or coalesced trigger is harmless — the next one recounts.
#
# Invoked four ways (all end up here):
#   · manually — workflow_dispatch here, or the private repo's
#     agent-todo-dispatch.yml with an empty `item` (repository_dispatch);
#   · by ba-to-issues.yml in the private repo after a merged BA-docs PR minted
#     at least one sweepable (ba-bug/ba-change) issue;
#   · by each agent run that EXECUTED a solve-verdict (MERGED / PARK / SPLIT /
#     ABANDONED with green executor steps) — the "Continue loop" step in
#     agent-clear-todo.yml. A backlog-empty claim, a NONE verdict (salvaged
#     run), or any failure never re-triggers, so the loop always winds down —
#     the probe counts exact claim eligibility (COUNT_ONLY sweep below), and
#     the residual race (a sibling lane claiming between probe and claim)
#     yields one cheap backlog-empty run, which dies pre-bootstrap;
#   · by agent-rel-plan.yml after a successful planning pass — the
#     rel-planning gate below defers lane dispatch to that chain whenever any
#     open BA leaf still lacks the `rel-planned` marker.
#
# Cap = repo variable AGENT_MAX_PARALLEL (unset → 6). KILL SWITCH:
#   gh variable set AGENT_MAX_PARALLEL -R NamThuanVn/ppap --body 0
# → this controller dispatches nothing; in-flight agents finish their current
# item and their lanes die (top-up yields 0). Keep the cap conservative: agent
# jobs occupy an org job slot for up to 330 min each, and NamThuanVn shares a
# 20-concurrent-job cap with the deploy graph (peaks 12–23 jobs) and fallback
# PR CI (see .claude/ppap.md § Agent runs).
#
# Hardening: triggers are repository_dispatch + workflow_dispatch ONLY (ppap
# public-repo rule). repository_dispatch requires a write-capable token, i.e.
# PAT_TOKEN holders. All dispatches BY this workflow use PAT_TOKEN too —
# GITHUB_TOKEN-created events do not trigger workflows (same footgun class as
# release.yml's `gh release create`).

# The 15-min schedule heartbeat has no human behind it — GitHub attributes a
# scheduled run's actor to the workflow's last committer, which reads as "by
# <that person>" even though the tick is pure automation. Pin scheduled ticks
# (and the automated chains they spawn, via TRIGGERED_BY below) to the bot
# account that actually drives them; human dispatches + manual runs keep their
# real actor.
run-name: "${{ format('Agent · loop · by {0}', github.event_name == 'schedule' && 'itdevnamthuan' || github.event.client_payload.triggered_by || github.actor) }}"

on:
  # Heartbeat. The loop is otherwise edge-triggered — each productive agent run
  # chains the next via agent-clear-todo.yml's "Continue loop" step. But a
  # hosted-runner reclaim tears the job down mid-flight and skips that step
  # (an `if: always()` step does NOT survive a runner shutdown), silently
  # ending the lane with no re-arm. This controller is level-triggered and
  # stateless ("the next one recounts"), so a periodic tick just re-probes live
  # state and tops the pool back up to cap — a no-op when nothing is claimable
  # (dispatches 0), and still fully gated by the AGENT_MAX_PARALLEL=0 kill
  # switch (Resolve cap exits early on 0).
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [agent-loop]
  workflow_dispatch:
    inputs:
      max_parallel:
        description: 'Override the AGENT_MAX_PARALLEL cap for this invocation only (empty = repo variable, unset variable = 6).'
        required: false
        default: ''
        type: string

permissions: read-all

# Coalescing debounce: at most one running + one queued controller; a third
# arrival replaces the queued one. Nothing is lost — whichever run executes
# recounts everything from live state. cancel-in-progress stays false: an
# in-flight dispatch burst must never be killed halfway.
concurrency:
  group: agent-loop
  cancel-in-progress: false

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  AGENT_WORKFLOW: agent-clear-todo.yml

jobs:
  controller:
    name: Top up agent pool
    runs-on: ubuntu-latest
    # A hung API call must not wedge the loop's concurrency slot for the
    # default 360 min — the job is a sparse checkout + the eligibility sweep
    # (a few dozen API calls on a big backlog) + a 20s settle.
    timeout-minutes: 10
    env:
      # Both repository_dispatch client_payload values and workflow_dispatch
      # inputs arrive as STRINGS; either side may be absent per trigger.
      CAP_OVERRIDE: ${{ github.event.client_payload.max_parallel || inputs.max_parallel || '' }}
      CAP_VAR: ${{ vars.AGENT_MAX_PARALLEL || '' }}
      TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'itdevnamthuan' || github.event.client_payload.triggered_by || github.actor }}
    steps:
      - name: Resolve cap
        id: cap
        run: |
          set -euo pipefail
          CAP="${CAP_OVERRIDE:-${CAP_VAR:-6}}"
          if ! printf '%s' "$CAP" | grep -qE '^[0-9]+$'; then
            echo "::error::cap '$CAP' is not a non-negative integer (payload/input override or AGENT_MAX_PARALLEL variable)"
            exit 1
          fi
          if [ "$CAP" -eq 0 ]; then
            echo "::notice::AGENT_MAX_PARALLEL is 0 (kill switch) — dispatching nothing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cap=$CAP — proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"

      # The claim script's own eligibility sweep runs the probe (COUNT_ONLY):
      # leaf marker + board Todo + unassigned + no open blockers — the SAME
      # rules the claim step enforces, so K never over-provisions. The old
      # label count treated batch mains, parked (Pending) leaves, and blocked
      # leaves as candidates — observed 6 lanes dispatched for 2 claimable
      # tasks, 4 dying at the claim step. It also counts genuinely-Todo
      # ba-feature leaves now (a human promoting a feature to Todo makes it
      # claimable — the old blanket exclusion was an artifact of the dumb
      # count). Still racy vs in-flight sibling lanes by design: the atomic
      # claim stays the authority; a raced candidate costs one cheap
      # backlog-empty run.
      - name: Checkout board scripts (sparse)
        if: steps.cap.outputs.proceed == 'true'
        uses: actions/checkout@v6
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1
          sparse-checkout: .github/scripts/agent-board
          persist-credentials: false

      # Stranded-claim sweep — release items whose backing run is provably dead
      # (assigned to us + In Progress/Todo + last claimed > STRANDED_HOURS ago,
      # which must exceed agent-clear-todo.yml's timeout-minutes). A hosted-
      # runner reclaim skips the in-job salvage-or-revert (always() does not
      # survive a runner shutdown), stranding the item; this is the decoupled
      # backstop. Runs BEFORE the count so a released item is a candidate this
      # same tick. Best-effort, never reds the controller.
      - name: Reclaim stranded items
        if: steps.cap.outputs.proceed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STRANDED_HOURS: ${{ vars.STRANDED_HOURS || '6' }}
        run: node .github/scripts/agent-board/reclaim-stranded.mjs

      - name: Count claimable candidates
        id: count
        if: steps.cap.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          COUNT_ONLY: '1'
        run: node .github/scripts/agent-board/claim-todo.mjs

      - name: Probe private-repo backlog (exact eligibility)
        id: probe
        if: steps.cap.outputs.proceed == 'true'
        env:
          TOTAL: ${{ steps.count.outputs.eligible || '0' }}
        run: |
          set -euo pipefail
          echo "candidates=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::notice::backlog empty (no Todo · unassigned · unblocked leaf) — dispatching nothing"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ $TOTAL claimable candidate(s)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rel-planning gate: lanes must not start while ANY open BA leaf lacks
      # the `rel-planned` marker — the scripted claim respects blockedBy edges
      # but PLANNING is what sets them (Phase 0-pre's planning half, shared
      # skill /rel-plan-todo). Unplanned leaves → dispatch ONE agent-rel-plan
      # run INSTEAD of lanes; on success it re-dispatches agent-loop, and this
      # gate then passes. All three kinds are swept (a bug can be blocked by a
      # feature) with the SAME leaf-marker query as the planner's sweep and
      # its coverage recount — the three definitions must stay identical or
      # the gate and the planner ping-pong. Duplicate gate dispatches coalesce
      # in agent-rel-plan's concurrency group (the extra run no-ops + chains).
      - name: Rel-planning gate
        id: relplan
        if: steps.probe.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'itdevnamthuan' || github.event.client_payload.triggered_by || github.actor }}
        run: |
          set -euo pipefail
          UNPLANNED=$(for L in ba-bug ba-change ba-feature; do
            gh issue list --repo "$PRIVATE_REPO" --label "$L" --state open \
              --json number,body,labels --limit 200 \
              --jq '.[] | select(.body | test("<!--\\s*ba-(bug-file|change-package|feature):")) | select([.labels[].name] | index("rel-planned") | not) | .number'
          done | sort -u | wc -l | tr -d ' ')
          if [ "$UNPLANNED" -gt 0 ]; then
            echo "::notice::$UNPLANNED unplanned leaf/leaves — dispatching agent-rel-plan, deferring lane dispatch to its chain"
            gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=agent-rel-plan \
              -f client_payload[triggered_by]="${TRIGGERED_BY}"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ every open leaf is rel-planned"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count active runs + dispatch top-up
        if: steps.relplan.outputs.proceed == 'true'
        env:
          # Same-repo Actions reads: GITHUB_TOKEN suffices (read-all).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Dispatch writes MUST use PAT_TOKEN (GITHUB_TOKEN events don't
          # trigger workflows).
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          CAP: ${{ steps.cap.outputs.cap }}
          CANDIDATES: ${{ steps.probe.outputs.candidates }}
        run: |
          set -euo pipefail
          # The runs-list `status` param is single-valued → two calls. The list
          # index is EVENTUALLY CONSISTENT: a just-completed run can stay
          # listed as in_progress for several seconds after it finished —
          # observed live (controller 29755617192 counted active=2 with one
          # real agent → K=0 → a lane died with 4 candidates on the board). So
          # never trust the list alone: collect the candidate run IDS, then
          # fresh-verify EACH with a direct GET (strongly consistent) and
          # count only genuine queued/in_progress survivors. A failed per-id
          # GET counts as active (conservative — never overshoots the cap;
          # active runs ≤ cap, so per_page=100 needs no pagination).
          IDS=$(for S in queued in_progress; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${AGENT_WORKFLOW}/runs?status=${S}&per_page=100" \
              --jq '.workflow_runs[].id'
          done | sort -u)
          ACTIVE=0
          for ID in $IDS; do
            ST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" --jq '.status' 2>/dev/null || echo "unknown")
            case "$ST" in
              queued|in_progress|unknown)
                ACTIVE=$(( ACTIVE + 1 ))
                echo "· run $ID: $ST (counted)"
                ;;
              *)
                echo "· run $ID: $ST — stale list entry, not counted"
                ;;
            esac
          done
          echo "· live agent runs: $ACTIVE"
          K=$(( CAP - ACTIVE ))
          [ "$K" -gt "$CANDIDATES" ] && K="$CANDIDATES"
          [ "$K" -lt 0 ] && K=0
          echo "cap=$CAP · active=$ACTIVE · candidates=$CANDIDATES → dispatching $K run(s)"
          if [ "$K" -eq 0 ]; then
            echo "::notice::pool already at capacity (or no headroom) — nothing dispatched"
            exit 0
          fi
          for I in $(seq 1 "$K"); do
            # -f = string values, ALWAYS ('true' the string). Never switch to
            # -F: it would send a real JSON boolean and the consumer's
            # `client_payload.loop == 'true'` gate would silently stop
            # matching.
            GH_TOKEN="$PAT_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=agent-todo \
              -f client_payload[item]="" \
              -f client_payload[loop]="true" \
              -f client_payload[triggered_by]="${TRIGGERED_BY}"
            echo "✓ dispatched agent run $I/$K"
            sleep 0.5
          done
          # Hold the concurrency slot while the just-created runs become
          # visible to the Actions API — the NEXT queued controller then
          # counts them and can't over-provision past the cap.
          echo "settling 20s for run-creation visibility…"
          sleep 20
