name: ERP · Heartbeat

# The fleet's tick. Triggered by the ERP, not by GitHub.
#
# WHY THE SCHEDULE LEFT GITHUB. This workflow used to carry `schedule: */15 * * * *`
# and it did not work. Observed ticks: 00:32, 20:59, 15:19, 07:26, 01:15 — gaps of
# HOURS against a 15-minute cron. GitHub delays the `schedule` EVENT at its own
# scheduler, upstream of runner assignment, and drops a tick it cannot place.
# Moving to the self-hosted `panda` pool did not fix it and could not: `runs-on`
# only chooses where a job runs once the event has already fired. The previous
# version of this file said so itself — "if ticks are still missed, the fix is an
# external trigger, not another runner". This is that external trigger.
#
# The clock is now a Cloudflare cron trigger on the ERP's `service-utilities`
# worker (`apis/utilities/wrangler.jsonc`), which POSTs `workflow_dispatch` here
# every 15 minutes using a PAT. To turn it on or off, or to see whether it is
# actually ticking, use `/settings/agent-control` in the ERP — NOT the Actions UI.
#
# WHAT IT DOES. Two things, in this order:
#
#   1. Fans out to the scheduled workflows that are due. Every one used to carry
#      its own `schedule:` block and lost it for the same reason this one did.
#      Which workflows, and when, is the `HEARTBEAT_SCHEDULE` repo variable,
#      edited from `/settings/agent-control` (scripts/ci/heartbeat-schedule.mjs).
#      Due-ness is decided by asking GitHub when each last ran, not by wall-clock
#      arithmetic on this run's start time — a tick that arrives late must not
#      skip a day, and a re-run must not double-fire.
#   2. Completes. That completion IS the agent-loop signal: erp-agent-loop.yml
#      lists this workflow in its `workflow_run` trigger, so no dispatch call is
#      needed for the loop itself.
#
# RUNS ON A HOSTED RUNNER, deliberately. The old file ran on self-hosted `panda`
# to dodge the dropped-tick problem, and justified that on a PUBLIC repo by
# having "no checkout, no secrets and `permissions: {}`". Step 1 needs a PAT, so
# that justification is gone — and the capacity argument is gone too, because the
# ERP now owns the clock. Back to `ubuntu-latest`.

on:
  # No `schedule:` — that is the entire point of this file. The ERP's Cloudflare
  # cron is the only scheduled trigger; `workflow_dispatch` is what it calls, and
  # what a human uses to force a tick by hand.
  workflow_dispatch: {}

permissions: read-all

# NEVER cancel a tick in flight. The old file used `cancel-in-progress: true`,
# which was free when this workflow did nothing but `echo` — the SIGNAL was the
# completion, and a cancelled run still fires `workflow_run`. It is NOT free now:
# a superseded tick can be killed between deciding that the hunter is due and
# dispatching it, silently dropping that day's run.
concurrency:
  group: erp-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    name: Fan out to due workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same inlined PAT pool as every other ppap workflow. scripts/ci/ppap/pat-pool.sh
      # is the canonical copy — scripts/gate/ci/pat-pool-drift.mjs fails the build
      # if these diverge.
      #
      # Needs Actions WRITE, not just read: the dispatches below are POSTs.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
          # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
          # account reads 5000 — so one account served every job while the rest idled,
          # which is the concentration the pool exists to prevent. Jobs shuffle
          # independently, so a fan-out spreads instead of stampeding onto one token.
          POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      # Fan out to the workflows whose `schedule:` blocks this file replaced.
      #
      # Due-ness is read from GitHub's own run history — "when did this workflow
      # last start?" — rather than computed from this run's clock. Two reasons:
      # a tick that arrives late still fires a job that was due (wall-clock
      # window matching would skip it until tomorrow), and a hand-run tick right
      # after a scheduled one does not double-fire.
      #
      # A failed dispatch does NOT fail the job. This run's COMPLETION is what
      # re-arms the agent loop, so exiting non-zero here would take the loop down
      # over an unrelated workflow — the opposite of what a heartbeat is for. A
      # failure is a ::warning:: and the next tick retries in 15 minutes.
      # Sparse checkout of `scripts/ci` only — the due decider lives there
      # (CLAUDE.md: every executable is in scripts/), and this job otherwise
      # touches no repo at all. A few KB, non-cone, and no `pnpm install`: the
      # script imports only node builtins. Same pattern as erp-ci-pr.yml's
      # digest checkout. Its own `path:` so the catalogue checkout below (a
      # DIFFERENT repo — this one) does not wipe it.
      #
      # `continue-on-error`: if it blips, the dispatch step below skips the
      # fan-out this tick rather than dispatching off a stale in-memory copy.
      - name: Check out the due decider
        id: decider
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          path: decider
          persist-credentials: false

      # The job catalogue itself (issue #4538): this workflow only ever runs
      # AFTER being mirrored to NamThuanVn/ppap, so the implicit repo here
      # (no `repository:`) IS ppap, where sync-workflows-to-ppap.yml just
      # deposited this same file. Own `path:`, for the same reason as above.
      - name: Check out the schedule catalogue
        id: catalogue
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/erp-heartbeat-schedule.json
          sparse-checkout-cone-mode: false
          path: catalogue
          persist-credentials: false

      - name: Dispatch due workflows
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          CATALOGUE_OUTCOME: ${{ steps.catalogue.outcome }}
          CATALOGUE_FILE: catalogue/.github/workflows/erp-heartbeat-schedule.json
          # WHAT runs WHEN is data, not code: a JSON job list in this repo
          # variable, edited from the ERP's "AI agent control" page
          # (/settings/agent-control). Unset or unreadable means the catalogue as-is —
          # every job at its default `enabled` + timing. That file documents
          # the job shape, and why every job's inputs (the hunter's
          # `dry_run=false`) must be explicit.
          HEARTBEAT_SCHEDULE: ${{ vars.HEARTBEAT_SCHEDULE }}
          AGENT_FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
        run: |
          set -uo pipefail

          # No decider, no fan-out. The due decision lives in scripts/ci;
          # without the checkout there is nothing safe to run, and guessing is
          # how the hunter drifted (issue #4360). The tick still completes, so
          # the agent loop is unaffected; the next tick retries.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the fan-out this tick"
            exit 0
          fi
          # No catalogue, no fan-out — never a hardcoded fallback list (issue
          # #4538). The script itself also treats a missing/unreadable file
          # this way; this covers the checkout failing outright.
          if [ "$CATALOGUE_OUTCOME" != success ]; then
            echo "::warning::schedule catalogue checkout failed — skipping the fan-out this tick"
            exit 0
          fi

          # repo<TAB>workflow<TAB>ref<TAB>heartbeat-due args<TAB>gh flags, one
          # per ENABLED job. Bad jobs are dropped with a ::warning:: on stderr.
          JOBS=$(node decider/scripts/ci/heartbeat-schedule.mjs) || {
            echo "::warning::could not read the schedule — skipping the fan-out this tick"
            exit 0
          }

          while IFS=$'\t' read -r REPO WF REF DUE_ARGS FLAGS; do
            [ -n "$WF" ] || continue

            # Due-ness reads the run's CONCLUSION, not just its age — see
            # scripts/ci/heartbeat-due.mjs. An age-only rule counted a run that
            # DIED as a run that happened, and the fleet lost a whole day's
            # sweep without a word. Several runs, not one: the retry budget is
            # the count of CONSECUTIVE dead runs at the head of the history, so
            # the history is the state and nothing has to be stored.
            RUNS_JSON=$(gh api "repos/${REPO}/actions/workflows/${WF}/runs?per_page=10" \
                          --jq '.workflow_runs' 2>/dev/null) || RUNS_JSON='[]'
            # shellcheck disable=SC2086 — DUE_ARGS is a flag LIST and must word-split.
            VERDICT=$(printf '%s' "$RUNS_JSON" | node decider/scripts/ci/heartbeat-due.mjs $DUE_ARGS 2>/dev/null) || VERDICT=''
            if [ -z "$VERDICT" ]; then
              echo "::warning::$WF — due check failed ($DUE_ARGS), not dispatching"
              continue
            fi
            DUE=${VERDICT%%	*}
            WHY=${VERDICT#*	}
            if [ "$DUE" != due ]; then
              echo "$WF — $WHY, not due"
              continue
            fi
            echo "$WF — $WHY, dispatching"

            # `-R` is load-bearing. Both checkouts above use their own `path:`,
            # so the workspace root has no git remote for gh to infer from —
            # and before that fix, the decider checkout (no `path:` then) put
            # NamThuanVn/erp-namthuan there instead of this ppap repo. Every
            # dispatch then 404'd ("workflow erp-hunter.yml not found on the
            # default branch") as a ::warning:: on a green run, so the hunter and
            # the fleet warmup went unrun for days without anyone noticing.
            # shellcheck disable=SC2086 — FLAGS is a flag LIST and must word-split.
            if gh workflow run "$WF" -R "$REPO" --ref "$REF" $FLAGS; then
              echo "  ✓ dispatched $WF on $REPO"
            else
              echo "::warning::failed to dispatch $WF on $REPO — the next tick retries in 15 minutes"
            fi
          done <<< "$JOBS"

      # Crazy mode's expiry lives on GitHub now (issue #4538 Part B / #4543):
      # `AGENT_CRAZY_UNTIL` / `AGENT_CRAZY_RESTORE_CAP` are ppap repo variables
      # (the ERP's Start/Stop crazy mode writes them). This is the restore
      # side — runs every tick regardless of what the fan-out above dispatched,
      # because crazy mode is a fleet-wide cap, not a per-workflow setting.
      # erp-agent-loop.yml's own "Resolve cap" step covers the gap between an
      # expiry and the next tick landing here (up to 15 minutes).
      - name: Restore cap after crazy mode expires
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          AGENT_CRAZY_UNTIL: ${{ vars.AGENT_CRAZY_UNTIL }}
          AGENT_CRAZY_RESTORE_CAP: ${{ vars.AGENT_CRAZY_RESTORE_CAP }}
        run: |
          set -uo pipefail

          # Same fallback as the dispatch step above: no scripts/ci checkout,
          # nothing safe to run. Crazy mode simply stays active until the next
          # tick retries — it is never lost, only delayed.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the crazy-mode check this tick"
            exit 0
          fi

          VERDICT=$(node scripts/ci/crazy-expiry.mjs \
            --crazy-until "$AGENT_CRAZY_UNTIL" --restore-cap "$AGENT_CRAZY_RESTORE_CAP") || {
            echo "::warning::crazy-expiry check failed — skipping this tick"
            exit 0
          }
          STATE=$(printf '%s' "$VERDICT" | cut -f1)
          CAP=$(printf '%s' "$VERDICT" | cut -f2)
          REASON=$(printf '%s' "$VERDICT" | cut -f3-)

          if [ "$STATE" != expired ]; then
            echo "crazy mode: $REASON"
            exit 0
          fi

          echo "crazy mode: $REASON — restoring AGENT_MAX_PARALLEL and clearing the pair"
          gh variable set AGENT_MAX_PARALLEL -R NamThuanVn/ppap --body "$CAP" \
            || echo "::warning::failed to restore AGENT_MAX_PARALLEL=$CAP — the next tick retries"
          gh variable delete AGENT_CRAZY_UNTIL -R NamThuanVn/ppap 2>/dev/null || true
          gh variable delete AGENT_CRAZY_RESTORE_CAP -R NamThuanVn/ppap 2>/dev/null || true
          echo "✓ crazy mode expired — AGENT_MAX_PARALLEL=$CAP, AGENT_CRAZY_UNTIL/AGENT_CRAZY_RESTORE_CAP cleared"

      # God mode's expiry (issue #4744, this slice #4789) mirrors the crazy-mode
      # step above, minus the restore: god mode never writes AGENT_MAX_PARALLEL
      # (it only replaces the effective cap for one loop run — see
      # erp-agent-loop.yml's "Resolve cap"), so there is nothing to restore when
      # it expires, only the pair to clear. erp-agent-loop.yml's own "Resolve
      # cap" step covers the gap between an expiry and the next tick landing
      # here (up to 15 minutes).
      - name: Clear god mode after it expires
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          AGENT_GOD_UNTIL: ${{ vars.AGENT_GOD_UNTIL }}
          AGENT_GOD_LANES: ${{ vars.AGENT_GOD_LANES }}
        run: |
          set -uo pipefail

          # Same fallback as the crazy-mode step above: no scripts/ci checkout,
          # nothing safe to run. God mode simply stays active until the next
          # tick retries — it is never lost, only delayed.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the god-mode check this tick"
            exit 0
          fi

          VERDICT=$(node decider/scripts/ci/god-expiry.mjs \
            --god-until "$AGENT_GOD_UNTIL" --god-lanes "$AGENT_GOD_LANES") || {
            echo "::warning::god-expiry check failed — skipping this tick"
            exit 0
          }
          STATE=$(printf '%s' "$VERDICT" | cut -f1)
          REASON=$(printf '%s' "$VERDICT" | cut -f3-)

          if [ "$STATE" != expired ]; then
            echo "god mode: $REASON"
            exit 0
          fi

          echo "god mode: $REASON — clearing AGENT_GOD_UNTIL/AGENT_GOD_LANES (nothing to restore)"
          gh variable delete AGENT_GOD_UNTIL -R NamThuanVn/ppap 2>/dev/null || true
          gh variable delete AGENT_GOD_LANES -R NamThuanVn/ppap 2>/dev/null || true
          echo "✓ god mode expired — AGENT_GOD_UNTIL/AGENT_GOD_LANES cleared"

      # The agent loop's actual signal. erp-agent-loop.yml triggers on this
      # workflow's `workflow_run: [completed]`, so reaching this step at all is
      # what re-arms the controller — there is no dispatch call on this side.
      - name: Tick
        run: echo "✓ heartbeat tick — agent-loop re-probes on this run's workflow_run completion"
