name: ERP · Race clock

# The fleet's tick. Triggered by the ERP, not by GitHub.
#
# WHY THE SCHEDULE LEFT GITHUB. This workflow used to carry `schedule: */15 * * * *`
# and it did not work. Observed ticks: 00:32, 20:59, 15:19, 07:26, 01:15 — gaps of
# HOURS against a 15-minute cron. GitHub delays the `schedule` EVENT at its own
# scheduler, upstream of runner assignment, and drops a tick it cannot place.
# Moving to the self-hosted `panda` pool did not fix it and could not: `runs-on`
# only chooses where a job runs once the event has already fired. The previous
# version of this file said so itself — "if ticks are still missed, the fix is an
# external trigger, not another runner". This is that external trigger.
#
# The clock is now a Cloudflare cron trigger on the ERP's `service-utilities`
# worker (`apis/utilities/wrangler.jsonc`), which POSTs `workflow_dispatch` here
# every 15 minutes using a PAT. To turn it on or off, or to see whether it is
# actually ticking, use `/settings/admin/race-control` in the ERP — NOT the Actions UI.
#
# WHAT IT DOES. Two things, in this order:
#
#   1. Fans out to the scheduled workflows that are due. Every one used to carry
#      its own `schedule:` block and lost it for the same reason this one did.
#      Which workflows, and when, is the `AGENT_RACE_CALENDAR` repo variable,
#      edited from `/settings/admin/race-control` (scripts/ci/race-calendar.mjs).
#      Due-ness is decided by asking GitHub when each last ran, not by wall-clock
#      arithmetic on this run's start time — a tick that arrives late must not
#      skip a day, and a re-run must not double-fire.
#   2. Completes. That completion IS the agent-pit-wall signal: erp-agent-pit-wall.yml
#      lists this workflow in its `workflow_run` trigger, so no dispatch call is
#      needed for the loop itself.
#
# RUNS ON A HOSTED RUNNER, deliberately. The old file ran on self-hosted `panda`
# to dodge the dropped-tick problem, and justified that on a PUBLIC repo by
# having "no checkout, no secrets and `permissions: {}`". Step 1 needs a PAT, so
# that justification is gone — and the capacity argument is gone too, because the
# ERP now owns the clock. Back to `ubuntu-latest`.

on:
  # No `schedule:` — that is the entire point of this file. The ERP's Cloudflare
  # cron is the only scheduled trigger; `workflow_dispatch` is what it calls, and
  # what a human uses to force a tick by hand.
  workflow_dispatch: {}

permissions: read-all

# NEVER cancel a tick in flight. The old file used `cancel-in-progress: true`,
# which was free when this workflow did nothing but `echo` — the SIGNAL was the
# completion, and a cancelled run still fires `workflow_run`. It is NOT free now:
# a superseded tick can be killed between deciding that the hunter is due and
# dispatching it, silently dropping that day's run.
concurrency:
  group: race-clock
  cancel-in-progress: false

jobs:
  tick:
    name: Fan out to due workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same inlined PAT pool as every other ppap workflow. scripts/ci/ppap/pat-pool.sh
      # is the canonical copy — scripts/gate/ci/pat-pool-drift.mjs fails the build
      # if these diverge.
      #
      # Needs Actions WRITE, not just read: the dispatches below are POSTs.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      # Fan out to the workflows whose `schedule:` blocks this file replaced.
      #
      # Due-ness is read from GitHub's own run history — "when did this workflow
      # last start?" — rather than computed from this run's clock. Two reasons:
      # a tick that arrives late still fires a job that was due (wall-clock
      # window matching would skip it until tomorrow), and a hand-run tick right
      # after a scheduled one does not double-fire.
      #
      # A failed dispatch does NOT fail the job. This run's COMPLETION is what
      # re-arms the agent loop, so exiting non-zero here would take the loop down
      # over an unrelated workflow — the opposite of what a heartbeat is for. A
      # failure is a ::warning:: and the next tick retries in 15 minutes.
      # Sparse checkout of `scripts/ci` only — the due decider lives there
      # (CLAUDE.md: every executable is in scripts/), and this job otherwise
      # touches no repo at all. A few KB, non-cone, and no `pnpm install`: the
      # script imports only node builtins. Same pattern as erp-ci-pr.yml's
      # digest checkout. Its own `path:` so the catalogue checkout below (a
      # DIFFERENT repo — this one) does not wipe it.
      #
      # `continue-on-error`: if it blips, the dispatch step below skips the
      # fan-out this tick rather than dispatching off a stale in-memory copy.
      - name: Check out the due decider
        id: decider
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: NamThuanVn/erp-namthuan
          ref: main
          token: ${{ env.RESOLVED_PAT }}
          # scripts/ci = the due decider; the agent paths = what an `@fleet` job
          # needs (pick a fleet host, seal the secrets it will run with).
          sparse-checkout: |
            scripts/ci
            scripts/agent/board/lib
            scripts/agent/board/pit-wall
            scripts/agent/ops
            scripts/agent/run
          path: decider
          persist-credentials: false

      # Moves the fleet's repo variables to their racing names (#5816). Idempotent:
      # it prints "nothing to move" once every variable has moved, and it NEVER
      # fails the tick — this run's completion is the pit-wall signal, and the
      # script turns every error into a ::warning:: itself. `continue-on-error` is
      # the belt for a missing checkout. Readers fall back to the old names until
      # it has run; slice 7/7 deletes both the fallback and this step.
      - name: Migrate repo variables to racing names
        if: steps.decider.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node decider/scripts/agent/ops/migrate-race-vars.mjs || true

      # The job catalogue itself (issue #4538): this workflow only ever runs
      # AFTER being mirrored to NamThuanVn/ppap, so the implicit repo here
      # (no `repository:`) IS ppap, where sync-workflows-to-ppap.yml just
      # deposited this same file. Own `path:`, for the same reason as above.
      - name: Check out the schedule catalogue
        id: catalogue
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows
          path: catalogue
          persist-credentials: false

      - name: Dispatch due workflows
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          # Only for an `@fleet` job (the hunter): it runs on a CI-fleet repo that
          # holds none of these, so they travel SEALED in the dispatch — see
          # scripts/agent/run/secret-bundle.mjs. Nothing else reads them.
          PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BUILD_THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          VARS_JSON: ${{ toJSON(vars) }}
          AGENT_CAR_HOSTS: ${{ vars.AGENT_CAR_HOSTS }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          CATALOGUE_OUTCOME: ${{ steps.catalogue.outcome }}
          CATALOGUE_FILE: catalogue/.github/workflows/erp-race-calendar.json
          # WHAT runs WHEN is data, not code: a JSON job list in this repo
          # variable, edited from the ERP's "AI agent control" page
          # (/settings/admin/race-control). Unset or unreadable means the catalogue as-is —
          # every job at its default `enabled` + timing. That file documents
          # the job shape, and why every job's inputs (the hunter's
          # `dry_run=false`) must be explicit.
          AGENT_RACE_CALENDAR: ${{ vars.AGENT_RACE_CALENDAR }}
          AGENT_FORK_REPO: ${{ vars.AGENT_FORK_REPO }}
        run: |
          set -uo pipefail

          # No decider, no fan-out. The due decision lives in scripts/ci;
          # without the checkout there is nothing safe to run, and guessing is
          # how the hunter drifted (issue #4360). The tick still completes, so
          # the agent loop is unaffected; the next tick retries.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the fan-out this tick"
            exit 0
          fi
          # No catalogue, no fan-out — never a hardcoded fallback list (issue
          # #4538). The script itself also treats a missing/unreadable file
          # this way; this covers the checkout failing outright.
          if [ "$CATALOGUE_OUTCOME" != success ]; then
            echo "::warning::schedule catalogue checkout failed — skipping the fan-out this tick"
            exit 0
          fi

          # repo<TAB>workflow<TAB>ref<TAB>race-clock-due args<TAB>gh flags, one
          # per ENABLED job. Bad jobs are dropped with a ::warning:: on stderr.
          JOBS=$(node decider/scripts/ci/race-calendar.mjs) || {
            echo "::warning::could not read the schedule — skipping the fan-out this tick"
            exit 0
          }

          while IFS=$'\t' read -r REPO WF REF DUE_ARGS FLAGS; do
            [ -n "$WF" ] || continue

            # Due-ness reads the run's CONCLUSION, not just its age — see
            # scripts/ci/race-clock-due.mjs. An age-only rule counted a run that
            # DIED as a run that happened, and the fleet lost a whole day's
            # sweep without a word. Several runs, not one: the retry budget is
            # the count of CONSECUTIVE dead runs at the head of the history, so
            # the history is the state and nothing has to be stored.
            #
            # An `@fleet` job may have run on ANY fleet host (or here, before
            # the move), so its history is merged across all of them first.
            if [ "$REPO" = "@fleet" ]; then
              RUNS_JSON=$(node decider/scripts/agent/board/pit-wall/fleet-job.mjs history "$WF" 2>/dev/null) || RUNS_JSON='[]'
            else
              RUNS_JSON=$(gh api "repos/${REPO}/actions/workflows/${WF}/runs?per_page=10" \
                            --jq '.workflow_runs' 2>/dev/null) || RUNS_JSON='[]'
            fi
            # shellcheck disable=SC2086 — DUE_ARGS is a flag LIST and must word-split.
            VERDICT=$(printf '%s' "$RUNS_JSON" | node decider/scripts/ci/race-clock-due.mjs $DUE_ARGS 2>/dev/null) || VERDICT=''
            if [ -z "$VERDICT" ]; then
              echo "::warning::$WF — due check failed ($DUE_ARGS), not dispatching"
              continue
            fi
            DUE=${VERDICT%%	*}
            WHY=${VERDICT#*	}
            if [ "$DUE" != due ]; then
              echo "$WF — $WHY, not due"
              continue
            fi
            echo "$WF — $WHY, dispatching"

            # `@fleet`: pick the host now, and seal the secrets it will need —
            # it holds only PAT_TOKEN_POOL. No host free → run it here instead,
            # on this repo's own secrets, exactly as before the move: a nightly
            # job that skips its slot is a lost day.
            if [ "$REPO" = "@fleet" ]; then
              HOST=$(node decider/scripts/agent/board/pit-wall/fleet-job.mjs place "$WF" 2>/dev/null) || HOST=''
              if [ -n "$HOST" ] && B=$(node decider/scripts/agent/run/secret-bundle.mjs build); then
                REPO="$HOST"
                FLAGS="$FLAGS -f bundle=$B -f controller_repo=$GITHUB_REPOSITORY"
                echo "  → placed on $REPO (secrets forwarded sealed)"
              else
                REPO="$GITHUB_REPOSITORY"
                echo "  → no fleet host free — running it on $REPO"
              fi
            fi

            # `-R` is load-bearing. Both checkouts above use their own `path:`,
            # so the workspace root has no git remote for gh to infer from —
            # and before that fix, the decider checkout (no `path:` then) put
            # NamThuanVn/erp-namthuan there instead of this ppap repo. Every
            # dispatch then 404'd ("workflow erp-police.yml not found on the
            # default branch") as a ::warning:: on a green run, so the hunter and
            # the fleet warmup went unrun for days without anyone noticing.
            # shellcheck disable=SC2086 — FLAGS is a flag LIST and must word-split.
            if gh workflow run "$WF" -R "$REPO" --ref "$REF" $FLAGS; then
              echo "  ✓ dispatched $WF on $REPO"
            else
              echo "::warning::failed to dispatch $WF on $REPO — the next tick retries in 15 minutes"
            fi
          done <<< "$JOBS"

      # turbo mode's expiry lives on GitHub now (issue #4538 Part B / #4543):
      # `AGENT_TURBO_UNTIL` / `AGENT_TURBO_RESTORE_LIMIT` are ppap repo variables
      # (the ERP's Start/Stop turbo mode writes them). This is the restore
      # side — runs every tick regardless of what the fan-out above dispatched,
      # because turbo mode is a fleet-wide cap, not a per-workflow setting.
      # erp-agent-pit-wall.yml's own "Resolve cap" step covers the gap between an
      # expiry and the next tick landing here (up to 15 minutes).
      - name: Restore cap after turbo mode expires
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          AGENT_TURBO_UNTIL: ${{ vars.AGENT_TURBO_UNTIL }}
          AGENT_TURBO_RESTORE_LIMIT: ${{ vars.AGENT_TURBO_RESTORE_LIMIT }}
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -uo pipefail

          # Same fallback as the dispatch step above: no scripts/ci checkout,
          # nothing safe to run. turbo mode simply stays active until the next
          # tick retries — it is never lost, only delayed.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the turbo-mode check this tick"
            exit 0
          fi

          VERDICT=$(node decider/scripts/ci/turbo-expiry.mjs \
            --turbo-until "$AGENT_TURBO_UNTIL" --restore-cap "$AGENT_TURBO_RESTORE_LIMIT") || {
            echo "::warning::turbo-expiry check failed — skipping this tick"
            exit 0
          }
          STATE=$(printf '%s' "$VERDICT" | cut -f1)
          CAP=$(printf '%s' "$VERDICT" | cut -f2)
          REASON=$(printf '%s' "$VERDICT" | cut -f3-)

          if [ "$STATE" != expired ]; then
            echo "turbo mode: $REASON"
            exit 0
          fi

          echo "turbo mode: $REASON — restoring AGENT_CAR_LIMIT and clearing the pair"
          # Each write is reported back to the hub (the cockpit reads the hub's
          # copy, not GitHub — fleet-hub.md). Best-effort: the reconcile
          # corrects a missed mirror within 15 minutes.
          mirror() { node decider/scripts/agent/run/hub-cli.mjs mirror "$@" \
            || echo "::warning::could not mirror $1 to the fleet hub — the reconcile corrects it"; }
          if gh variable set AGENT_CAR_LIMIT -R NamThuanVn/ppap --body "$CAP"; then
            mirror AGENT_CAR_LIMIT "$CAP"
          else
            echo "::warning::failed to restore AGENT_CAR_LIMIT=$CAP — the next tick retries"
          fi
          gh variable delete AGENT_TURBO_UNTIL -R NamThuanVn/ppap 2>/dev/null && mirror AGENT_TURBO_UNTIL
          gh variable delete AGENT_TURBO_RESTORE_LIMIT -R NamThuanVn/ppap 2>/dev/null && mirror AGENT_TURBO_RESTORE_LIMIT
          echo "✓ turbo mode expired — AGENT_CAR_LIMIT=$CAP, AGENT_TURBO_UNTIL/AGENT_TURBO_RESTORE_LIMIT cleared"

      # Manual mode's expiry (issue #4744, this slice #4789) mirrors the turbo-mode
      # step above, minus the restore: manual mode never writes AGENT_CAR_LIMIT
      # (it only replaces the effective cap for one loop run — see
      # erp-agent-pit-wall.yml's "Resolve cap"), so there is nothing to restore when
      # it expires, only the pair to clear. erp-agent-pit-wall.yml's own "Resolve
      # cap" step covers the gap between an expiry and the next tick landing
      # here (up to 15 minutes).
      - name: Clear manual mode after it expires
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          DECIDER_OUTCOME: ${{ steps.decider.outcome }}
          AGENT_MANUAL_UNTIL: ${{ vars.AGENT_MANUAL_UNTIL }}
          AGENT_MANUAL_CARS: ${{ vars.AGENT_MANUAL_CARS }}
          AGENT_HUB_MODE: ${{ vars.AGENT_HUB_MODE }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -uo pipefail

          # Same fallback as the turbo-mode step above: no scripts/ci checkout,
          # nothing safe to run. Manual mode simply stays active until the next
          # tick retries — it is never lost, only delayed.
          if [ "$DECIDER_OUTCOME" != success ]; then
            echo "::warning::scripts/ci checkout failed — skipping the manual-mode check this tick"
            exit 0
          fi

          VERDICT=$(node decider/scripts/ci/manual-expiry.mjs \
            --manual-until "$AGENT_MANUAL_UNTIL" --manual-lanes "$AGENT_MANUAL_CARS") || {
            echo "::warning::manual-expiry check failed — skipping this tick"
            exit 0
          }
          STATE=$(printf '%s' "$VERDICT" | cut -f1)
          REASON=$(printf '%s' "$VERDICT" | cut -f3-)

          if [ "$STATE" != expired ]; then
            echo "manual mode: $REASON"
            exit 0
          fi

          echo "manual mode: $REASON — clearing AGENT_MANUAL_UNTIL/AGENT_MANUAL_CARS (nothing to restore)"
          # Reported back to the hub, which the cockpit reads (see the turbo step).
          mirror() { node decider/scripts/agent/run/hub-cli.mjs mirror "$@" \
            || echo "::warning::could not mirror $1 to the fleet hub — the reconcile corrects it"; }
          gh variable delete AGENT_MANUAL_UNTIL -R NamThuanVn/ppap 2>/dev/null && mirror AGENT_MANUAL_UNTIL
          gh variable delete AGENT_MANUAL_CARS -R NamThuanVn/ppap 2>/dev/null && mirror AGENT_MANUAL_CARS
          echo "✓ manual mode expired — AGENT_MANUAL_UNTIL/AGENT_MANUAL_CARS cleared"

      # The fleet's GitHub API budget, measured: one GET /user per pooled
      # account, plus one token mint and GET /rate_limit per GitHub App
      # installation, posted to the ERP fleet hub
      # (docs/engineering/services/utilities/fleet-hub.md § Measuring). Never
      # fails the tick — the script warns and exits 0 on a dead token or a hub
      # outage, and `continue-on-error` covers anything else.
      - name: Record pool usage
        if: steps.decider.outcome == 'success'
        continue-on-error: true
        env:
          PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          FLEET_APP_ID: ${{ secrets.FLEET_APP_ID }}
          FLEET_APP_PRIVATE_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        # PPAP_CI_REPOS is an erp-namthuan variable; `vars.PPAP_CI_REPOS` is
        # empty in this repo, so the hub never got the fleet list and the Jobs
        # card stayed "inferred". Read it at run time, as erp-police.yml does.
        run: |
          PPAP_CI_REPOS="$(gh api repos/NamThuanVn/erp-namthuan/actions/variables/PPAP_CI_REPOS --jq .value 2>/dev/null || true)"
          [ -n "$PPAP_CI_REPOS" ] || echo "::warning::could not read PPAP_CI_REPOS from NamThuanVn/erp-namthuan — the hub keeps its last fleet list"
          export PPAP_CI_REPOS
          node decider/scripts/ci/ppap/pool-usage.mjs report

      # The agent loop's actual signal. erp-agent-pit-wall.yml triggers on this
      # workflow's `workflow_run: [completed]`, so reaching this step at all is
      # what re-arms the controller — there is no dispatch call on this side.
      - name: Tick
        run: echo "✓ heartbeat tick — agent-pit-wall re-probes on this run's workflow_run completion"

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true
