name: Deploy · Production

# Triggered cross-repo from NamThuanVn/website-namthuan when release.yml cuts a
# new release. Runs on the SHARED NamThuanVn/ppap. `workflow_dispatch` requires typing PRODUCTION into the confirm
# input as a tripwire against fat-fingered clicks. All deploy logic lives in
# deploy-reusable.yml; this file is just the trigger.
run-name: "${{ github.event.client_payload.title || format('Deploy Production {0} — triggered by @{1}', inputs.tag, inputs.triggered_by || github.actor) }}"

on:
  repository_dispatch:
    # `deploy-website-production`, NOT `deploy-production` -- see #1 rule 1.
    types: [deploy-website-production]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v1.2.3). Required.'
        required: true
      confirm:
        description: 'Type PRODUCTION to confirm.'
        required: true
        default: ''
      triggered_by:
        description: 'Manual override actor handle (for run-name)'
        required: false
        default: ''

permissions: read-all

# No `cancel-in-progress`. A superseded staging deploy is harmless; a halfway
# cancelled production apply is not.
# `website-` prefix so this never contends with the ERP's deploy-production.
concurrency:
  group: website-deploy-production
  cancel-in-progress: false

jobs:
  # Tripwire: a workflow_dispatch must type PRODUCTION exactly. Skipped for
  # repository_dispatch, where confirmation is implicit (release.yml fired it).
  confirm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Guard — confirm tripwire
        env:
          CONFIRM: ${{ inputs.confirm }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$CONFIRM" != "PRODUCTION" ]; then
            echo "::error::Confirmation input must be exactly 'PRODUCTION' (got '$CONFIRM')."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Tag input is required for manual production deploys."
            exit 1
          fi

  deploy:
    needs: [confirm]
    # `always()` with an explicit result test: the confirm job is SKIPPED on a
    # repository_dispatch, and a plain `needs` would skip this job with it.
    if: |
      always() &&
      (needs.confirm.result == 'success' || needs.confirm.result == 'skipped')
    uses: ./.github/workflows/website-deploy-reusable.yml
    with:
      environment: production
      tf_workspace: namthuanvn-website-production
      # No `domain:` — the host comes from `terraform output -raw hostname`,
      # whose single source of truth is terraform/locals.tf (rule 1 of #1).
      # Production deploys a TAG, never a branch.
      checkout_ref: refs/tags/${{ github.event.client_payload.tag || inputs.tag }}
      deploy_script_suffix: ':production'
      release_tag: ${{ github.event.client_payload.tag || inputs.tag }}
      deployment_id: ${{ github.event.client_payload.deployment_id }}
      commit_sha: ${{ github.event.client_payload.sha }}
      status_context: deploy-production
      triggered_by: ${{ github.event.client_payload.triggered_by || inputs.triggered_by || github.actor }}
      run_title: ${{ github.event.client_payload.title }}
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BUILD_THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
