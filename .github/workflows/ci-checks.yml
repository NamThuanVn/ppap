name: CI · Checks · Reusable

# Reusable CI graph: biome / typecheck / lint / test in parallel against an
# arbitrary erp-namthuan ref. Called by both PR-CI (ppap:ci-pr.yml) and the
# deploy gate (ppap:deploy-reusable.yml). Outputs each job's `result` so
# callers can build a per-job summary.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'erp-namthuan ref to check out (refs/pull/<N>/merge for PR CI, sha for staging deploy, refs/tags/<tag> for production).'
        type: string
        required: true
      e2e_shards:
        description: 'DESIRED number of parallel Playwright shards. The effective count is min(this, available capacity) — see the e2e job. 32 = 4 workers x 8 shards at the default WORKER_SLOTS. Both PR CI and the deploy gate inherit it.'
        type: number
        default: 32
      fleet:
        description: 'Comma-separated owner/repo list of ppap CI repos this run may borrow idle e2e capacity from (the erp-namthuan variable PPAP_CI_REPOS). Empty ⇒ no fan-out; every shard runs on this repo.'
        type: string
        default: ''
      pr_number:
        description: 'Source PR number, forwarded to e2e batches so they can detect a moved head and bail early.'
        type: string
        default: ''
      head_sha:
        description: 'Head SHA under test, forwarded to e2e batches for the same stale check.'
        type: string
        default: ''
      run_e2e:
        description: 'Whether to run the e2e matrix. PR CI keeps the default (true); the deploy gate passes false so staging/production builds are not blocked on dashboard e2e.'
        type: boolean
        default: true
      e2e_changed_only:
        description: 'Scope e2e to the changed service''s specs (broad/shared change → full suite, nothing relevant → skip). PR CI passes true; the production deploy gate leaves the default false → full suite. See scripts/e2e-plan.sh.'
        type: boolean
        default: false
    outputs:
      biome:
        description: 'Result of the biome job'
        value: ${{ jobs.biome.result }}
      typecheck:
        # `result` on a MATRIX job is already the aggregate — success only when
        # every leg succeeded — so the former typecheck-aggregate job existed
        # purely to copy that value into an output. Same for `test` below.
        description: 'Aggregated result of the sharded typecheck matrix.'
        value: ${{ jobs.typecheck.result }}
      lint:
        description: 'Result of the lint job'
        value: ${{ jobs.lint.result }}
      test:
        description: 'Aggregated result of the sharded Vitest matrix.'
        value: ${{ jobs.test.result }}
      e2e:
        description: 'e2e verdict: success when every batch passed OR the plan had nothing relevant to test; failure otherwise. Empty (⇒ red) if the job itself died.'
        value: ${{ jobs.e2e.outputs.result }}
      e2e_runs:
        description: 'JSON array of the fanned-out batch runs ([{repo, batch, run_id, conclusion}]) so the caller can scan their logs. Empty when nothing was dispatched.'
        value: ${{ jobs.e2e.outputs.runs }}
    secrets:
      PAT_TOKEN:
        required: true

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  # Pre-seed init.defaultBranch so actions/checkout's internal `git init` stops
  # printing the "hint: git config --global init.defaultBranch <name>" line on
  # every job. git reads these GIT_CONFIG_* env vars as extra config, so the
  # hint's precondition (unset init.defaultBranch) is never met. Cosmetic
  # CI-log-noise removal only.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  biome:
    name: 1 · CI · Biome (format + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          # Full history so HEAD^1 (the PR's base parent on the merge ref) is
          # available for the demo-migration-guard diff below.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm biome ci .

      # Repo-wide suppression/skip gate: no biome-ignore / eslint-disable /
      # @ts-ignore and no test skip in ANY form may exist in the codebase
      # (.claude/rules.md § "Never skip checks, never suppress").
      - run: bash scripts/check-no-suppressions.sh

      # Demo/test fixtures must never ship as a schema migration under
      # apis/*/migrations/ — they apply to Staging AND Production with no
      # environment filter (this has recurred twice; see
      # docs/ba/scnpms/bug/cross-module/2026-08-04-demo-fixture-data-live-in-staging-and-production.md).
      # Diff-scoped to files ADDED by this PR (HEAD^1 = the base parent on
      # refs/pull/N/merge, same convention as scripts/e2e-plan.sh) — the 22
      # already-shipped demo migrations stay in place and must not retrigger.
      - run: bash scripts/check-demo-migrations.sh

      # Email-authentication gate for the OTP sender domains: DKIM at
      # cf-bounce._domainkey, SPF at cf-bounce, bounce MX, exactly one DMARC
      # record. Live DNS only — no Cloudflare credentials. Lives here rather
      # than in a job of its own because it takes seconds and needs no build;
      # grouped with the other repo-wide gates on this job.
      #
      # `dig` is installed if absent rather than assumed: the script treats a
      # missing resolver as a hard failure under CI (see its NO_RESOLVER note),
      # because a gate that silently skips itself is worth no more than no gate.
      - name: Assert sender-domain email DNS
        run: |
          command -v dig >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          }
          bash scripts/check-email-dns.sh

      # The .claude/hooks/** gates run on every Claude turn, so a regression is
      # expensive in BOTH directions — a false positive wedges real work, a false
      # negative lets through exactly what the hook exists to catch. They are
      # shell/node processes driven by exit codes and stderr, so Vitest cannot
      # reach them; run-all.sh is their harness.
      #
      # It runs in CI and not only via lefthook because `require-tests.sh` carves
      # out `.claude/`, so a hook change is never in `test:changed`'s scope and
      # the pre-commit gate never reaches this suite. Before this step existed the
      # suite had gone red unnoticed (remind-audit-vocab.sh had no test file, and
      # run-all.sh's own completeness check was flagging it into an empty room).
      #
      # Shallow-clone safe: scripts/local-base.sh falls back to HEAD when no
      # upstream/main, origin/main or main exists, so the change-set-driven tests
      # see the same uncommitted+untracked scope here as they do locally. (This
      # job checks out fetch-depth 0 anyway, for the demo-migration guard.)
      - run: pnpm test:hooks

      # terraform/ used to be executed for the FIRST time at deploy, inside the
      # deploy job's `terraform apply`. A bad module reference or undeclared
      # variable therefore surfaced mid-deploy, after CI was green and the release
      # was already rolling — the one thing the ci-gate comment in
      # deploy-reusable.yml calls out as "before infra touches Cloudflare".
      # `-backend=false` inside the script keeps it credential-free: no HCP token,
      # no remote state, nothing to leak into a public CI runner.
      #
      # Pinned to the version the deploy job uses, so this validates against the
      # binary that will later run `apply`.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - run: bash scripts/check-terraform.sh

  # Typecheck, split across parallel legs — same reasoning as the Vitest matrix
  # above (389s as one job, and the dominant cost on any PR whose e2e is
  # skipped).
  #
  # The legs are INDEPENDENT: every workspace package resolves its siblings to
  # raw TypeScript (`packages/api-types` exports `./src/index.ts`,
  # `packages/dashboard-shell` exports `./src/*`), so no leg needs another
  # leg's emitted `.d.ts` and there is no build ordering to preserve. If a
  # package is ever changed to publish `dist/`, that assumption breaks and the
  # legs must gain a `needs:` on whichever leg builds it.
  #
  # Three legs, for the same 20-job concurrency reason as the Vitest matrix.
  # Weights from measured per-package runtime (local seconds), 223s over 34
  # packages:
  #   a 71 · b 76 · rest 76
  # `api-monolith` (27s) and `shell` (26s) are the outliers; they anchor
  # separate legs, so ~27 is this branch's floor at any leg count.
  #
  # BINNED_PKGS / `rest` catch-all: see the note on the Vitest matrix.
  typecheck:
    name: 1 · CI · Typecheck (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINNED_PKGS: >-
        @namthuanvn/api-monolith @namthuanvn/oms @namthuanvn/assistant @namthuanvn/exms
        @namthuanvn/procurement @namthuanvn/sourcing @namthuanvn/zone-bom
        @namthuanvn/shell @namthuanvn/zone-expense @namthuanvn/zone-oms @namthuanvn/zone-sourcing
        @namthuanvn/auth @namthuanvn/bom @namthuanvn/expense @namthuanvn/social @namthuanvn/audit
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: a      # 71
            pkgs: '@namthuanvn/api-monolith @namthuanvn/oms @namthuanvn/assistant @namthuanvn/exms @namthuanvn/procurement @namthuanvn/sourcing @namthuanvn/zone-bom'
          - name: b      # 76
            pkgs: '@namthuanvn/shell @namthuanvn/zone-expense @namthuanvn/zone-oms @namthuanvn/zone-sourcing @namthuanvn/auth @namthuanvn/bom @namthuanvn/expense @namthuanvn/social @namthuanvn/audit'
          - name: rest   # 76
            pkgs: ''   # catch-all — everything not in BINNED_PKGS
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Run typecheck leg
        env:
          LEG: ${{ matrix.leg.name }}
          PKGS: ${{ matrix.leg.pkgs }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -z "$PKGS" ]; then
            for p in $BINNED_PKGS; do ARGS+=(--filter "!$p"); done
          else
            for p in $PKGS; do
              case " $BINNED_PKGS " in
                *" $p "*) ;;
                *) echo "::error::typecheck leg '$LEG' runs $p but BINNED_PKGS does not list it — the 'rest' leg would run it a second time. Add it to BINNED_PKGS."; exit 1 ;;
              esac
              ARGS+=(--filter "$p")
            done
          fi
          echo "▶ typecheck leg '$LEG': pnpm -r ${ARGS[*]} typecheck"
          pnpm -r "${ARGS[@]}" typecheck


  lint:
    name: 1 · CI · Lint workspaces (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm lint:js:packages

  # Vitest, split across parallel legs. `pnpm test:ci` (= `pnpm -r test --
  # --run`) as ONE job was 474s and the second-longest branch in the graph —
  # long enough that it becomes the critical path the moment the e2e matrix is
  # widened, so sharding e2e without sharding this buys nothing past ~28
  # shards. It is also the WHOLE cost of a PR whose e2e plan says `skip`: run
  # 31667489668 (a .github/-only change) took 7.3 min with no e2e at all.
  #
  # Two effects, both wins. The obvious one is parallelism. The subtler one is
  # that `pnpm -r` defaults to a workspace concurrency of ~4 while each vitest
  # then spawns its own worker pool — on a 4-vCPU runner that is ~16 test
  # processes fighting over 4 cores. Measured locally the same 32 packages take
  # ~93s wall-clock; CI spends 474s. Fewer packages per leg means far less
  # oversubscription, so the legs should beat a naive 474/6.
  #
  # LEG COUNT IS CAPPED BY THE ORG'S CONCURRENCY BUDGET, not by how finely the
  # suite splits. A coordinator run must fit GitHub Free's 20 concurrent jobs:
  # biome 1 + lint 1 + e2e-plan 1 + zone builds 10 + seed 1 = 14 are fixed and
  # the zone builds sit on the critical path, so typecheck + vitest legs must
  # total at most 6 or the scheduler queues something — quite possibly a zone
  # build, which would cost more wall-clock than the extra legs save. Hence 3
  # here and 3 for typecheck: peak lands exactly on 20 with nothing queued.
  #
  # Leg weights come from measured per-package runtime (local seconds, used as
  # a relative proxy — CI is uniformly slower). Total 93s over 32 packages:
  #   app-shell 30 · shell-ui 31 · rest 32
  # `shell` (17) and `dashboard-shell` (15) are single packages too big to
  # split, so each anchors a leg and is topped up with small ones.
  #
  # COVERAGE IS BY CONSTRUCTION, not by review: the `rest` leg is a catch-all
  # that EXCLUDES the explicitly-binned packages instead of listing its own, so
  # a newly added workspace package automatically runs there. The dangerous
  # failure (a package silently tested by NO leg) is therefore unreachable.
  # `pnpm -r` skips packages with no `test` script, so the 4 script-less
  # packages are free no-ops.
  #
  # BINNED_PKGS must list exactly the packages named in the five explicit legs
  # — it is what `rest` subtracts. Each named leg asserts its own packages
  # appear here, so the two drift loudly rather than silently. Worst case if
  # they do drift, a package runs in two legs: wasteful, never unsafe.
  test:
    name: 1 · CI · Unit tests (Vitest · ${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINNED_PKGS: >-
        @namthuanvn/shell @namthuanvn/oms @namthuanvn/procurement @namthuanvn/notifications
        @namthuanvn/dashboard-shell @namthuanvn/sourcing @namthuanvn/hris @namthuanvn/exms
        @namthuanvn/zone-oms @namthuanvn/api-types @namthuanvn/auth
    strategy:
      # Report every leg's failures in one run — unlike the e2e matrix these
      # are cheap, and a single aggregated red is more useful than the first
      # leg cancelling its siblings.
      fail-fast: false
      matrix:
        leg:
          - name: app-shell   # 30
            pkgs: '@namthuanvn/shell @namthuanvn/oms @namthuanvn/procurement @namthuanvn/notifications'
          - name: shell-ui    # 31
            pkgs: '@namthuanvn/dashboard-shell @namthuanvn/sourcing @namthuanvn/hris @namthuanvn/exms @namthuanvn/zone-oms @namthuanvn/api-types @namthuanvn/auth'
          - name: rest        # 32
            pkgs: ''   # catch-all — everything not in BINNED_PKGS
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Run vitest leg
        env:
          LEG: ${{ matrix.leg.name }}
          PKGS: ${{ matrix.leg.pkgs }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -z "$PKGS" ]; then
            # Catch-all leg: start from every workspace package and subtract the
            # binned ones. pnpm treats a filter set containing only negations as
            # "all packages except these".
            for p in $BINNED_PKGS; do ARGS+=(--filter "!$p"); done
          else
            for p in $PKGS; do
              # Drift guard — see the BINNED_PKGS note above.
              case " $BINNED_PKGS " in
                *" $p "*) ;;
                *) echo "::error::leg '$LEG' runs $p but BINNED_PKGS does not list it — the 'rest' leg would run it a second time. Add it to BINNED_PKGS."; exit 1 ;;
              esac
              ARGS+=(--filter "$p")
            done
          fi
          echo "▶ vitest leg '$LEG': pnpm -r ${ARGS[*]} test -- --run"
          pnpm -r "${ARGS[@]}" test -- --run

  # Plan the e2e run. Two responsibilities:
  #   1. Decide SCOPE — when e2e_changed_only is true (PR CI), diff the PR
  #      (HEAD^1..HEAD on refs/pull/N/merge) through scripts/e2e-plan.sh:
  #      full | scoped <specs> | skip. Otherwise (deploy gate) → full.
  #   2. Fan the effective shard count into a JSON array (`[1,2,...,N]`) for the
  #      matrix via fromJSON — full → e2e_shards shards; scoped → 1 shard (a
  #      handful of specs doesn't need 12 stacks); skip → empty (matrix no-op).
  # Pure git + jq + bash (no pnpm install). `run` is 'true' unless mode==skip.
  e2e-plan:
    name: 1 · CI · E2E (plan)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          # Full history so HEAD^1 (the PR's base parent on the merge ref) is
          # available for the diff.
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        env:
          CHANGED_ONLY: ${{ inputs.e2e_changed_only }}
          TOTAL: ${{ inputs.e2e_shards }}
        run: |
          set -euo pipefail
          MODE=full
          TARGETS=""
          if [ "$CHANGED_ONLY" = "true" ]; then
            # HEAD^1 on refs/pull/N/merge = the base (main); the diff to HEAD is
            # exactly the PR's delta.
            DECISION="$(E2E_PLAN_BASE=HEAD^1 bash scripts/e2e-plan.sh)"
            MODE="${DECISION%% *}"
            TARGETS="${DECISION#"$MODE"}"; TARGETS="${TARGETS# }"
          fi
          case "$MODE" in
            skip)
              echo "run=false"  >> "$GITHUB_OUTPUT"
              echo "shards=[]"  >> "$GITHUB_OUTPUT"
              echo "total=0"    >> "$GITHUB_OUTPUT" ;;
            scoped)
              # A scoped run USED to be pinned to exactly one shard, on the
              # assumption that "a handful of specs doesn't need 12 stacks".
              # That assumption does not hold: e2e-plan.sh emits spec
              # DIRECTORIES as well as files, and the groups are wildly uneven
              # — `sourcing`/`apis/sourcing` map to apps/shell/e2e/scpms, which
              # is 199 of the suite's 327 spec files. Those all ran serially in
              # ONE job, so the most common kind of PR in this repo got the
              # slowest possible e2e.
              #
              # Size the matrix to the number of specs actually selected, at
              # the same ~25-specs-per-shard density the full run uses (327
              # specs / 12 shards). Capped at 8 so a scoped run still leaves
              # room in the org's 20-job budget for the rest of the graph.
              SPEC_COUNT=0
              for t in $TARGETS; do
                if [ -d "$t" ]; then
                  n=$(find "$t" -name '*.spec.ts' -type f | wc -l)
                else
                  n=1
                fi
                SPEC_COUNT=$(( SPEC_COUNT + n ))
              done
              N=$(( (SPEC_COUNT + 24) / 25 ))
              [ "$N" -lt 1 ] && N=1
              [ "$N" -gt 8 ] && N=8
              SHARDS=$(seq 1 "$N" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"      >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
              echo "total=$N"       >> "$GITHUB_OUTPUT"
              echo "▶ scoped: $SPEC_COUNT spec files → $N shard(s)" >&2 ;;
            *)
              SHARDS=$(seq 1 "$TOTAL" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"       >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS"  >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL"    >> "$GITHUB_OUTPUT" ;;
          esac
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "▶ e2e plan: mode=$MODE targets=[$TARGETS]" >&2

  # Build each dashboard zone on its OWN runner, in parallel. The 6 OpenNext
  # zones are fully independent (no cross-zone deps; dashboard-shell exports raw
  # `src/` so there's no prebuild step), so a per-zone matrix turns the old
  # ~258s serial "build all 6 on one 2-core runner" step into ~6 concurrent
  # ~60–90s builds — the dominant PR-CI / deploy-gate cost. Each leg tars its own
  # `apps/<zone>/.open-next` and uploads it; the shards download every zone tar
  # and reassemble the tree. `fail-fast: false` so one zone's build failure
  # doesn't mask the others. Free on public-repo minutes — fan out wide.
  e2e-build-zones:
    name: 1 · CI · E2E (build ${{ matrix.zone.name }})
    needs: e2e-plan
    # Skipped when the plan says nothing e2e-relevant changed. A scoped run still
    # builds ALL zones — the e2e stack boots the whole multi-zone router.
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zone:
          - { name: shell, pkg: '@namthuanvn/shell' }
          - { name: expense, pkg: '@namthuanvn/zone-expense' }
          - { name: exms, pkg: '@namthuanvn/zone-exms' }
          - { name: oms, pkg: '@namthuanvn/zone-oms' }
          - { name: sourcing, pkg: '@namthuanvn/zone-sourcing' }
          - { name: bom, pkg: '@namthuanvn/zone-bom' }
          - { name: quotation, pkg: '@namthuanvn/zone-quotation' }
          - { name: procurement, pkg: '@namthuanvn/zone-procurement' }
          - { name: hris, pkg: '@namthuanvn/zone-hris' }
          - { name: utilities, pkg: '@namthuanvn/zone-utilities' }
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      # OUTPUT cache — the packaged bundle itself, not just the compiler cache.
      # On a hit this job does checkout → restore → upload (~10s) and skips
      # install AND the build entirely; the ~103–166s build is the single
      # largest item on the e2e critical path, so this is the cheapest minute
      # in the graph to buy back.
      #
      # The key must name EVERYTHING that can change the emitted bundle, and
      # nothing that can't — a false hit ships a stale bundle into e2e, which
      # is far worse than a miss. A zone depends on its own source, the shared
      # packages it transpiles (`transpilePackages: api-types, utils,
      # dashboard-shell` — see apps/<zone>/next.config.ts) and the root
      # compile/dependency config. Zones are mutually independent (no
      # cross-zone imports; they share code only through packages/*), which is
      # what makes the PER-ZONE scope sound — and it matters: keying on the
      # whole of `apps/**` busts all ten zones whenever any one app changes,
      # i.e. on almost every PR. Scoped this way, a PR touching apps/quotation
      # rebuilds quotation and restores the other nine.
      - name: Cache zone bundle
        id: zonetar
        uses: actions/cache@v6
        with:
          path: zone-${{ matrix.zone.name }}.tar
          key: zonetar-v1-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json', '.github/actions/install/action.yml', format('apps/{0}/**', matrix.zone.name), 'packages/**') }}
          # No restore-keys ON PURPOSE: a partial-match restore would hand back
          # a bundle built from different source. Exact key or rebuild.

      - uses: ./.github/actions/install
        if: steps.zonetar.outputs.cache-hit != 'true'

      # Warm THIS zone's Next compiler cache across runs. build:pages still runs
      # (so it always re-evaluates source — no stale-build risk) but reuses prior
      # compilation work, cutting a cold ~60–120s build to ~20–40s on unchanged
      # source. Keyed per-zone so the matrix legs don't clobber one another's
      # cache. Scoped to this zone's own inputs for the same reason as the
      # bundle cache above — an `apps/**` key made every zone miss on any app
      # change. Unlike the bundle cache this one KEEPS restore-keys: a stale
      # compiler cache is only a slower build, never a wrong one.
      - name: Cache Next build
        if: steps.zonetar.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: apps/${{ matrix.zone.name }}/.next/cache
          key: next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles(format('apps/{0}/**', matrix.zone.name), 'packages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-${{ matrix.zone.name }}-

      # Generic relative `/api` build — no host/port baked, so the same bundle
      # boots on every shard's free port.
      - name: Build zone (OpenNext)
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.zone.pkg }} run build:pages

      # tar (not a raw many-small-files upload) so the .open-next file count
      # doesn't make upload/download slow. The bundle is already minified, so
      # skip artifact gzip. tar preserves the `apps/<zone>/.open-next` path so
      # the shard reassembles the tree verbatim by untarring every zone tar.
      - name: Package zone build
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: tar -cf zone-${{ matrix.zone.name }}.tar apps/${{ matrix.zone.name }}/.open-next

      # Runs on hit AND miss — on a hit the tar came from the cache, on a miss
      # from the step above. Either way the shards' `pattern: e2e-*` download
      # must find it.
      - name: Upload zone build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-zone-${{ matrix.zone.name }}
          path: zone-${{ matrix.zone.name }}.tar
          retention-days: 1
          compression-level: 0

  # Seed the isolated e2e DB ONCE, in parallel with the zone builds (it only
  # needs the per-service migration scripts, not the dashboard build output).
  # Isolated-state branch of db-reset.sh: per-service `wrangler d1 migrations
  # apply --persist-to .wrangler/state-e2e`, no ExMS demo seed — exactly the DB
  # each shard would have produced itself. Each shard is a separate runner, so
  # its untarred copy of the state dir is its own mutable DB — shard isolation
  # is preserved without snapshotting.
  e2e-seed:
    name: 1 · CI · E2E (seed db)
    needs: e2e-plan
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Seed e2e database (once)
        env:
          # db-reset.sh restores the pre-migrated D1 snapshot, which lives on a
          # release in the PRIVATE repo (it contains real seeded employee/budget
          # data and must not be public). Without a token `gh` cannot read it and
          # this job silently falls back to a full cold migration run — correct,
          # just slower — so the seed step would quietly lose its speedup.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: STATE_DIR=.wrangler/state-e2e bash scripts/db-reset.sh

      # Mostly-incompressible sqlite — skip artifact gzip.
      - name: Package seed
        run: tar -cf e2e-seed.tar .wrangler/state-e2e

      - name: Upload e2e seed
        uses: actions/upload-artifact@v7
        with:
          name: e2e-seed
          path: e2e-seed.tar
          retention-days: 1
          compression-level: 0
  # ONE job for the whole e2e stage: work out where the shards go, dispatch
  # them, wait for them, and emit the single verdict the caller reads.
  #
  # This used to be three jobs (fan-out → collect → result). They were always
  # sequential and always all-or-nothing, so the split bought nothing but three
  # nodes in the run graph and two sets of job plumbing. The `result` job
  # existed only because a workflow output must be produced even when the stage
  # is skipped — handled here by `if: always()` plus an explicit precondition
  # gate, which is also the one place that has to get "did the stage actually
  # run?" right.
  #
  # FAILS CLOSED by construction: `result` is the workflow's `e2e` output and
  # the caller treats anything other than the literal `success` as red, so a
  # crashed job (empty output) is a red run, never a silent pass.
  e2e:
    name: 1 · CI · E2E
    needs: [e2e-plan, e2e-build-zones, e2e-seed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Bounded by the slowest remote shard; the batch jobs cap at 30 min each.
    timeout-minutes: 60
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      runs: ${{ steps.collect.outputs.runs }}
    steps:
      # The whole "should this stage run, and did its inputs survive?" decision
      # in one place. Previously spread across three `if:` expressions and the
      # aggregate's shell.
      - name: Resolve stage preconditions
        id: gate
        env:
          RUN_E2E: ${{ inputs.run_e2e }}
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          PLAN_RUN: ${{ needs.e2e-plan.outputs.run }}
          BUILD_RESULT: ${{ needs.e2e-build-zones.result }}
          SEED_RESULT: ${{ needs.e2e-seed.result }}
        run: |
          set -euo pipefail
          PROCEED=false
          RESULT=failure
          if [ "$RUN_E2E" != "true" ]; then
            # e2e disabled for this caller (the staging deploy gate).
            RESULT=skipped
          elif [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::e2e-plan did not succeed ($PLAN_RESULT) — cannot tell which specs to run."
          elif [ "$PLAN_RUN" != "true" ]; then
            # Change-scoped plan found nothing e2e-relevant.
            RESULT=success
          elif [ "$BUILD_RESULT" != "success" ] || [ "$SEED_RESULT" != "success" ]; then
            echo "::error::zone builds ($BUILD_RESULT) or seed ($SEED_RESULT) failed — no artifacts to test against."
          else
            PROCEED=true
          fi
          {
            echo "proceed=$PROCEED"
            echo "result=$RESULT"
          } >> "$GITHUB_OUTPUT"
          echo "▶ e2e gate: run_e2e=$RUN_E2E plan=$PLAN_RESULT/$PLAN_RUN build=$BUILD_RESULT seed=$SEED_RESULT → proceed=$PROCEED" >&2

      - uses: actions/checkout@v7
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Dispatch e2e batches
        id: dispatch
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          # PAT_TOKEN, not GITHUB_TOKEN: the probe and the dispatch both cross
          # org boundaries, and events created with GITHUB_TOKEN do not trigger
          # workflows at all.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SELF: ${{ github.repository }}
          FLEET: ${{ inputs.fleet }}
          MODE: ${{ needs.e2e-plan.outputs.mode }}
          PLAN_SHARDS: ${{ needs.e2e-plan.outputs.shards }}
          PLAN_TOTAL: ${{ needs.e2e-plan.outputs.total }}
          DESIRED_TOTAL: ${{ inputs.e2e_shards }}
          TARGETS: ${{ needs.e2e-plan.outputs.targets }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          COORD_RUN_ID: ${{ github.run_id }}
          # Unique per coordinator run+attempt — this is what a batch's
          # run-name embeds and what `collect` matches on.
          CORRELATION: ${{ github.run_id }}-${{ github.run_attempt }}
          # With no recruitable worker the coordinator dispatches to its OWN
          # repo rather than running inline, so there is never a local matrix.
          COORD_FALLBACK_SLOTS: '14'
          # 8 per worker: a worker also runs its own `plan` job, so this sits at
          # 9 of the org's 20 concurrent jobs — loose enough to leave room for a
          # second PR's batch. Paired with the 32-shard default it fans out over
          # exactly four workers.
          WORKER_SLOTS: '8'
        run: |
          set -euo pipefail
          if [ ! -f .github/scripts/ci-fanout.mjs ]; then
            echo "::error::.github/scripts/ci-fanout.mjs is missing on this ref — rebase the PR onto main."
            exit 1
          fi
          node .github/scripts/ci-fanout.mjs dispatch

      - name: Wait for e2e batches
        id: collect
        if: ${{ steps.gate.outputs.proceed == 'true' && steps.dispatch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          FANOUT: ${{ steps.dispatch.outputs.fanout }}
          TIMEOUT_S: '2400'
        run: node .github/scripts/ci-fanout.mjs collect

      # Consumed by /watch-ci and /fix-ci (via scripts/ppap-ci-repo.sh
      # --fanout) to find the shard logs that live in other repos. Uploaded
      # after collect so it carries the resolved run ids.
      - name: Upload fan-out map
        if: ${{ always() && steps.gate.outputs.proceed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-fanout
          path: ci-fanout.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Emit e2e verdict
        id: verdict
        if: ${{ always() }}
        env:
          PROCEED: ${{ steps.gate.outputs.proceed }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
          DISPATCH: ${{ steps.dispatch.outcome }}
          COLLECT: ${{ steps.collect.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outputs.result }}
        run: |
          set -euo pipefail
          if [ "$PROCEED" != "true" ]; then
            RESULT="$GATE_RESULT"
          elif [ "$DISPATCH" != "success" ]; then
            # ci-fanout.mjs throws rather than dispatch a partial set, so a
            # failed dispatch means an unknown share of the suite never ran.
            RESULT=failure
          elif [ "$COLLECT" != "success" ] || [ "$COLLECT_RESULT" != "success" ]; then
            RESULT=failure
          else
            RESULT=success
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "▶ e2e verdict: proceed=$PROCEED dispatch=$DISPATCH collect=$COLLECT/$COLLECT_RESULT → $RESULT" >&2
