name: CI · Checks · Reusable

# Reusable CI graph: biome / typecheck / lint / test in parallel against an
# arbitrary erp-namthuan ref. Called by both PR-CI (ppap:ci-pr.yml) and the
# deploy gate (ppap:deploy-reusable.yml). Outputs each job's `result` so
# callers can build a per-job summary.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'erp-namthuan ref to check out (refs/pull/<N>/merge for PR CI, sha for staging deploy, refs/tags/<tag> for production).'
        type: string
        required: true
      e2e_shards:
        description: 'Number of parallel Playwright shards. Tune up/down here; both PR CI and the deploy gate inherit it.'
        type: number
        default: 4
      run_e2e:
        description: 'Whether to run the e2e matrix. PR CI keeps the default (true); the deploy gate passes false so staging/production builds are not blocked on dashboard e2e.'
        type: boolean
        default: true
    outputs:
      biome:
        description: 'Result of the biome job'
        value: ${{ jobs.biome.result }}
      typecheck:
        description: 'Result of the typecheck job'
        value: ${{ jobs.typecheck.result }}
      lint:
        description: 'Result of the lint job'
        value: ${{ jobs.lint.result }}
      test:
        description: 'Result of the test job'
        value: ${{ jobs.test.result }}
      e2e:
        description: 'Aggregated result of the e2e matrix (success only when all shards pass)'
        value: ${{ jobs.e2e.result }}
    secrets:
      PAT_TOKEN:
        required: true

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  biome:
    name: 1 · CI · Biome (format + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm biome ci .

  typecheck:
    name: 1 · CI · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm typecheck

  lint:
    name: 1 · CI · Lint workspaces (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm lint:js:packages

  test:
    name: 1 · CI · Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm test:ci

  # Fans the integer `e2e_shards` input into a JSON array (`[1,2,...,N]`) so
  # the e2e matrix below can consume it via fromJSON. GitHub Actions has no
  # native "shard 1..N from a number" matrix syntax. Outputs both the array
  # and the total so the playwright --shard=N/TOTAL flag stays in sync.
  e2e-setup:
    name: 1 · CI · E2E (plan shards)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - id: gen
        env:
          TOTAL: ${{ inputs.e2e_shards }}
        run: |
          set -euo pipefail
          SHARDS=$(seq 1 "$TOTAL" | jq -R 'tonumber' | jq -cs '.')
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"  >> "$GITHUB_OUTPUT"

  # Playwright e2e. Each shard boots a dedicated e2e stack via `pnpm e2e:serve`
  # (builds the dashboard via OpenNext, seeds an isolated DB, then runs ONE
  # wrangler session — dashboard worker primary, gateway & leaves as portless
  # auxiliaries — on a free port, with NO proxy and NO assistant) and runs its
  # slice of specs against http://localhost:<port> via PLAYWRIGHT_NO_WEB_SERVER=1
  # so Playwright doesn't spawn its own server. `fail-fast: false`
  # so one flaky shard doesn't mask failures elsewhere — the aggregated
  # `jobs.e2e.result` still flips to `failure` if any shard fails.
  e2e:
    name: 1 · CI · E2E (shard ${{ matrix.shard }})
    needs: e2e-setup
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      # No /etc/hosts or TLS cert: e2e hits the dashboard worker directly on a
      # free port over plain http://localhost (no proxy, no namthuan.local).

      # Cache the Chromium download keyed on @playwright/test's resolved
      # version from the lockfile. Saves ~1 min/shard on cache hit.
      - name: Resolve Playwright version
        id: pw
        run: |
          set -euo pipefail
          VER=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Boot a dedicated e2e stack on a free port (dashboard worker + gateway +
      # leaves as bindings — NO proxy, NO assistant) in its own process group so
      # teardown can signal the whole tree. `e2e:serve` builds the dashboard
      # (generic relative `/api` build — no host/port baked), seeds an isolated
      # `.wrangler/state-e2e`, writes the chosen port to `.wrangler/e2e-port`,
      # then runs the wrangler session in the foreground. Playwright then hits
      # http://localhost:<port> directly. `set -m` makes $! the PGID.
      - name: Boot e2e stack
        id: e2e
        run: |
          set -uo pipefail
          set -m
          nohup pnpm e2e:serve >e2e-serve.log 2>&1 &
          SERVE_PID=$!
          set +m
          echo "serve_pid=$SERVE_PID" >> "$GITHUB_OUTPUT"
          # Port file is written before the build, so it appears quickly.
          for _ in $(seq 1 60); do
            [ -s .wrangler/e2e-port ] && break
            kill -0 "$SERVE_PID" 2>/dev/null || { echo "::error::e2e:serve exited early"; tail -n 80 e2e-serve.log; exit 1; }
            sleep 1
          done
          PORT="$(cat .wrangler/e2e-port 2>/dev/null || true)"
          if [ -z "$PORT" ]; then echo "::error::e2e:serve never reported a port"; tail -n 80 e2e-serve.log; exit 1; fi
          echo "base=http://localhost:$PORT" >> "$GITHUB_OUTPUT"
          # build (OpenNext) + seed + worker warmup → allow up to 5 min.
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "::error::e2e stack exited before becoming ready"
              tail -n 80 e2e-serve.log
              exit 1
            fi
            if curl -sf "http://localhost:$PORT/api/health" >/dev/null 2>&1; then
              echo "✓ e2e stack ready on :$PORT (PID $SERVE_PID)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Timed out after 300s waiting for http://localhost:$PORT/api/health"
          tail -n 80 e2e-serve.log
          kill -KILL -- -"$SERVE_PID" 2>/dev/null || true
          exit 1

      - name: Run Playwright shard ${{ matrix.shard }}/${{ needs.e2e-setup.outputs.total }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.e2e.outputs.base }}
          PLAYWRIGHT_NO_WEB_SERVER: '1'
        run: |
          pnpm exec playwright test --reporter=line \
            --shard=${{ matrix.shard }}/${{ needs.e2e-setup.outputs.total }}

      - name: Tear down e2e stack
        if: always()
        env:
          SERVE_PID: ${{ steps.e2e.outputs.serve_pid }}
        run: |
          if [ -n "${SERVE_PID:-}" ]; then
            kill -TERM -- -"$SERVE_PID" 2>/dev/null || true
            sleep 2
            kill -KILL -- -"$SERVE_PID" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e-serve.log
          retention-days: 7
          if-no-files-found: ignore
