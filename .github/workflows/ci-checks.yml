name: CI · Checks · Reusable

# Reusable CI graph: biome / typecheck / lint / test in parallel against an
# arbitrary erp-namthuan ref. Called by both PR-CI (ppap:ci-pr.yml) and the
# deploy gate (ppap:deploy-reusable.yml). Outputs each job's `result` so
# callers can build a per-job summary.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'erp-namthuan ref to check out (refs/pull/<N>/merge for PR CI, sha for staging deploy, refs/tags/<tag> for production).'
        type: string
        required: true
      e2e_shards:
        description: 'Number of parallel Playwright shards. Tune up/down here; both PR CI and the deploy gate inherit it.'
        type: number
        default: 4
      run_e2e:
        description: 'Whether to run the e2e matrix. PR CI keeps the default (true); the deploy gate passes false so staging/production builds are not blocked on dashboard e2e.'
        type: boolean
        default: true
    outputs:
      biome:
        description: 'Result of the biome job'
        value: ${{ jobs.biome.result }}
      typecheck:
        description: 'Result of the typecheck job'
        value: ${{ jobs.typecheck.result }}
      lint:
        description: 'Result of the lint job'
        value: ${{ jobs.lint.result }}
      test:
        description: 'Result of the test job'
        value: ${{ jobs.test.result }}
      e2e:
        description: 'Aggregated result of the e2e matrix (success only when all shards pass)'
        value: ${{ jobs.e2e.result }}
    secrets:
      PAT_TOKEN:
        required: true

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  biome:
    name: 1 · CI · Biome (format + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm biome ci .

      # Repo-wide suppression/skip gate: no biome-ignore / eslint-disable /
      # @ts-ignore and no test skip in ANY form may exist in the codebase
      # (.claude/rules.md § "Never skip checks, never suppress").
      - run: bash scripts/check-no-suppressions.sh

  typecheck:
    name: 1 · CI · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm typecheck

  lint:
    name: 1 · CI · Lint workspaces (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm lint:js:packages

  test:
    name: 1 · CI · Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm test:ci

  # Fans the integer `e2e_shards` input into a JSON array (`[1,2,...,N]`) so
  # the e2e matrix below can consume it via fromJSON. GitHub Actions has no
  # native "shard 1..N from a number" matrix syntax. Outputs both the array
  # and the total so the playwright --shard=N/TOTAL flag stays in sync.
  e2e-setup:
    name: 1 · CI · E2E (plan shards)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - id: gen
        env:
          TOTAL: ${{ inputs.e2e_shards }}
        run: |
          set -euo pipefail
          SHARDS=$(seq 1 "$TOTAL" | jq -R 'tonumber' | jq -cs '.')
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"  >> "$GITHUB_OUTPUT"

  # Build the dashboard (OpenNext) + seed the isolated e2e DB ONCE, then publish
  # both as a single tarball artifact the shards download. This is the dominant
  # cold-boot cost (a no-cache Next build is ~60–120s on a 2-core runner); doing
  # it here once instead of per-shard removes 3 of 4 builds + reseeds outright.
  # Each shard is a separate runner, so its untarred copy of the state dir is its
  # own mutable DB — shard isolation is preserved without snapshotting.
  e2e-build:
    name: 1 · CI · E2E (build + seed)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      # Warm the Next compiler cache across runs. build:pages still runs (so it
      # always re-evaluates source — no stale-build risk) but reuses prior
      # compilation work, cutting a cold ~60–120s build to ~20–40s on unchanged
      # source. Invalidates on lockfile + dashboard/packages source changes.
      - name: Cache Next build
        uses: actions/cache@v5
        with:
          # Every zone's Next compiler cache (the glob matches each app that has
          # one — shell + Multi-Zone workers; just the shell pre-split).
          path: apps/*/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**', 'packages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Generic relative `/api` build — no host/port baked, so the same bundle
      # boots on every shard's free port. Builds EVERY FE app that has a
      # `build:pages` script — the shell + the four Multi-Zone zones (expense /
      # exms / hris / utilities); the e2e stack boots all of them, so all must be
      # prebuilt. `--filter './apps/*'` selects by PATH (the packages no longer
      # share a `dashboard*` name prefix); `--if-present` skips the dispatcher (a
      # plain Worker with no build:pages) and any other non-buildable app.
      - name: Build dashboard zones (once)
        run: pnpm --filter './apps/*' --if-present run build:pages

      # Isolated-state branch of db-reset.sh: per-service `wrangler d1 migrations
      # apply --persist-to .wrangler/state-e2e`, no ExMS demo seed — exactly the
      # DB each shard would have produced itself.
      - name: Seed e2e database (once)
        run: STATE_DIR=.wrangler/state-e2e bash scripts/db-reset.sh

      # tar (not a raw many-small-files upload) so the .open-next file count
      # doesn't make upload/download slow. Content is mostly-incompressible
      # sqlite + an already-minified bundle, so skip artifact gzip.
      # Bundle every zone's `.open-next` (the `apps/*/.open-next` glob expands to
      # each built zone — shell + Multi-Zone workers; just the shell pre-split).
      - name: Package build + seed bundle
        run: tar -cf e2e-bundle.tar apps/*/.open-next .wrangler/state-e2e

      - name: Upload e2e bundle
        uses: actions/upload-artifact@v7
        with:
          name: e2e-bundle
          path: e2e-bundle.tar
          retention-days: 1
          compression-level: 0

  # Playwright e2e. Each shard restores the prebuilt dashboard + seeded DB from
  # the e2e-build artifact, then boots ONE wrangler session via `pnpm e2e:serve`
  # with BUILD=0 RESEED=0 (dashboard worker primary, gateway & leaves as portless
  # auxiliaries — on a free port, with NO proxy and NO assistant) and runs its
  # slice of specs against http://localhost:<port> via PLAYWRIGHT_NO_WEB_SERVER=1
  # so Playwright doesn't spawn its own server. Because build + seed already ran
  # once in e2e-build, the per-shard boot is just the wrangler cold start.
  # `fail-fast: false` so one flaky shard doesn't mask failures elsewhere — the
  # aggregated `jobs.e2e.result` still flips to `failure` if any shard fails.
  e2e:
    name: 1 · CI · E2E (shard ${{ matrix.shard }})
    needs: [e2e-setup, e2e-build]
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      # Restore the dashboard build (.open-next) + seeded DB (.wrangler/state-e2e)
      # produced once by e2e-build. Untarred here, this is this shard's own
      # mutable copy — tests can write freely without affecting other shards.
      - name: Restore e2e bundle (build + seed)
        uses: actions/download-artifact@v7
        with:
          name: e2e-bundle

      - name: Unpack e2e bundle
        run: tar -xf e2e-bundle.tar

      # No /etc/hosts or TLS cert: e2e hits the dashboard worker directly on a
      # free port over plain http://localhost (no proxy, no namthuan.local).

      # Cache the Chromium download keyed on @playwright/test's resolved
      # version from the lockfile. Saves ~1 min/shard on cache hit.
      - name: Resolve Playwright version
        id: pw
        run: |
          set -euo pipefail
          VER=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Boot a dedicated e2e stack on a free port (dashboard worker + gateway +
      # leaves as bindings — NO proxy, NO assistant) in its own process group so
      # teardown can signal the whole tree. BUILD=0 RESEED=0: the dashboard build
      # and DB seed already came from the e2e-build artifact, so `e2e:serve` only
      # picks a free port, writes it to `.wrangler/e2e-port`, and runs the wrangler
      # session in the foreground. Playwright then hits http://localhost:<port>
      # directly. `set -m` makes $! the PGID.
      - name: Boot e2e stack
        id: e2e
        run: |
          set -uo pipefail
          set -m
          nohup env BUILD=0 RESEED=0 pnpm e2e:serve >e2e-serve.log 2>&1 &
          SERVE_PID=$!
          set +m
          echo "serve_pid=$SERVE_PID" >> "$GITHUB_OUTPUT"
          # Port file is written before the build, so it appears quickly.
          for _ in $(seq 1 60); do
            [ -s .wrangler/e2e-port ] && break
            kill -0 "$SERVE_PID" 2>/dev/null || { echo "::error::e2e:serve exited early"; tail -n 80 e2e-serve.log; exit 1; }
            sleep 1
          done
          PORT="$(cat .wrangler/e2e-port 2>/dev/null || true)"
          if [ -z "$PORT" ]; then echo "::error::e2e:serve never reported a port"; tail -n 80 e2e-serve.log; exit 1; fi
          echo "base=http://localhost:$PORT" >> "$GITHUB_OUTPUT"
          # Build + seed are prebuilt now, so only the wrangler cold start
          # remains — but the Multi-Zone stack boots the main process (dispatcher
          # + shell + gateway + leaves) PLUS one `wrangler dev` per zone worker
          # (serve-stack waits on each zone's port before the main process), so
          # allow up to 5 min for that heavier cold start.
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "::error::e2e stack exited before becoming ready"
              tail -n 80 e2e-serve.log
              exit 1
            fi
            if curl -sf "http://localhost:$PORT/api/health" >/dev/null 2>&1; then
              echo "✓ e2e stack ready on :$PORT (PID $SERVE_PID)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Timed out after 120s waiting for http://localhost:$PORT/api/health"
          tail -n 80 e2e-serve.log
          kill -KILL -- -"$SERVE_PID" 2>/dev/null || true
          exit 1

      - name: Run Playwright shard ${{ matrix.shard }}/${{ needs.e2e-setup.outputs.total }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.e2e.outputs.base }}
          PLAYWRIGHT_NO_WEB_SERVER: '1'
        run: |
          pnpm exec playwright test --reporter=line \
            --shard=${{ matrix.shard }}/${{ needs.e2e-setup.outputs.total }}

      - name: Tear down e2e stack
        if: always()
        env:
          SERVE_PID: ${{ steps.e2e.outputs.serve_pid }}
        run: |
          if [ -n "${SERVE_PID:-}" ]; then
            kill -TERM -- -"$SERVE_PID" 2>/dev/null || true
            sleep 2
            kill -KILL -- -"$SERVE_PID" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e-serve.log
          retention-days: 7
          if-no-files-found: ignore
