name: CI · Checks · Reusable

# Reusable CI graph: biome / typecheck / lint / test in parallel against an
# arbitrary erp-namthuan ref. Called by both PR-CI (ppap:ci-pr.yml) and the
# deploy gate (ppap:deploy-reusable.yml). Outputs each job's `result` so
# callers can build a per-job summary.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'erp-namthuan ref to check out (refs/pull/<N>/merge for PR CI, sha for staging deploy, refs/tags/<tag> for production).'
        type: string
        required: true
      e2e_shards:
        description: 'DESIRED number of parallel Playwright shards. The effective count is min(this, available capacity) — see the e2e-fanout job. 32 = 4 workers x 8 shards at the default WORKER_SLOTS. Both PR CI and the deploy gate inherit it.'
        type: number
        default: 32
      fleet:
        description: 'Comma-separated owner/repo list of ppap CI repos this run may borrow idle e2e capacity from (the erp-namthuan variable PPAP_CI_REPOS). Empty ⇒ no fan-out; every shard runs on this repo.'
        type: string
        default: ''
      pr_number:
        description: 'Source PR number, forwarded to e2e batches so they can detect a moved head and bail early.'
        type: string
        default: ''
      head_sha:
        description: 'Head SHA under test, forwarded to e2e batches for the same stale check.'
        type: string
        default: ''
      run_e2e:
        description: 'Whether to run the e2e matrix. PR CI keeps the default (true); the deploy gate passes false so staging/production builds are not blocked on dashboard e2e.'
        type: boolean
        default: true
      e2e_changed_only:
        description: 'Scope e2e to the changed service''s specs (broad/shared change → full suite, nothing relevant → skip). PR CI passes true; the production deploy gate leaves the default false → full suite. See scripts/e2e-plan.sh.'
        type: boolean
        default: false
    outputs:
      biome:
        description: 'Result of the biome job'
        value: ${{ jobs.biome.result }}
      typecheck:
        description: 'Aggregated result of the sharded typecheck matrix.'
        value: ${{ jobs.typecheck-aggregate.outputs.result }}
      lint:
        description: 'Result of the lint job'
        value: ${{ jobs.lint.result }}
      test:
        description: 'Aggregated result of the sharded Vitest matrix.'
        value: ${{ jobs.test-aggregate.outputs.result }}
      e2e:
        description: 'Aggregated e2e result: success when all shards pass OR when a change-scoped run had nothing relevant to test (skip); failure if any shard failed.'
        value: ${{ jobs.e2e-aggregate.outputs.result }}
      noise_clean:
        description: '"true" when the run has zero flaky / dup-testid / hydration / i18n-missing / font-preload / http-404 / biome-warning / vitest-stderr; "false" otherwise. Empty if the noise scan did not run.'
        value: ${{ jobs.noise-report.outputs.clean }}
      noise_summary:
        description: 'Compact per-signal noise counts, e.g. "flaky 0 · dup 0 · hyd 0 · i18n 0 · font 0 · 404 0 · biome 0 · vitest 0".'
        value: ${{ jobs.noise-report.outputs.summary }}
    secrets:
      PAT_TOKEN:
        required: true

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  # Pre-seed init.defaultBranch so actions/checkout's internal `git init` stops
  # printing the "hint: git config --global init.defaultBranch <name>" line on
  # every job. git reads these GIT_CONFIG_* env vars as extra config, so the
  # hint's precondition (unset init.defaultBranch) is never met. Cosmetic
  # CI-log-noise removal only.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  biome:
    name: 1 · CI · Biome (format + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          # Full history so HEAD^1 (the PR's base parent on the merge ref) is
          # available for the demo-migration-guard diff below.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm biome ci .

      # Repo-wide suppression/skip gate: no biome-ignore / eslint-disable /
      # @ts-ignore and no test skip in ANY form may exist in the codebase
      # (.claude/rules.md § "Never skip checks, never suppress").
      - run: bash scripts/check-no-suppressions.sh

      # Demo/test fixtures must never ship as a schema migration under
      # apis/*/migrations/ — they apply to Staging AND Production with no
      # environment filter (this has recurred twice; see
      # docs/ba/scnpms/bug/cross-module/2026-08-04-demo-fixture-data-live-in-staging-and-production.md).
      # Diff-scoped to files ADDED by this PR (HEAD^1 = the base parent on
      # refs/pull/N/merge, same convention as scripts/e2e-plan.sh) — the 22
      # already-shipped demo migrations stay in place and must not retrigger.
      - run: bash scripts/check-demo-migrations.sh

      # Email-authentication gate for the OTP sender domains: DKIM at
      # cf-bounce._domainkey, SPF at cf-bounce, bounce MX, exactly one DMARC
      # record. Live DNS only — no Cloudflare credentials. Lives here rather
      # than in a job of its own because it takes seconds and needs no build;
      # grouped with the other repo-wide gates on this job.
      #
      # `dig` is installed if absent rather than assumed: the script treats a
      # missing resolver as a hard failure under CI (see its NO_RESOLVER note),
      # because a gate that silently skips itself is worth no more than no gate.
      - name: Assert sender-domain email DNS
        run: |
          command -v dig >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          }
          bash scripts/check-email-dns.sh

  # Typecheck, split across parallel legs — same reasoning as the Vitest matrix
  # above (389s as one job, and the dominant cost on any PR whose e2e is
  # skipped).
  #
  # The legs are INDEPENDENT: every workspace package resolves its siblings to
  # raw TypeScript (`packages/api-types` exports `./src/index.ts`,
  # `packages/dashboard-shell` exports `./src/*`), so no leg needs another
  # leg's emitted `.d.ts` and there is no build ordering to preserve. If a
  # package is ever changed to publish `dist/`, that assumption breaks and the
  # legs must gain a `needs:` on whichever leg builds it.
  #
  # Three legs, for the same 20-job concurrency reason as the Vitest matrix.
  # Weights from measured per-package runtime (local seconds), 223s over 34
  # packages:
  #   a 71 · b 76 · rest 76
  # `api-monolith` (27s) and `shell` (26s) are the outliers; they anchor
  # separate legs, so ~27 is this branch's floor at any leg count.
  #
  # BINNED_PKGS / `rest` catch-all: see the note on the Vitest matrix.
  typecheck:
    name: 1 · CI · Typecheck (${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINNED_PKGS: >-
        @namthuanvn/api-monolith @namthuanvn/oms @namthuanvn/assistant @namthuanvn/exms
        @namthuanvn/procurement @namthuanvn/sourcing @namthuanvn/zone-bom
        @namthuanvn/shell @namthuanvn/zone-expense @namthuanvn/zone-oms @namthuanvn/zone-sourcing
        @namthuanvn/auth @namthuanvn/bom @namthuanvn/expense @namthuanvn/social @namthuanvn/audit
    strategy:
      fail-fast: false
      matrix:
        leg:
          - name: a      # 71
            pkgs: '@namthuanvn/api-monolith @namthuanvn/oms @namthuanvn/assistant @namthuanvn/exms @namthuanvn/procurement @namthuanvn/sourcing @namthuanvn/zone-bom'
          - name: b      # 76
            pkgs: '@namthuanvn/shell @namthuanvn/zone-expense @namthuanvn/zone-oms @namthuanvn/zone-sourcing @namthuanvn/auth @namthuanvn/bom @namthuanvn/expense @namthuanvn/social @namthuanvn/audit'
          - name: rest   # 76
            pkgs: ''   # catch-all — everything not in BINNED_PKGS
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Run typecheck leg
        env:
          LEG: ${{ matrix.leg.name }}
          PKGS: ${{ matrix.leg.pkgs }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -z "$PKGS" ]; then
            for p in $BINNED_PKGS; do ARGS+=(--filter "!$p"); done
          else
            for p in $PKGS; do
              case " $BINNED_PKGS " in
                *" $p "*) ;;
                *) echo "::error::typecheck leg '$LEG' runs $p but BINNED_PKGS does not list it — the 'rest' leg would run it a second time. Add it to BINNED_PKGS."; exit 1 ;;
              esac
              ARGS+=(--filter "$p")
            done
          fi
          echo "▶ typecheck leg '$LEG': pnpm -r ${ARGS[*]} typecheck"
          pnpm -r "${ARGS[@]}" typecheck

  # Collapse the typecheck matrix into the single `typecheck` workflow output.
  typecheck-aggregate:
    name: 1 · CI · Typecheck (result)
    needs: typecheck
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      result: ${{ steps.agg.outputs.result }}
    steps:
      - id: agg
        env:
          TC_RESULT: ${{ needs.typecheck.result }}
        run: |
          set -euo pipefail
          echo "result=$TC_RESULT" >> "$GITHUB_OUTPUT"
          echo "▶ typecheck aggregate: $TC_RESULT" >&2

  lint:
    name: 1 · CI · Lint workspaces (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - run: pnpm lint:js:packages

  # Vitest, split across parallel legs. `pnpm test:ci` (= `pnpm -r test --
  # --run`) as ONE job was 474s and the second-longest branch in the graph —
  # long enough that it becomes the critical path the moment the e2e matrix is
  # widened, so sharding e2e without sharding this buys nothing past ~28
  # shards. It is also the WHOLE cost of a PR whose e2e plan says `skip`: run
  # 31667489668 (a .github/-only change) took 7.3 min with no e2e at all.
  #
  # Two effects, both wins. The obvious one is parallelism. The subtler one is
  # that `pnpm -r` defaults to a workspace concurrency of ~4 while each vitest
  # then spawns its own worker pool — on a 4-vCPU runner that is ~16 test
  # processes fighting over 4 cores. Measured locally the same 32 packages take
  # ~93s wall-clock; CI spends 474s. Fewer packages per leg means far less
  # oversubscription, so the legs should beat a naive 474/6.
  #
  # LEG COUNT IS CAPPED BY THE ORG'S CONCURRENCY BUDGET, not by how finely the
  # suite splits. A coordinator run must fit GitHub Free's 20 concurrent jobs:
  # biome 1 + lint 1 + e2e-plan 1 + zone builds 10 + seed 1 = 14 are fixed and
  # the zone builds sit on the critical path, so typecheck + vitest legs must
  # total at most 6 or the scheduler queues something — quite possibly a zone
  # build, which would cost more wall-clock than the extra legs save. Hence 3
  # here and 3 for typecheck: peak lands exactly on 20 with nothing queued.
  #
  # Leg weights come from measured per-package runtime (local seconds, used as
  # a relative proxy — CI is uniformly slower). Total 93s over 32 packages:
  #   app-shell 30 · shell-ui 31 · rest 32
  # `shell` (17) and `dashboard-shell` (15) are single packages too big to
  # split, so each anchors a leg and is topped up with small ones.
  #
  # COVERAGE IS BY CONSTRUCTION, not by review: the `rest` leg is a catch-all
  # that EXCLUDES the explicitly-binned packages instead of listing its own, so
  # a newly added workspace package automatically runs there. The dangerous
  # failure (a package silently tested by NO leg) is therefore unreachable.
  # `pnpm -r` skips packages with no `test` script, so the 4 script-less
  # packages are free no-ops.
  #
  # BINNED_PKGS must list exactly the packages named in the five explicit legs
  # — it is what `rest` subtracts. Each named leg asserts its own packages
  # appear here, so the two drift loudly rather than silently. Worst case if
  # they do drift, a package runs in two legs: wasteful, never unsafe.
  test:
    name: 1 · CI · Unit tests (Vitest · ${{ matrix.leg.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BINNED_PKGS: >-
        @namthuanvn/shell @namthuanvn/oms @namthuanvn/procurement @namthuanvn/notifications
        @namthuanvn/dashboard-shell @namthuanvn/sourcing @namthuanvn/hris @namthuanvn/exms
        @namthuanvn/zone-oms @namthuanvn/api-types @namthuanvn/auth
    strategy:
      # Report every leg's failures in one run — unlike the e2e matrix these
      # are cheap, and a single aggregated red is more useful than the first
      # leg cancelling its siblings.
      fail-fast: false
      matrix:
        leg:
          - name: app-shell   # 30
            pkgs: '@namthuanvn/shell @namthuanvn/oms @namthuanvn/procurement @namthuanvn/notifications'
          - name: shell-ui    # 31
            pkgs: '@namthuanvn/dashboard-shell @namthuanvn/sourcing @namthuanvn/hris @namthuanvn/exms @namthuanvn/zone-oms @namthuanvn/api-types @namthuanvn/auth'
          - name: rest        # 32
            pkgs: ''   # catch-all — everything not in BINNED_PKGS
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Run vitest leg
        env:
          LEG: ${{ matrix.leg.name }}
          PKGS: ${{ matrix.leg.pkgs }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -z "$PKGS" ]; then
            # Catch-all leg: start from every workspace package and subtract the
            # binned ones. pnpm treats a filter set containing only negations as
            # "all packages except these".
            for p in $BINNED_PKGS; do ARGS+=(--filter "!$p"); done
          else
            for p in $PKGS; do
              # Drift guard — see the BINNED_PKGS note above.
              case " $BINNED_PKGS " in
                *" $p "*) ;;
                *) echo "::error::leg '$LEG' runs $p but BINNED_PKGS does not list it — the 'rest' leg would run it a second time. Add it to BINNED_PKGS."; exit 1 ;;
              esac
              ARGS+=(--filter "$p")
            done
          fi
          echo "▶ vitest leg '$LEG': pnpm -r ${ARGS[*]} test -- --run"
          pnpm -r "${ARGS[@]}" test -- --run

  # Collapse the vitest matrix into the single `test` workflow output the
  # callers consume, so ci-pr.yml's `report` keeps posting one `vitest ✓`.
  # Same shape as e2e-aggregate below.
  test-aggregate:
    name: 1 · CI · Unit tests (result)
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      result: ${{ steps.agg.outputs.result }}
    steps:
      - id: agg
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "result=$TEST_RESULT" >> "$GITHUB_OUTPUT"
          echo "▶ vitest aggregate: $TEST_RESULT" >&2

  # Plan the e2e run. Two responsibilities:
  #   1. Decide SCOPE — when e2e_changed_only is true (PR CI), diff the PR
  #      (HEAD^1..HEAD on refs/pull/N/merge) through scripts/e2e-plan.sh:
  #      full | scoped <specs> | skip. Otherwise (deploy gate) → full.
  #   2. Fan the effective shard count into a JSON array (`[1,2,...,N]`) for the
  #      matrix via fromJSON — full → e2e_shards shards; scoped → 1 shard (a
  #      handful of specs doesn't need 12 stacks); skip → empty (matrix no-op).
  # Pure git + jq + bash (no pnpm install). `run` is 'true' unless mode==skip.
  e2e-plan:
    name: 1 · CI · E2E (plan)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          # Full history so HEAD^1 (the PR's base parent on the merge ref) is
          # available for the diff.
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        env:
          CHANGED_ONLY: ${{ inputs.e2e_changed_only }}
          TOTAL: ${{ inputs.e2e_shards }}
        run: |
          set -euo pipefail
          MODE=full
          TARGETS=""
          if [ "$CHANGED_ONLY" = "true" ]; then
            # HEAD^1 on refs/pull/N/merge = the base (main); the diff to HEAD is
            # exactly the PR's delta.
            DECISION="$(E2E_PLAN_BASE=HEAD^1 bash scripts/e2e-plan.sh)"
            MODE="${DECISION%% *}"
            TARGETS="${DECISION#"$MODE"}"; TARGETS="${TARGETS# }"
          fi
          case "$MODE" in
            skip)
              echo "run=false"  >> "$GITHUB_OUTPUT"
              echo "shards=[]"  >> "$GITHUB_OUTPUT"
              echo "total=0"    >> "$GITHUB_OUTPUT" ;;
            scoped)
              # A scoped run USED to be pinned to exactly one shard, on the
              # assumption that "a handful of specs doesn't need 12 stacks".
              # That assumption does not hold: e2e-plan.sh emits spec
              # DIRECTORIES as well as files, and the groups are wildly uneven
              # — `sourcing`/`apis/sourcing` map to apps/shell/e2e/scpms, which
              # is 199 of the suite's 327 spec files. Those all ran serially in
              # ONE job, so the most common kind of PR in this repo got the
              # slowest possible e2e.
              #
              # Size the matrix to the number of specs actually selected, at
              # the same ~25-specs-per-shard density the full run uses (327
              # specs / 12 shards). Capped at 8 so a scoped run still leaves
              # room in the org's 20-job budget for the rest of the graph.
              SPEC_COUNT=0
              for t in $TARGETS; do
                if [ -d "$t" ]; then
                  n=$(find "$t" -name '*.spec.ts' -type f | wc -l)
                else
                  n=1
                fi
                SPEC_COUNT=$(( SPEC_COUNT + n ))
              done
              N=$(( (SPEC_COUNT + 24) / 25 ))
              [ "$N" -lt 1 ] && N=1
              [ "$N" -gt 8 ] && N=8
              SHARDS=$(seq 1 "$N" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"      >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
              echo "total=$N"       >> "$GITHUB_OUTPUT"
              echo "▶ scoped: $SPEC_COUNT spec files → $N shard(s)" >&2 ;;
            *)
              SHARDS=$(seq 1 "$TOTAL" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"       >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS"  >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL"    >> "$GITHUB_OUTPUT" ;;
          esac
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "▶ e2e plan: mode=$MODE targets=[$TARGETS]" >&2

  # Build each dashboard zone on its OWN runner, in parallel. The 6 OpenNext
  # zones are fully independent (no cross-zone deps; dashboard-shell exports raw
  # `src/` so there's no prebuild step), so a per-zone matrix turns the old
  # ~258s serial "build all 6 on one 2-core runner" step into ~6 concurrent
  # ~60–90s builds — the dominant PR-CI / deploy-gate cost. Each leg tars its own
  # `apps/<zone>/.open-next` and uploads it; the shards download every zone tar
  # and reassemble the tree. `fail-fast: false` so one zone's build failure
  # doesn't mask the others. Free on public-repo minutes — fan out wide.
  e2e-build-zones:
    name: 1 · CI · E2E (build ${{ matrix.zone.name }})
    needs: e2e-plan
    # Skipped when the plan says nothing e2e-relevant changed. A scoped run still
    # builds ALL zones — the e2e stack boots the whole multi-zone router.
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zone:
          - { name: shell, pkg: '@namthuanvn/shell' }
          - { name: expense, pkg: '@namthuanvn/zone-expense' }
          - { name: exms, pkg: '@namthuanvn/zone-exms' }
          - { name: oms, pkg: '@namthuanvn/zone-oms' }
          - { name: sourcing, pkg: '@namthuanvn/zone-sourcing' }
          - { name: bom, pkg: '@namthuanvn/zone-bom' }
          - { name: quotation, pkg: '@namthuanvn/zone-quotation' }
          - { name: procurement, pkg: '@namthuanvn/zone-procurement' }
          - { name: hris, pkg: '@namthuanvn/zone-hris' }
          - { name: utilities, pkg: '@namthuanvn/zone-utilities' }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      # OUTPUT cache — the packaged bundle itself, not just the compiler cache.
      # On a hit this job does checkout → restore → upload (~10s) and skips
      # install AND the build entirely; the ~103–166s build is the single
      # largest item on the e2e critical path, so this is the cheapest minute
      # in the graph to buy back.
      #
      # The key must name EVERYTHING that can change the emitted bundle, and
      # nothing that can't — a false hit ships a stale bundle into e2e, which
      # is far worse than a miss. A zone depends on its own source, the shared
      # packages it transpiles (`transpilePackages: api-types, utils,
      # dashboard-shell` — see apps/<zone>/next.config.ts) and the root
      # compile/dependency config. Zones are mutually independent (no
      # cross-zone imports; they share code only through packages/*), which is
      # what makes the PER-ZONE scope sound — and it matters: keying on the
      # whole of `apps/**` busts all ten zones whenever any one app changes,
      # i.e. on almost every PR. Scoped this way, a PR touching apps/quotation
      # rebuilds quotation and restores the other nine.
      - name: Cache zone bundle
        id: zonetar
        uses: actions/cache@v5
        with:
          path: zone-${{ matrix.zone.name }}.tar
          key: zonetar-v1-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json', '.github/actions/install/action.yml', format('apps/{0}/**', matrix.zone.name), 'packages/**') }}
          # No restore-keys ON PURPOSE: a partial-match restore would hand back
          # a bundle built from different source. Exact key or rebuild.

      - uses: ./.github/actions/install
        if: steps.zonetar.outputs.cache-hit != 'true'

      # Warm THIS zone's Next compiler cache across runs. build:pages still runs
      # (so it always re-evaluates source — no stale-build risk) but reuses prior
      # compilation work, cutting a cold ~60–120s build to ~20–40s on unchanged
      # source. Keyed per-zone so the matrix legs don't clobber one another's
      # cache. Scoped to this zone's own inputs for the same reason as the
      # bundle cache above — an `apps/**` key made every zone miss on any app
      # change. Unlike the bundle cache this one KEEPS restore-keys: a stale
      # compiler cache is only a slower build, never a wrong one.
      - name: Cache Next build
        if: steps.zonetar.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: apps/${{ matrix.zone.name }}/.next/cache
          key: next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles(format('apps/{0}/**', matrix.zone.name), 'packages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-${{ matrix.zone.name }}-

      # Generic relative `/api` build — no host/port baked, so the same bundle
      # boots on every shard's free port.
      - name: Build zone (OpenNext)
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.zone.pkg }} run build:pages

      # tar (not a raw many-small-files upload) so the .open-next file count
      # doesn't make upload/download slow. The bundle is already minified, so
      # skip artifact gzip. tar preserves the `apps/<zone>/.open-next` path so
      # the shard reassembles the tree verbatim by untarring every zone tar.
      - name: Package zone build
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: tar -cf zone-${{ matrix.zone.name }}.tar apps/${{ matrix.zone.name }}/.open-next

      # Runs on hit AND miss — on a hit the tar came from the cache, on a miss
      # from the step above. Either way the shards' `pattern: e2e-*` download
      # must find it.
      - name: Upload zone build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-zone-${{ matrix.zone.name }}
          path: zone-${{ matrix.zone.name }}.tar
          retention-days: 1
          compression-level: 0

  # Seed the isolated e2e DB ONCE, in parallel with the zone builds (it only
  # needs the per-service migration scripts, not the dashboard build output).
  # Isolated-state branch of db-reset.sh: per-service `wrangler d1 migrations
  # apply --persist-to .wrangler/state-e2e`, no ExMS demo seed — exactly the DB
  # each shard would have produced itself. Each shard is a separate runner, so
  # its untarred copy of the state dir is its own mutable DB — shard isolation
  # is preserved without snapshotting.
  e2e-seed:
    name: 1 · CI · E2E (seed db)
    needs: e2e-plan
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Seed e2e database (once)
        env:
          # db-reset.sh restores the pre-migrated D1 snapshot, which lives on a
          # release in the PRIVATE repo (it contains real seeded employee/budget
          # data and must not be public). Without a token `gh` cannot read it and
          # this job silently falls back to a full cold migration run — correct,
          # just slower — so the seed step would quietly lose its speedup.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: STATE_DIR=.wrangler/state-e2e bash scripts/db-reset.sh

      # Mostly-incompressible sqlite — skip artifact gzip.
      - name: Package seed
        run: tar -cf e2e-seed.tar .wrangler/state-e2e

      - name: Upload e2e seed
        uses: actions/upload-artifact@v7
        with:
          name: e2e-seed
          path: e2e-seed.tar
          retention-days: 1
          compression-level: 0

  # Playwright e2e. Each shard restores the prebuilt zone bundles + seeded DB
  # from the e2e-build-zones matrix + e2e-seed artifacts, then boots ONE wrangler
  # session via `pnpm e2e:serve` with BUILD=0 RESEED=0 (dashboard worker primary,
  # gateway & leaves as portless auxiliaries — on a free port, with NO proxy and
  # NO assistant) and runs its slice of specs against http://localhost:<port> via
  # PLAYWRIGHT_NO_WEB_SERVER=1 so Playwright doesn't spawn its own server. Because
  # build + seed already ran in parallel upstream, the per-shard boot is just the
  # wrangler cold start.
  # `fail-fast: true`: the first shard to hard-fail cancels the others so the
  # run stops fast instead of grinding through all shards (paired with
  # Playwright `maxFailures: 1`, which stops a shard at its first hard failure).
  # Flaky tests pass on retry and never hard-fail, so this does NOT cancel on a
  # flaky retry — only a genuine failure. The aggregated `jobs.e2e.result` still
  # flips to `failure` if any shard fails. Trade-off vs the old `false`: you see
  # one failure at a time (fix, re-run) rather than the full failure set at once.
  # Decide how wide the e2e matrix can actually go, and borrow capacity from
  # idle fleet repos for the surplus.
  #
  # WHY THIS EXISTS: GitHub Free caps an org at ~20 concurrent jobs, so a
  # single ppap repo can host roughly 14 e2e shards once the rest of this graph
  # is accounted for. `ci-fanout.mjs dispatch` probes the other fleet repos,
  # keeps the ones that are idle RIGHT NOW, and splits the shard indices across
  # coordinator + workers, dispatching one `ci-e2e-batch` per worker.
  #
  # ADAPTIVE ON PURPOSE. A PR borrows only idle repos, so when the fleet is
  # busy (several agent lanes, say) this degrades to exactly the old
  # single-repo behaviour rather than starving the other PRs. That means the
  # shard count — and so the wall-clock — legitimately varies between runs of
  # the same PR. `total` is always logged.
  #
  # It runs AFTER the builds because capacity is only meaningfully knowable at
  # the moment the shards are about to start; probing at plan time would read a
  # fleet state that is ~3 minutes stale.
  e2e-fanout:
    name: 1 · CI · E2E (fan-out)
    needs: [e2e-plan, e2e-build-zones, e2e-seed]
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      total: ${{ steps.fan.outputs.total }}
      local_shards: ${{ steps.fan.outputs.local_shards }}
      has_batches: ${{ steps.fan.outputs.has_batches }}
      fanout: ${{ steps.fan.outputs.fanout }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - id: fan
        env:
          # PAT_TOKEN, not GITHUB_TOKEN: the probe and the dispatch both cross
          # org boundaries, and events created with GITHUB_TOKEN do not trigger
          # workflows at all.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SELF: ${{ github.repository }}
          FLEET: ${{ inputs.fleet }}
          MODE: ${{ needs.e2e-plan.outputs.mode }}
          PLAN_SHARDS: ${{ needs.e2e-plan.outputs.shards }}
          PLAN_TOTAL: ${{ needs.e2e-plan.outputs.total }}
          DESIRED_TOTAL: ${{ inputs.e2e_shards }}
          TARGETS: ${{ needs.e2e-plan.outputs.targets }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          COORD_RUN_ID: ${{ github.run_id }}
          # Unique per coordinator run+attempt — this is what a batch's
          # run-name embeds and what `collect` matches on.
          CORRELATION: ${{ github.run_id }}-${{ github.run_attempt }}
          # The coordinator keeps NO shards of its own: every shard runs in a
          # batch repo. Splitting them — some inline here, some remote — made
          # this run's page show a partial "Matrix: checks / e2e · 8/12 jobs"
          # that reads like the whole suite but is a fraction of it, with no
          # link to the rest. One kind of shard job, in one kind of place.
          #
          # COORD_FALLBACK_SLOTS is the escape hatch: with no recruitable
          # worker, 0 local slots would mean no e2e at all, so the coordinator
          # carries the run itself. That is the ONLY case that still produces a
          # local shard matrix, and it is warned about in the log + summary.
          # 8 shards per worker. A worker also runs its own `plan` job, so
          # this sits at 9 of the org's 20 concurrent jobs — deliberately loose,
          # leaving each org room for a second PR's batch instead of one PR
          # monopolising it. Paired with the 32-shard default this fans out over
          # exactly FOUR workers (32 / 8), and wall-clock is unchanged by the
          # split: the shards run in parallel either way, so per-worker width
          # only decides how close each org sits to its cap.
          COORD_SLOTS: '0'
          COORD_FALLBACK_SLOTS: '14'
          WORKER_SLOTS: '8'
        run: |
          set -euo pipefail
          # Backward-compat, and it is load-bearing on the day this merges.
          # The fleet repos get this workflow the moment the sync runs, but a
          # PR opened BEFORE that merge is checked out at its own merge ref —
          # and if GitHub has not yet recomputed that ref against the new main,
          # `.github/scripts/ci-fanout.mjs` is simply absent. Calling node on a
          # missing file would fail e2e-fanout, and e2e-aggregate turns that
          # into a red `e2e` for a PR that changed nothing e2e-related.
          #
          # Degrade to "no fan-out, run locally" instead — the same shape as
          # the ci-boot-e2e.sh fallback in the shard job below. Remove once
          # every open PR has rebased past this commit.
          if [ ! -f .github/scripts/ci-fanout.mjs ]; then
            # Clamp to the coordinator's slot budget: the plan asked for
            # `e2e_shards` (36) on the assumption the fan-out would place the
            # surplus elsewhere. Running all 36 on one repo would blow the
            # 20-job cap and queue, which is slower than the 12 shards this
            # PR would have had before the change.
            # Written as `if` rather than `[ … ] && N=…`: that terser form
            # evaluates to non-zero when the test is false, which is harmless
            # here only because another statement follows it. This block runs
            # in a narrow window on merge day, so it must not depend on that.
            N="$PLAN_TOTAL"
            if [ "$N" -gt "$COORD_SLOTS" ]; then N="$COORD_SLOTS"; fi
            if [ "$N" -lt 1 ]; then N=1; fi
            SHARDS=$(seq 1 "$N" | jq -R 'tonumber' | jq -cs '.')
            echo "::warning::ci-fanout.mjs is absent on this ref — running $N shard(s) locally with no fan-out. Rebase the PR onto main to enable it."
            {
              echo "total=$N"
              echo "local_shards=$SHARDS"
              echo "has_batches=false"
              echo "fanout={}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/scripts/ci-fanout.mjs dispatch

      # Consumed by /watch-ci and /fix-ci (via scripts/ppap-ci-repo.sh
      # --fanout) to find the shard logs that live in other repos.
      - name: Upload fan-out map
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-fanout
          path: ci-fanout.json
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: 1 · CI · E2E (shard ${{ matrix.shard }})
    needs: [e2e-plan, e2e-build-zones, e2e-seed, e2e-fanout]
    # `local_shards` is '[]' when every shard was fanned out to workers — an
    # empty matrix skips the job, which e2e-aggregate maps correctly.
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' && needs.e2e-fanout.outputs.local_shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.e2e-fanout.outputs.local_shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      # Restore every zone's build (.open-next) + the seeded DB
      # (.wrangler/state-e2e), produced in parallel by the e2e-build-zones matrix
      # + e2e-seed. `pattern: e2e-*` matches all ten `e2e-zone-<name>` artifacts
      # plus `e2e-seed`; `merge-multiple: true` lands every tar in the cwd.
      # Untarring all of them reassembles the exact same tree the old single
      # combined bundle produced. This is this shard's own mutable copy — tests
      # can write freely without affecting other shards.
      - name: Restore e2e build + seed
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-*
          merge-multiple: true

      - name: Unpack e2e build + seed
        run: |
          for f in *.tar; do tar -xf "$f"; done

      # No /etc/hosts or TLS cert: e2e hits the dashboard worker directly on a
      # free port over plain http://localhost (no proxy, no namthuan.local).

      # Cache the Chromium download keyed on @playwright/test's resolved
      # version from the lockfile. Saves ~1 min/shard on cache hit.
      - name: Resolve Playwright version
        id: pw
        run: |
          set -euo pipefail
          VER=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Boot a dedicated e2e stack on a free port (dashboard worker + gateway +
      # leaves as bindings + one `wrangler dev` per zone worker — NO proxy, NO
      # assistant) via scripts/ci-boot-e2e.sh: boot + /api/health + per-zone probe
      # (a zone that booted but serves 5xx is caught here, before the tests, with
      # a precise `::error::zone <x> …`), in its own process group (BUILD=0
      # RESEED=0 — build + seed came from the restored artifacts). Then run THIS
      # shard's Playwright slice against the reported port. Reboot the stack and
      # re-run the shard ONCE on an INFRA failure — the boot failed (a crashed /
      # SQLITE_BUSY-locked zone) OR the tests failed because the serve process
      # died mid-run (a workerd crash → ECONNREFUSED cascade Playwright's own
      # retries can't recover, since the server is gone). A test failure with the
      # stack still ALIVE is genuine red — never retried, so we don't mask it.
      # TOTAL comes from e2e-fanout, NOT e2e-plan: the effective shard count is
      # capacity-dependent, and `--shard=i/N` is only coherent if every host —
      # this repo and every fan-out batch — uses the SAME N.
      - name: Boot e2e stack + run Playwright shard ${{ matrix.shard }}/${{ needs.e2e-fanout.outputs.total }}
        env:
          PLAYWRIGHT_NO_WEB_SERVER: '1'
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.e2e-fanout.outputs.total }}
          # Space-separated spec paths on a change-scoped run; empty on a full
          # run (Playwright then runs every spec). Word-split intentionally.
          E2E_TARGETS: ${{ needs.e2e-plan.outputs.targets }}
          # The e2e base URL stays `localhost` (design-system specs hardcode
          # `domain: localhost` theme cookies, see scripts/e2e-run.sh). On the CI
          # runner Node resolves `localhost` to IPv6 `::1` first, but wrangler dev
          # listens on IPv4 only → Playwright's Node `request` fixture got
          # `connect ECONNREFUSED ::1:<port>`. Force IPv4-first resolution so
          # `localhost` connects to 127.0.0.1 where the worker actually listens,
          # without changing the cookie domain.
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -uo pipefail
          # Backward-compat: PRs branched before this change don't ship
          # scripts/ci-boot-e2e.sh — boot the legacy inline way (no zone probe,
          # no reboot-retry) so their e2e still runs. Remove once every open PR
          # has rebased past this commit.
          if [ ! -f scripts/ci-boot-e2e.sh ]; then
            set -m
            nohup env BUILD=0 RESEED=0 pnpm e2e:serve >e2e-serve.log 2>&1 &
            SERVE_PID=$!
            set +m
            echo "$SERVE_PID" > .wrangler/e2e-serve.pid
            for _ in $(seq 1 60); do
              [ -s .wrangler/e2e-port ] && break
              kill -0 "$SERVE_PID" 2>/dev/null || { echo "::error::e2e:serve exited early"; tail -n 80 e2e-serve.log; exit 1; }
              sleep 1
            done
            PORT="$(cat .wrangler/e2e-port 2>/dev/null || true)"
            [ -z "$PORT" ] && { echo "::error::e2e:serve never reported a port"; tail -n 80 e2e-serve.log; exit 1; }
            deadline=$((SECONDS + 300))
            ready=0
            while (( SECONDS < deadline )); do
              kill -0 "$SERVE_PID" 2>/dev/null || { echo "::error::e2e stack exited before becoming ready"; tail -n 80 e2e-serve.log; exit 1; }
              curl -sf "http://localhost:$PORT/api/health" >/dev/null 2>&1 && { ready=1; break; }
              sleep 1
            done
            [ "$ready" = 1 ] || { echo "::error::Timed out waiting for /api/health"; tail -n 80 e2e-serve.log; exit 1; }
            # shellcheck disable=SC2086  # E2E_TARGETS is an intentional path list
            PLAYWRIGHT_BASE_URL="http://localhost:$PORT" pnpm exec playwright test --reporter=line --shard="$SHARD/$TOTAL" $E2E_TARGETS
            exit $?
          fi
          serve_alive() { local p; p="$(cat .wrangler/e2e-serve.pid 2>/dev/null || true)"; [ -n "$p" ] && kill -0 "$p" 2>/dev/null; }
          teardown_serve() {
            local p; p="$(cat .wrangler/e2e-serve.pid 2>/dev/null || true)"
            [ -n "$p" ] || return 0
            kill -TERM -- -"$p" 2>/dev/null || true; sleep 2; kill -KILL -- -"$p" 2>/dev/null || true
          }
          # One attempt = boot the stack, then run this shard's slice. A boot
          # failure returns the sentinel 70 (an INFRA failure — a crashed/locked
          # zone, e.g. SENTRY_DO SQLITE_BUSY) so it's distinguishable from a
          # Playwright test failure (small exit codes). The helper already tears
          # its own stack down on boot failure.
          attempt() {
            bash scripts/ci-boot-e2e.sh || return 70
            # shellcheck disable=SC2086  # E2E_TARGETS is an intentional path list
            PLAYWRIGHT_BASE_URL="http://localhost:$(cat .wrangler/e2e-port)" \
              pnpm exec playwright test --reporter=line --shard="$SHARD/$TOTAL" $E2E_TARGETS
          }
          attempt
          rc=$?
          [ "$rc" -eq 0 ] && exit 0
          # Reboot+retry ONCE for an infra failure: boot failed (rc=70), OR the
          # tests failed AND the serve process died mid-run (a workerd crash →
          # ECONNREFUSED cascade Playwright's own retries can't recover). A test
          # failure with the stack STILL ALIVE is genuine red — never retried, so
          # we don't mask real failures.
          if [ "$rc" -ne 70 ] && serve_alive; then
            echo "::error::shard $SHARD/$TOTAL failed with the stack still alive — a genuine test failure, not retrying"
            teardown_serve
            exit "$rc"
          fi
          echo "::warning::infra failure on shard $SHARD/$TOTAL (rc=$rc) — rebooting the stack and re-running this shard once"
          teardown_serve
          # Keep the first attempt's boot log for the failure upload.
          mv e2e-serve.log e2e-serve.attempt1.log 2>/dev/null || true
          attempt

      - name: Tear down e2e stack
        if: always()
        run: |
          SERVE_PID="$(cat .wrangler/e2e-serve.pid 2>/dev/null || true)"
          if [ -n "$SERVE_PID" ]; then
            kill -TERM -- -"$SERVE_PID" 2>/dev/null || true
            sleep 2
            kill -KILL -- -"$SERVE_PID" 2>/dev/null || true
          fi

      # A FLAKY test passes on retry, so the shard exits 0 and the `if: failure()`
      # this used to carry threw its evidence away. That is why every flaky in
      # this suite has been undiagnosable after the fact: the noise gate reports
      # `flaky 1`, but the trace, screenshot and `error-context.md` aria snapshot
      # naming the actual cause were dropped on the way out.
      #
      # Playwright still writes `test-results/` for the FAILED first attempt of a
      # retried test, so the evidence exists on disk — detect it and upload it
      # alongside the genuine-failure case.
      - name: Detect retained failure artifacts (covers flaky-passed-on-retry)
        id: pw_artifacts
        if: always()
        run: |
          if [ -d test-results ] && [ -n "$(ls -A test-results 2>/dev/null)" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            echo "::notice::shard ${{ matrix.shard }} retained failure artifacts (flaky first attempt) — uploading"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload Playwright report
        if: ${{ failure() || steps.pw_artifacts.outputs.present == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e-serve*.log
          retention-days: 7
          if-no-files-found: ignore

  # Collapse the sharded e2e matrix into the single `e2e` workflow output the
  # callers consume. Load-bearing for the change-scoped path: when the plan says
  # `skip` (nothing e2e-relevant changed), the e2e matrix is SKIPPED — but a
  # skipped job reports `skipped`, and ci-pr.yml's report flips CI red on
  # anything other than `success`. Mapping skip → success keeps that contract
  # intact. Runs always() so it reports even when the matrix skipped/failed.
  # Wait for the fanned-out batches running in other repos and fold their
  # verdict back in. This job is what makes a cross-repo matrix behave like one
  # matrix: it also provides the cross-org equivalent of `fail-fast: true` by
  # cancelling sibling batches once one genuinely fails, and it FAILS CLOSED on
  # a batch it cannot resolve — a shard whose result is unknown must never be
  # reported as green.
  e2e-collect:
    name: 1 · CI · E2E (collect batches)
    needs: [e2e-plan, e2e-fanout]
    if: ${{ always() && inputs.run_e2e && needs.e2e-fanout.outputs.has_batches == 'true' }}
    runs-on: ubuntu-latest
    # Generous: it is bounded by the slowest remote shard, and the shard jobs
    # themselves cap at 30 min.
    timeout-minutes: 45
    outputs:
      result: ${{ steps.collect.outputs.result }}
      runs: ${{ steps.collect.outputs.runs }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - id: collect
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          FANOUT: ${{ needs.e2e-fanout.outputs.fanout }}
          TIMEOUT_S: '2400'
        run: node .github/scripts/ci-fanout.mjs collect

      # Republished with each batch's resolved run id — this is the version
      # /fix-ci reads to locate remote shard logs.
      - name: Upload fan-out map (resolved)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-fanout-resolved
          path: ci-fanout.json
          retention-days: 7
          if-no-files-found: ignore

  e2e-aggregate:
    name: 1 · CI · E2E (result)
    needs: [e2e-plan, e2e-fanout, e2e, e2e-collect]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      result: ${{ steps.agg.outputs.result }}
    steps:
      - id: agg
        env:
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          PLAN_RUN: ${{ needs.e2e-plan.outputs.run }}
          FANOUT_RESULT: ${{ needs.e2e-fanout.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          HAS_BATCHES: ${{ needs.e2e-fanout.outputs.has_batches }}
          COLLECT_RESULT: ${{ needs.e2e-collect.result }}
          COLLECT_VERDICT: ${{ needs.e2e-collect.outputs.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" = "skipped" ]; then
            # e2e disabled for this caller (run_e2e=false) — mirror the old
            # `jobs.e2e.result` (skipped) so nothing downstream changes.
            RESULT=skipped
          elif [ "$PLAN_RUN" != "true" ]; then
            # Change-scoped plan found nothing e2e-relevant → treat as pass.
            RESULT=success
          elif [ "$FANOUT_RESULT" != "success" ]; then
            # The fan-out step itself failed, so the shard split is unknown and
            # no shard set can be trusted to be complete.
            RESULT=failure
          else
            # Local shards. `skipped` is legitimate here and ONLY here: it means
            # every shard was fanned out to workers, so the local matrix was
            # empty. Any other non-success is a real failure.
            case "$E2E_RESULT" in
              success|skipped) RESULT=success ;;
              *)               RESULT="$E2E_RESULT" ;;
            esac
            # Remote batches, if any. Fail closed: the collect job must have
            # run AND returned success.
            if [ "$HAS_BATCHES" = "true" ]; then
              if [ "$COLLECT_RESULT" != "success" ] || [ "$COLLECT_VERDICT" != "success" ]; then
                RESULT=failure
              fi
            fi
          fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "▶ e2e aggregate: plan=$PLAN_RESULT run=$PLAN_RUN local=$E2E_RESULT batches=$HAS_BATCHES collect=$COLLECT_RESULT/$COLLECT_VERDICT → $RESULT" >&2

  # Precompute the "green-but-noisy" signals ONCE, server-side, into a tiny
  # `ci-noise-report` artifact so /watch-ci and /fix-ci read ONE small file
  # instead of downloading every e2e shard log over the network. It captures the
  # masks a green run hides (see .claude/commands/fix-ci.md): flaky retries,
  # report-only dup-testid / hydration-error annotations, the browser-only
  # i18n-missing / font-preload / http-404 signals the e2e fixtures tag, biome
  # warnings, and vitest stderr — same signals, a fraction of the client's time.
  #
  # SAFE BY CONSTRUCTION: this job only READS this run's own job logs (default
  # GITHUB_TOKEN, actions:read via the workflow's read-all). It publishes:
  #   • a tiny `ci-noise-report` artifact — /watch-ci and /fix-ci read ONE file
  #     instead of downloading every shard log;
  #   • `clean` + `summary` job outputs — ci-pr.yml's `report` job reads these to
  #     gate the labeled auto-merge and to post the PR CI comment.
  # `continue-on-error: true` PLUS `set +e` means it can NEVER red the run or
  # affect the CI status the `report` job posts (that status is computed only
  # from the biome/typecheck/lint/test/e2e outputs above). If it can't run or
  # the artifact is absent (a PR whose CI predates this job), the client falls
  # back to its own per-shard log grep and `report` treats noise as unknown
  # (→ not clean → no auto-merge).
  #
  # NOTE: GitHub runs `run:` steps as `bash -e {0}` (errexit ON). The scan is a
  # pipeline of greps that legitimately exit non-zero on "no match", so we MUST
  # `set +e` — otherwise a zero-match grep aborts the step before the outputs /
  # artifact are written (that was the original failure: run 29478177936).
  noise-report:
    name: 1 · CI · Noise report
    needs: [biome, test-aggregate, e2e-aggregate, e2e-collect]
    # PR CI only (run_e2e=true) — the deploy gate (run_e2e=false) has no
    # /watch-ci consumer, so keep this off the deploy critical path entirely.
    if: ${{ always() && inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    outputs:
      clean: ${{ steps.scan.outputs.clean }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - name: Scan this run's logs for noise
        id: scan
        env:
          # PAT_TOKEN rather than the default GITHUB_TOKEN: with e2e fanned out,
          # some shard logs live in OTHER repos, which GITHUB_TOKEN cannot read.
          # Reading a fanned-out run's logs with the default token silently
          # yielded zero e2e lines — i.e. "flaky 0", clean, auto-merge — which
          # is the one failure mode this gate must not have.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          BATCH_RUNS: ${{ needs.e2e-collect.outputs.runs }}
        run: |
          set +e -uo pipefail   # errexit OFF — zero-match greps below exit non-zero by design
          tmp="$(mktemp -d)"
          : > "$tmp/e2e.log"; : > "$tmp/biome.log"; : > "$tmp/test.log"
          # Every run whose job logs belong to THIS logical CI run: this
          # coordinator run, plus one per fanned-out e2e batch.
          : > "$tmp/runs.tsv"
          printf '%s\t%s\n' "$GITHUB_REPOSITORY" "$RUN_ID" >> "$tmp/runs.tsv"
          if [ -n "${BATCH_RUNS:-}" ] && [ "$BATCH_RUNS" != "[]" ]; then
            printf '%s' "$BATCH_RUNS" \
              | jq -r '.[]? | [.repo, (.run_id|tostring)] | @tsv' 2>/dev/null >> "$tmp/runs.tsv"
          fi
          echo "▶ noise: scanning $(wc -l < "$tmp/runs.tsv") run(s)"
          # Map every job in each run to (id, name); pull each relevant job's log
          # once. Job names carry the reusable-workflow prefix ("checks / 1 · CI
          # · E2E (shard 3)") on the coordinator and a bare "E2E (shard 3)" in a
          # batch repo — the substring match finds both.
          while IFS="$(printf '\t')" read -r repo run; do
            [ -n "$repo" ] && [ -n "$run" ] || continue
            gh api "repos/${repo}/actions/runs/${run}/jobs" --paginate \
              --jq '.jobs[]? | [(.id|tostring), .name] | @tsv' 2>/dev/null \
              | while IFS="$(printf '\t')" read -r id name; do
                  [ -n "$id" ] || continue
                  case "$name" in
                    *"E2E (shard"*)  dest="$tmp/e2e.log" ;;
                    *"Biome"*)       dest="$tmp/biome.log" ;;
                    *"Unit tests"*)  dest="$tmp/test.log" ;;
                    *)               continue ;;
                  esac
                  gh api "repos/${repo}/actions/jobs/${id}/logs" 2>/dev/null \
                    | sed -E 's/\x1b\[[0-9;]*m//g' >> "$dest"
                done
          done < "$tmp/runs.tsv"
          # grep exits non-zero on no-match; with errexit OFF that's fine — awk
          # always prints a number, and grep -c always prints its count.
          num() { grep -oiE "$1" "$2" 2>/dev/null | grep -oE '[0-9]+' | awk '{s+=$1} END{print s+0}'; }
          cnt() { grep -acE "$1" "$2" 2>/dev/null | head -1; }
          flaky=$(num '([0-9]+) flaky' "$tmp/e2e.log"); flaky=${flaky:-0}
          dup=$(cnt '\[dup-testid\]' "$tmp/e2e.log"); dup=${dup:-0}
          hyd=$(cnt '\[hydration-error\]' "$tmp/e2e.log"); hyd=${hyd:-0}
          # Browser-only signals the e2e fixtures tag per test (apps/shell/e2e/fixtures.ts):
          # missing i18n keys, unused next/font preloads, 4xx/404 resource loads.
          i18n=$(cnt '\[i18n-missing\]' "$tmp/e2e.log"); i18n=${i18n:-0}
          font=$(cnt '\[font-preload\]' "$tmp/e2e.log"); font=${font:-0}
          http404=$(cnt '\[http-404\]' "$tmp/e2e.log"); http404=${http404:-0}
          biomew=$(num 'Found ([0-9]+) warning' "$tmp/biome.log"); biomew=${biomew:-0}
          vitest=$(cnt 'stderr \||not wrapped in act' "$tmp/test.log"); vitest=${vitest:-0}
          total=$(( flaky + dup + hyd + i18n + font + http404 + biomew + vitest ))
          clean=true; [ "$total" -gt 0 ] && clean=false
          summary=$(printf 'flaky %s · dup %s · hyd %s · i18n %s · font %s · 404 %s · biome %s · vitest %s' "$flaky" "$dup" "$hyd" "$i18n" "$font" "$http404" "$biomew" "$vitest")
          {
            echo "clean=$clean"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"
          mkdir -p ci-noise
          printf '{"flaky":%s,"dup_testid":%s,"hydration":%s,"i18n_missing":%s,"font_preload":%s,"http_4xx":%s,"biome_warnings":%s,"vitest_stderr":%s,"clean":%s}\n' \
            "$flaky" "$dup" "$hyd" "$i18n" "$font" "$http404" "$biomew" "$vitest" "$clean" | tee ci-noise/ci-noise-report.json
          echo "▶ noise: $summary → clean=$clean"
          exit 0

      - name: Upload noise report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-noise-report
          path: ci-noise/ci-noise-report.json
          retention-days: 7
          if-no-files-found: ignore
