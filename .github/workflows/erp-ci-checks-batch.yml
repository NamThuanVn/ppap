name: ERP · CI · Checks batch (fan-out worker)

# One BATCH of another repo's non-e2e checks — repo gates, ESLint, typecheck,
# Vitest — as shard UNITS (`typecheck:2/4`, `gates:1/2`, …).
#
# The same shape as erp-ci-e2e-batch.yml, for the same reason: GitHub Free
# allows ~20 concurrent jobs per org, and these checks used to hold 8 of the
# coordinator's. erp-ci-checks.yml's `checks` job plans the units
# (scripts/ci/checks/plan.mjs), splits them across idle fleet repos and
# dispatches a batch to each (scripts/ci/fanout.mjs, SUITE=checks); this
# workflow runs one. The dispatching repo stays the COORDINATOR — it owns the
# commit Status and every PR write. A batch runs its units and concludes; the
# coordinator reads each JOB's conclusion back by name and folds it into that
# suite's verdict, failing a suite closed on any unit it has no job for.
#
# Unlike an e2e batch it needs no artifact from the coordinator: every unit
# checks out and installs from source, so a batch can start the moment it is
# dispatched — in parallel with the coordinator's zone builds, not after them.
#
# This file MUST keep its `ci-` prefix: sync-workflows-to-ppap.yml mirrors only
# `erp-ci-*.yml` to the CI fleet, and a fleet repo without this workflow is
# skipped by the fan-out's dispatchability guard.

run-name: "ERP · Checks · ${{ github.event.client_payload.ctx.pr_number && format('PR #{0}', github.event.client_payload.ctx.pr_number) || 'manual' }} · batch ${{ github.event.client_payload.batch }}/${{ github.event.client_payload.batch_count }} · ${{ github.event.client_payload.correlation }}"

on:
  repository_dispatch:
    types: [checks-batch]

permissions: read-all

# Keyed on the correlation token (coordinator run id + attempt) plus the batch
# index, so a re-dispatched attempt supersedes its predecessor while leaving
# other PRs' batches — and this PR's OTHER batches — alone.
concurrency:
  group: checks-batch-${{ github.event.client_payload.correlation }}-${{ github.event.client_payload.batch }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Cheap gate in front of the matrix, same two jobs as the e2e batch's plan:
  #   1. Turn `client_payload.units` into the job matrix. Names come from
  #      scripts/ci/checks/plan.mjs DISPLAY — the noise scan, job-index,
  #      noise-police and progress all route a job's log by those names.
  #   2. STALE CHECK — a cancelled coordinator does not cancel across repos, and
  #      an orphan batch holds JOB SLOTS in this org. Fails OPEN: an unreadable
  #      head still runs, and a skipped matrix fails its units closed at the
  #      coordinator anyway.
  plan:
    name: Checks batch ${{ github.event.client_payload.batch }} · plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ github.event.client_payload.ctx.checkout_ref }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          UNITS: ${{ github.event.client_payload.units }}
          PR_NUMBER: ${{ github.event.client_payload.ctx.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.ctx.head_sha }}
        run: |
          set -euo pipefail
          MATRIX="$(node scripts/ci/checks/plan.mjs matrix "$UNITS")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          RUN=true
          if [ -n "${PR_NUMBER:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            CURRENT=$(gh api "repos/${PRIVATE_REPO}/pulls/${PR_NUMBER}" --jq '.head.sha // ""' 2>/dev/null || true)
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$HEAD_SHA" ]; then
              echo "::notice::stale batch — coordinator tested $HEAD_SHA but PR #$PR_NUMBER is now $CURRENT; skipping."
              RUN=false
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "▶ checks batch units=[$UNITS] run=$RUN" >&2

  check:
    name: ${{ matrix.unit.name }}
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every unit runs to completion: one red suite must not hide another,
      # the same reason the old Repo-gates job guarded each step.
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
