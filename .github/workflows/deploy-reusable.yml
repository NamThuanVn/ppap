name: Deploy · Reusable

# Reusable workflow shared by deploy-staging.yml and deploy-production.yml.
# Those wrappers handle the trigger surface (event types, concurrency,
# environment-specific run-name) and pass per-env inputs in here. This file
# owns the actual deploy graph: terraform apply → monitor → leaves matrix →
# tier-1.5 matrix → gateway → dashboard → status pingback. See
# .claude/ppap.md in the private repo for the full architecture.

on:
  workflow_call:
    inputs:
      environment:
        description: 'staging | production — drives wrangler env, NODE_ENV, Vectorize index name.'
        type: string
        required: true
      tf_workspace:
        description: 'HCP Terraform workspace name (namthuanvn-staging | namthuanvn-production).'
        type: string
        required: true
      domain:
        description: 'Public host (namthuan.org | namthuan.co). Powers NEXT_PUBLIC_DASHBOARD_URL + environment_url on the pingback.'
        type: string
        required: true
      api_url:
        description: 'Public API URL passed as NEXT_PUBLIC_API_URL on the dashboard build.'
        type: string
        required: true
      checkout_ref:
        description: 'Private-repo ref to deploy (sha for staging, refs/tags/<tag> for production).'
        type: string
        required: true
      deploy_script_suffix:
        description: 'Suffix applied to `deploy` pnpm scripts for gateway + dashboard (":staging" | ":production").'
        type: string
        required: true
      release_tag:
        description: 'Release tag (production only). Used in pingback descriptions.'
        type: string
        required: false
        default: ''
      deployment_id:
        description: 'Pre-created GitHub Deployment id in erp-namthuan; pinged at the end. Empty on manual workflow_dispatch.'
        type: string
        required: false
        default: ''
      commit_sha:
        description: 'Commit sha to attach a commit status to in erp-namthuan. Empty on manual workflow_dispatch.'
        type: string
        required: false
        default: ''
      status_context:
        description: 'Commit-status context name (deploy-staging | deploy-production).'
        type: string
        required: true
      triggered_by:
        description: 'Actor handle that initiated the deploy (forwarded from the dispatcher). Used in the Telegram failure alert.'
        type: string
        required: false
        default: ''
      run_title:
        description: 'Human title for the deploy (merge-commit subject for staging, release title for production). Used in the Telegram failure alert.'
        type: string
        required: false
        default: ''
    secrets:
      TF_API_TOKEN:
        required: true
      PAT_TOKEN:
        required: true
      # Telegram failure alerts — all optional so a partially-configured or
      # manual run degrades to "skip notify" instead of failing the report job.
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BUILD_THREAD_ID:
        required: false

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 0. CI gate. Runs biome / typecheck / lint / vitest in parallel against
  #    the deploy ref BEFORE any infra touches Cloudflare or HCP. Lives in
  #    ppap (not the private repo) so deploys cost zero billed minutes —
  #    same reusable workflow PR-CI uses, just with a different ref.
  #
  #    `release.yml` is workflow_dispatch only and `deploy-staging-dispatch`
  #    can be re-fired manually; without this gate, a broken `main` (or a
  #    bad merge commit) would still reach terraform-apply. Branch
  #    protection requires the PR-CI `CI` check green on the source PR, but
  #    this gate re-validates on the actual deploy ref to catch admin
  #    bypasses + post-merge drift.
  # ───────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: 1 · CI gate
    uses: ./.github/workflows/ci-checks.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      # Require the full Playwright e2e suite before any staging/production
      # deploy — not just biome/typecheck/lint/vitest. PR CI runs e2e on the
      # source PR, but this re-validates on the actual deploy ref (sha for
      # staging, refs/tags/<tag> for production) to catch admin-bypassed
      # merges + post-merge drift before infra touches Cloudflare. A failing
      # shard fails ci-gate, which blocks terraform-apply (needs: [ci-gate]).
      run_e2e: true
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Provision Cloudflare resources (KV, D1, Queues, Pages, Vectorize
  #    placeholders). Must run before worker deploy — workers bind to these
  #    IDs.
  # ───────────────────────────────────────────────────────────────────────────
  terraform-apply:
    name: 2 · Infra · Terraform apply
    needs: [ci-gate]
    runs-on: ubuntu-latest
    concurrency:
      group: tf-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ inputs.tf_workspace }}

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # `cloudflare_workers_secret` can only attach to a Worker script that
      # already exists on the account, but new workers deploy via wrangler
      # AFTER terraform in this graph — so the first deploy of a brand-new
      # secret-bearing service dies with Cloudflare error 10007 ("This Worker
      # does not exist on your account"; first hit: exms, PR #261). Upload a
      # trivial placeholder for any missing script_name referenced by the
      # terraform modules; the real wrangler deploy overwrites it later in
      # this same run. Idempotent — a no-op GET per worker once they exist.
      # Credentials come from the PREVIOUS state's outputs (readable after
      # init, before apply); on a completely fresh workspace there are none,
      # so the step skips and the documented two-pass HCP bootstrap applies
      # (see .claude/infrastructure.md § Production cold-start bootstrap).
      - name: Bootstrap missing Workers (secrets cold-start)
        working-directory: terraform
        run: |
          terraform output -json > /tmp/pre-outputs.json 2>/dev/null || echo '{}' > /tmp/pre-outputs.json
          ACC="$(jq -r '.cloudflare_account_id.value // empty' /tmp/pre-outputs.json)"
          TOKEN="$(jq -r '.cloudflare_api_token.value // empty' /tmp/pre-outputs.json)"
          rm -f /tmp/pre-outputs.json
          if [[ -z "$ACC" || -z "$TOKEN" ]]; then
            echo "no prior terraform outputs (fresh workspace) — skipping bootstrap"
            exit 0
          fi
          echo "::add-mask::$ACC"
          echo "::add-mask::$TOKEN"
          printf 'export default { fetch() { return new Response("bootstrapping", { status: 503 }); } };\n' > /tmp/placeholder.mjs
          for name in $(grep -rho 'script_name *= *"[^"]*"' apis/ | sed 's/.*"\(.*\)"/\1/' | sort -u); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/services/$name")"
            if [[ "$code" == "404" ]]; then
              echo "worker '$name' missing — uploading placeholder so its secret can attach"
              curl -sf -X PUT \
                -H "Authorization: Bearer $TOKEN" \
                -F 'metadata={"main_module":"placeholder.mjs","compatibility_date":"2024-11-01"};type=application/json' \
                -F 'placeholder.mjs=@/tmp/placeholder.mjs;type=application/javascript+module' \
                "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$name" > /dev/null
            else
              echo "worker '$name' exists (HTTP $code)"
            fi
          done

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -no-color

      - name: Export Terraform outputs
        working-directory: terraform
        run: terraform output -json > tf-outputs.json

      - uses: actions/upload-artifact@v7
        with:
          name: tf-outputs
          path: terraform/tf-outputs.json
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy service-monitor (Tail Worker) FIRST. Every other worker
  #    declares `tail_consumers: [{ service: "service-monitor" }]` —
  #    Cloudflare rejects a deploy whose tail consumer doesn't exist on the
  #    account, so this job must finish before the leaf matrix or gateway.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker-monitor:
    name: 3 · Worker · monitor (tail logs)
    needs: terraform-apply
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      - name: Resolve wrangler bindings
        run: .github/scripts/resolve-wrangler-bindings.sh monitor ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      - name: Deploy Worker
        run: pnpm --filter @namthuanvn/monitor run deploy -- --var SENTRY_RELEASE:${{ steps.sha.outputs.value }}

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Leaves in parallel (Cloudflare service-binding tier 1).
  # ───────────────────────────────────────────────────────────────────────────
  deploy-workers-leaves:
    name: 4 · Worker · ${{ matrix.service }} (leaf API)
    needs: [terraform-apply, deploy-worker-monitor]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hris, expense, utilities, exms, oms, notifications, auth, assistant, files]

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      - name: Resolve wrangler bindings
        run: .github/scripts/resolve-wrangler-bindings.sh ${{ matrix.service }} ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      # Vectorize index — Cloudflare TF provider v4 doesn't support
      # `cloudflare_vectorize_index` (added in v5). Idempotent: first deploy
      # creates the index + metadata indexes, subsequent deploys are no-ops.
      # See `.claude/infrastructure.md` § Vectorize bootstrap.
      - name: Bootstrap Vectorize index (idempotent)
        if: matrix.service == 'assistant'
        run: |
          set -euo pipefail
          INDEX="assistant-vectors"
          if npx wrangler vectorize list 2>/dev/null | grep -qE "(^|[[:space:]])${INDEX}([[:space:]]|\$)"; then
            echo "✓ Vectorize index '${INDEX}' already exists — skipping create."
          else
            echo "Creating Vectorize index '${INDEX}'..."
            npx wrangler vectorize create "${INDEX}" --dimensions=1024 --metric=cosine
            npx wrangler vectorize create-metadata-index "${INDEX}" --property-name=requiredPermission --type=string
            npx wrangler vectorize create-metadata-index "${INDEX}" --property-name=entityType --type=string
            echo "✓ Vectorize index '${INDEX}' created with metadata indexes."
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations
        run: pnpm --filter @namthuanvn/${{ matrix.service }} --if-present db:migrate:remote

      - name: Deploy Worker
        run: pnpm --filter @namthuanvn/${{ matrix.service }} run deploy -- --var SENTRY_RELEASE:${{ steps.sha.outputs.value }}

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Tier 1.5 — workers with sibling `services` bindings (orchestrator,
  #    aggregator). Must run AFTER leaves so the bindings target existing
  #    workers (Cloudflare error 10143).
  # ───────────────────────────────────────────────────────────────────────────
  deploy-workers-tier-1-5:
    name: 5 · Worker · ${{ matrix.service }} (composer)
    needs: deploy-workers-leaves
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [orchestrator, aggregator]

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      - name: Resolve wrangler bindings
        run: .github/scripts/resolve-wrangler-bindings.sh ${{ matrix.service }} ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      - name: Apply D1 migrations
        run: pnpm --filter @namthuanvn/${{ matrix.service }} --if-present db:migrate:remote

      - name: Deploy Worker
        run: pnpm --filter @namthuanvn/${{ matrix.service }} run deploy -- --var SENTRY_RELEASE:${{ steps.sha.outputs.value }}

  # ───────────────────────────────────────────────────────────────────────────
  # 5. service-gateway — service-binds to every other worker.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-worker-gateway:
    name: 6 · Worker · gateway (router)
    needs: deploy-workers-tier-1-5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      - name: Resolve wrangler bindings
        run: .github/scripts/resolve-wrangler-bindings.sh gateway ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      - name: Deploy Worker
        run: pnpm --filter @namthuanvn/gateway run deploy${{ inputs.deploy_script_suffix }} -- --var SENTRY_RELEASE:${{ steps.sha.outputs.value }}

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Next.js dashboard zones via OpenNext → Cloudflare Workers (Multi-Zone).
  #    The shell + each carved service zone (expense, exms, oms, hris, utilities) is its
  #    own standalone OpenNext worker; the dispatcher (next job) fronts the apex
  #    and routes to them over service bindings. All zones build with the same
  #    NEXT_PUBLIC_* env (the client always calls same-origin /api/*) and each
  #    service-binds to service-gateway for SSR prefetch, so the matrix deploys
  #    AFTER the gateway — which transitively waits for every leaf. Adding a
  #    future zone = one matrix entry here + one binding in apps/dispatcher.
  # ───────────────────────────────────────────────────────────────────────────
  deploy-zones:
    name: 7 · App · ${{ matrix.zone.name }} (Next.js zone)
    needs: [terraform-apply, deploy-worker-gateway]
    runs-on: ubuntu-latest
    strategy:
      # One zone failing must not cancel the others — the dispatcher (next job)
      # gates on the whole matrix, so a partial failure already blocks the apex.
      fail-fast: false
      matrix:
        zone:
          - { name: shell, pkg: '@namthuanvn/shell' }
          - { name: expense, pkg: '@namthuanvn/zone-expense' }
          - { name: exms, pkg: '@namthuanvn/zone-exms' }
          - { name: oms, pkg: '@namthuanvn/zone-oms' }
          - { name: hris, pkg: '@namthuanvn/zone-hris' }
          - { name: utilities, pkg: '@namthuanvn/zone-utilities' }

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      # Every zone worker (apps/<zone>/wrangler.jsonc) carries no Terraform-owned
      # resources — only an ASSETS binding + the GATEWAY_SERVICE service binding —
      # so this just loads the Cloudflare credentials (the `dashboard` case is a
      # credentials-only no-op on the wrangler config).
      - name: Load Cloudflare credentials
        run: .github/scripts/resolve-wrangler-bindings.sh dashboard ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      # VAPID public key (Web Push) — lives in HCP, surfaced via tf-outputs.
      - name: Load VAPID public key from tf-outputs
        id: vapid
        run: |
          jq -er .vapid_public_key.value /tmp/tf-outputs.json | xargs -I {} echo "public_key={}" >> "$GITHUB_OUTPUT"

      # Sentry config — all four optional. Empty values skip the echo so the
      # SDK initializes with `enabled: false`. See `docs/engineering/sentry.md`.
      # Every zone shares the one dashboard Sentry project (they are one product).
      - name: Load Sentry config from tf-outputs
        id: sentry
        run: |
          jq -r .sentry_dsn_dashboard.value     /tmp/tf-outputs.json | xargs -I {} echo "dsn={}"          >> "$GITHUB_OUTPUT"
          jq -r .sentry_auth_token.value        /tmp/tf-outputs.json | xargs -I {} echo "auth_token={}"  >> "$GITHUB_OUTPUT"
          jq -r .sentry_org.value               /tmp/tf-outputs.json | xargs -I {} echo "org={}"         >> "$GITHUB_OUTPUT"
          jq -r .sentry_project_dashboard.value /tmp/tf-outputs.json | xargs -I {} echo "project={}"     >> "$GITHUB_OUTPUT"

      - name: Build (OpenNext — Cloudflare Workers)
        run: pnpm --filter ${{ matrix.zone.pkg }} run build:pages
        env:
          NEXT_PUBLIC_APP_ENV: ${{ inputs.environment }}
          NEXT_PUBLIC_APP_RELEASE: ${{ steps.sha.outputs.value }}
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}
          NEXT_PUBLIC_DASHBOARD_URL: https://${{ inputs.domain }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ steps.sentry.outputs.dsn }}
          SENTRY_AUTH_TOKEN: ${{ steps.sentry.outputs.auth_token }}
          SENTRY_ORG: ${{ steps.sentry.outputs.org }}
          SENTRY_PROJECT: ${{ steps.sentry.outputs.project }}

      - name: Deploy Worker
        # Pass the dashboard Sentry DSN as a runtime wrangler var so the zone's
        # `@sentry/cloudflare` wrap (apps/<zone>/worker.ts) can report server-side
        # errors. Same value baked into the client build above as
        # NEXT_PUBLIC_SENTRY_DSN; empty in envs without a DSN → Sentry disabled.
        run: pnpm --filter ${{ matrix.zone.pkg }} run deploy${{ inputs.deploy_script_suffix }} -- --var "SENTRY_DSN:${{ steps.sentry.outputs.dsn }}"

  # ───────────────────────────────────────────────────────────────────────────
  # 7. Apex dispatcher (apps/dispatcher) — a tiny plain Worker that owns the
  #    public custom_domain and routes `/api/*` → gateway and every page/asset
  #    prefix → the owning zone over a service binding. It deploys LAST: its
  #    `services` bindings target the gateway + all five zone workers, which must
  #    already exist (Cloudflare error 10143 otherwise).
  # ───────────────────────────────────────────────────────────────────────────
  deploy-dispatch:
    name: 8 · App · dispatcher (apex ingress)
    needs: [terraform-apply, deploy-worker-gateway, deploy-zones]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      - name: Load Cloudflare credentials
        run: .github/scripts/resolve-wrangler-bindings.sh dashboard ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json

      - name: Load Sentry DSN from tf-outputs
        id: sentry
        run: |
          jq -r .sentry_dsn_dashboard.value /tmp/tf-outputs.json | xargs -I {} echo "dsn={}" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        # No Next.js build — the dispatcher is a plain Worker. SENTRY_DSN is its
        # only runtime var (its worker wraps `withSentry` with a dispatcher
        # service tag); empty in envs without a DSN → Sentry disabled.
        run: pnpm --filter @namthuanvn/dispatcher run deploy${{ inputs.deploy_script_suffix }} -- --var "SENTRY_DSN:${{ steps.sentry.outputs.dsn }}" --var "SENTRY_RELEASE:${{ steps.sha.outputs.value }}"

  # ───────────────────────────────────────────────────────────────────────────
  # 7. Pingback. The dispatcher in the private repo created a *pending*
  #    GitHub Deployment; we close it out here with success/failure so
  #    erp-namthuan's Environments tab + commit status reflect the real
  #    outcome. Both steps no-op when the run was a manual workflow_dispatch
  #    (no deployment_id / sha in the event payload).
  # ───────────────────────────────────────────────────────────────────────────
  report-deployment:
    name: 9 · Report · deployment status
    # ci-gate is in `needs:` so a CI failure (which skips terraform-apply +
    # everything downstream) still surfaces as a `failure` state to the
    # Deployment-status pingback. Outcome is strict all-success: a mid-graph
    # failure (terraform-apply, monitor, leaves, tier-1.5) leaves gateway +
    # zones + dispatch as `skipped` — not `failure` — so checking only for
    # `failure`/`cancelled` would incorrectly report success. `deploy-dispatch`
    # is the terminal job (it `needs: deploy-zones`), so its success implies the
    # whole zone matrix succeeded too.
    #
    # `!cancelled()` (not `always()`): a run cancelled by concurrency
    # (superseded staging deploy — expected, not an error) skips reporting
    # entirely — no Telegram alert, and its pending GitHub Deployment is
    # auto-marked inactive when the superseding deploy posts `success`.
    needs: [ci-gate, deploy-worker-gateway, deploy-zones, deploy-dispatch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute outcome
        id: outcome
        run: |
          if [ "${{ needs.ci-gate.result }}" = "success" ] && \
             [ "${{ needs.deploy-worker-gateway.result }}" = "success" ] && \
             [ "${{ needs.deploy-zones.result }}" = "success" ] && \
             [ "${{ needs.deploy-dispatch.result }}" = "success" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Deployment status on private repo
        if: inputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STATE: ${{ steps.outcome.outputs.state }}
          TAG_SUFFIX: ${{ inputs.release_tag && format(' ({0})', inputs.release_tag) || '' }}
        run: |
          gh api repos/${{ env.PRIVATE_REPO }}/deployments/${{ inputs.deployment_id }}/statuses \
            -f state="$STATE" \
            -f environment_url="https://${{ inputs.domain }}" \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="ppap run #${{ github.run_id }}${TAG_SUFFIX}"

      - name: Ping commit status on private repo
        if: inputs.commit_sha != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          STATE: ${{ steps.outcome.outputs.state }}
          TAG_SUFFIX: ${{ inputs.release_tag && format(' ({0})', inputs.release_tag) || '' }}
        run: |
          gh api repos/${{ env.PRIVATE_REPO }}/statuses/${{ inputs.commit_sha }} \
            -f state="$STATE" \
            -f context=${{ inputs.status_context }} \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="ppap deploy $STATE${TAG_SUFFIX}"

      - name: Summary
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Outcome: ${{ steps.outcome.outputs.state }}"
          echo "Tag: ${{ inputs.release_tag }}"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "URL: https://${{ inputs.domain }}"

      # Failure-only Telegram alert to the build topic of the team supergroup
      # (same bot as the runtime error alerts; secrets live in this repo's
      # Actions secrets). Last step + non-fatal so a Telegram outage can never
      # disturb the Deployment/commit-status pingbacks above.
      - name: Notify Telegram on failure
        if: steps.outcome.outputs.state == 'failure'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          RUN_TITLE: ${{ inputs.run_title }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          R_CI: ${{ needs.ci-gate.result }}
          R_GATEWAY: ${{ needs.deploy-worker-gateway.result }}
          R_ZONES: ${{ needs.deploy-zones.result }}
          R_DISPATCH: ${{ needs.deploy-dispatch.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Telegram not configured (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID empty) — skipping notify."
            exit 0
          fi
          TAG_SUFFIX=""
          if [ -n "${RELEASE_TAG:-}" ]; then TAG_SUFFIX=" (${RELEASE_TAG})"; fi
          ENV_UPPER=$(printf '%s' "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          # Commit subjects are user-controlled text inside parse_mode=HTML — escape.
          SAFE_TITLE=$(printf '%s' "${RUN_TITLE:-}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          # Context line: actor · commit. Both optional (empty on a manual
          # workflow_dispatch) so the line collapses gracefully.
          META=""
          if [ -n "${TRIGGERED_BY:-}" ]; then META="by @${TRIGGERED_BY}"; fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            META="${META:+$META · }commit <a href=\"https://github.com/${{ env.PRIVATE_REPO }}/commit/${COMMIT_SHA}\">${COMMIT_SHA:0:7}</a>"
          fi
          TEXT="🚨 <b>Deploy failed</b> — <b>${ENV_UPPER}</b>${TAG_SUFFIX}"
          if [ -n "$SAFE_TITLE" ]; then TEXT="${TEXT}: ${SAFE_TITLE}"; fi
          if [ -n "$META" ]; then TEXT="${TEXT}"$'\n'"${META}"; fi
          TEXT="${TEXT}"$'\n'"Ref: <code>${CHECKOUT_REF}</code>"
          TEXT="${TEXT}"$'\n'"Jobs: ci-gate ${R_CI} · gateway ${R_GATEWAY} · zones ${R_ZONES} · dispatch ${R_DISPATCH}"
          TEXT="${TEXT}"$'\n'"<a href=\"${RUN_URL}\">View run</a>"
          THREAD_ARGS=()
          if [ -n "${THREAD_ID:-}" ]; then THREAD_ARGS=(-d "message_thread_id=${THREAD_ID}"); fi
          if curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true; then
            echo "✓ Telegram failure alert sent."
          else
            echo "::warning::Telegram notify failed (deploy failure alert not delivered)."
          fi
