name: Deploy · Reusable

# Reusable workflow shared by deploy-staging.yml and deploy-production.yml.
# Those wrappers handle the trigger surface (event types, concurrency,
# environment-specific run-name) and pass per-env inputs in here. This file
# owns the actual deploy graph: read the current Terraform outputs → build
# everything in parallel (worker bundles + zone OpenNext outputs) → one ordered
# deploy job that applies Terraform and then uploads the prebuilt artifacts
# (monitor → leaves → tier-1.5 → gateway → zones → dispatcher) → status
# pingback. See .claude/ppap.md in the private repo for the full architecture.
#
# Why build/deploy are split: builds have no inter-worker dependencies — only
# DEPLOYS must be ordered (a worker's service/tail bindings require the target
# to already exist on the account). So all builds fan out in parallel matrices
# up front and ship their outputs as artifacts; the deploy job then just
# uploads them in dependency order, skipping the per-tier bundle + the repeated
# checkout/install that the old build-and-deploy-per-tier graph paid.
#
# Why `terraform apply` lives INSIDE the deploy job: it used to be its own job
# ahead of the build matrices, which left Cloudflare provisioned 5–7 minutes
# (the zone builds) before a single worker was uploaded — new/changed infra
# (queues, secrets, D1) sat live against the OLD deployed code for that whole
# window. Applying as the first step of the ordered deploy shrinks that gap to
# seconds. The builds only need binding IDs to satisfy wrangler's config parse
# (the emitted JS bundle is binding-ID-agnostic — the deploy job re-resolves
# the config it actually uploads), so they read the PREVIOUS state's outputs
# from the cheap read-only `tf-outputs` job instead.

on:
  workflow_call:
    inputs:
      environment:
        description: 'staging | production — drives wrangler env, NODE_ENV, Vectorize index name.'
        type: string
        required: true
      tf_workspace:
        description: 'HCP Terraform workspace name (namthuanvn-staging | namthuanvn-production).'
        type: string
        required: true
      domain:
        description: 'Public host (namthuan.org | namthuan.co). Powers NEXT_PUBLIC_DASHBOARD_URL + environment_url on the pingback.'
        type: string
        required: true
      api_url:
        description: 'Public API URL passed as NEXT_PUBLIC_API_URL on the dashboard build.'
        type: string
        required: true
      checkout_ref:
        description: 'Private-repo ref to deploy (sha for staging, refs/tags/<tag> for production).'
        type: string
        required: true
      deploy_script_suffix:
        description: 'Suffix applied to `deploy` pnpm scripts for gateway + dashboard (":staging" | ":production").'
        type: string
        required: true
      release_tag:
        description: 'Release tag (production only). Used in pingback descriptions.'
        type: string
        required: false
        default: ''
      deployment_id:
        description: 'Pre-created GitHub Deployment id in erp-namthuan; pinged at the end. Empty on manual workflow_dispatch.'
        type: string
        required: false
        default: ''
      commit_sha:
        description: 'Commit sha to attach a commit status to in erp-namthuan. Empty on manual workflow_dispatch.'
        type: string
        required: false
        default: ''
      status_context:
        description: 'Commit-status context name (deploy-staging | deploy-production).'
        type: string
        required: true
      triggered_by:
        description: 'Actor handle that initiated the deploy (forwarded from the dispatcher). Used in the Telegram failure alert.'
        type: string
        required: false
        default: ''
      run_title:
        description: 'Human title for the deploy (merge-commit subject for staging, release title for production). Used in the Telegram failure alert.'
        type: string
        required: false
        default: ''
      run_e2e_gate:
        description: 'Whether the pre-deploy CI gate runs the full Playwright e2e suite. Staging passes false (the merged PR already ran e2e on refs/pull/N/merge = main + PR); production keeps the default true.'
        type: boolean
        required: false
        default: true
      run_ci_gate:
        description: 'Whether to run the pre-deploy CI gate (biome/typecheck/lint/vitest[/e2e]) at all. Staging passes false — the source PR already ran the full CI on refs/pull/N/merge before merge, so re-checking the same code on the auto-deploy is redundant; staging goes straight to build/deploy. Production keeps the default true (re-validates on the release tag).'
        type: boolean
        required: false
        default: true
      deploy_only_changed:
        description: 'Build & deploy only the workers/zones that changed between base_sha and checkout_ref. Staging passes true; production leaves the default false (full deploy for a deterministic release baseline). A cross-cutting/shared change or a missing base_sha falls back to a full deploy regardless — see .github/scripts/compute-deploy-targets.sh.'
        type: boolean
        required: false
        default: false
      base_sha:
        description: 'Previous main tip (github.event.before) to diff against when deploy_only_changed is true. Empty (manual dispatch) → full deploy.'
        type: string
        required: false
        default: ''
    secrets:
      TF_API_TOKEN:
        required: true
      # The multi-account PAT pool — the ONLY token source. Required: the
      # single-PAT fallback was retired once the pool was live in all 8 stores,
      # because a fallback meant a mis-set pool silently reverted the whole
      # system to one account's quota and looked healthy doing it.
      PAT_TOKEN_POOL:
        required: true
      # Telegram failure alerts — all optional so a partially-configured or
      # manual run degrades to "skip notify" instead of failing the report job.
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_BUILD_THREAD_ID:
        required: false

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 0. Plan the deploy scope. Staging passes deploy_only_changed=true + base_sha
  #    (previous main tip); this job diffs base_sha..checkout_ref and emits the
  #    changed subset of workers + zones. Production (deploy_only_changed=false),
  #    a cross-cutting/shared-package change, or a missing/unreachable base_sha
  #    all fall back to the FULL canonical lists — so the build matrices + deploy
  #    tiers behave exactly as before. Pure git + bash (no install); runs in
  #    parallel with the CI gate. See .github/scripts/compute-deploy-targets.sh.
  #
  #    When the diff selects nothing at all (a tooling / docs / test-only merge)
  #    it emits nothing_to_deploy=true and the rest of the graph short-circuits:
  #    tf-outputs, the build matrices and the deploy job (which owns the terraform
  #    apply) are all skipped and report-deployment pings SUCCESS, because staging
  #    already matches this commit. Most such merges never reach here — main-push-dispatch.yml
  #    only dispatches on an allowlist of deployable paths — but a change the
  #    filter cannot resolve (e.g. tests under apis/**) lands here.
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: 0 · Plan · changed workers + zones
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
      zones: ${{ steps.plan.outputs.zones }}
      workers_list: ${{ steps.plan.outputs.workers_list }}
      zones_list: ${{ steps.plan.outputs.zones_list }}
      deploy_dispatcher: ${{ steps.plan.outputs.deploy_dispatcher }}
      deploy_all: ${{ steps.plan.outputs.deploy_all }}
      nothing_to_deploy: ${{ steps.plan.outputs.nothing_to_deploy }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref }}
          # Full history so base_sha (an ancestor on main) is reachable for the diff.
          fetch-depth: 0
          persist-credentials: false

      # Baseline for the change-diff = the last commit that SUCCESSFULLY deployed
      # to this environment, not the previous push tip. A deploy that was
      # cancelled (superseded by a newer merge) or failed never advances the
      # baseline, so its files reappear in the next run's diff window and are
      # re-deployed — no more main↔staging drift when back-to-back merges cancel
      # an in-flight change-scoped deploy. Only meaningful for change-scoped
      # (staging) runs; production is full-deploy and ignores base_sha.
      - name: Resolve baseline = last successful deploy
        id: baseline
        if: inputs.deploy_only_changed == 'true'
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          PRIVATE_REPO: ${{ env.PRIVATE_REPO }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Deployments list is newest-first. The current run's own Deployment is
          # still `pending`, and a cancelled/failed prior deploy's latest status
          # is not `success`, so both are skipped. GitHub auto-inactivates OLDER
          # successes only once a NEWER success lands, so the first success we hit
          # walking newest-first is the true last-good deploy.
          BASE=""
          for id in $(gh api "repos/$PRIVATE_REPO/deployments?environment=$ENVIRONMENT&per_page=30" --jq '.[].id'); do
            state=$(gh api "repos/$PRIVATE_REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
            if [ "$state" = "success" ]; then
              BASE=$(gh api "repos/$PRIVATE_REPO/deployments/$id" --jq '.sha')
              break
            fi
          done
          if [ -n "$BASE" ]; then
            echo "✓ baseline = last successful $ENVIRONMENT deploy: $BASE"
          else
            echo "no prior successful $ENVIRONMENT deploy — falling back to base_sha / full deploy"
          fi
          echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Compute deploy targets
        id: plan
        env:
          DEPLOY_ONLY_CHANGED: ${{ inputs.deploy_only_changed }}
          # Prefer the last-successful-deploy baseline; fall back to the payload's
          # previous-push tip (and compute-deploy-targets.sh full-deploys if empty).
          BASE_SHA: ${{ steps.baseline.outputs.base_sha || inputs.base_sha }}
        run: .github/scripts/compute-deploy-targets.sh

      # A merge that deploys nothing skips tf-outputs + the whole deploy job
      # (terraform apply included), which reads as a silent no-op in the Actions
      # UI unless we say why.
      - name: Record the plan in the run summary
        env:
          WORKERS: ${{ steps.plan.outputs.workers_list }}
          ZONES: ${{ steps.plan.outputs.zones_list }}
          DISPATCHER: ${{ steps.plan.outputs.deploy_dispatcher }}
          ALL: ${{ steps.plan.outputs.deploy_all }}
          NOTHING: ${{ steps.plan.outputs.nothing_to_deploy }}
        run: |
          {
            if [ "$NOTHING" = "true" ]; then
              echo "### Nothing to deploy"
              echo
              echo "No worker, zone or dispatcher change in this diff (tooling / docs / tests only)."
              echo "Terraform apply and the deploy job are skipped; staging is already current."
            else
              echo "### Deploy plan"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Full deploy | \`$ALL\` |"
              echo "| Workers | \`${WORKERS:-none}\` |"
              echo "| Zones | \`${ZONES:-none}\` |"
              echo "| Dispatcher | \`$DISPATCHER\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 1. CI gate. Runs biome / typecheck / lint / vitest in parallel against
  #    the deploy ref BEFORE any infra touches Cloudflare or HCP. Lives in
  #    ppap (not the private repo) so deploys cost zero billed minutes —
  #    same reusable workflow PR-CI uses, just with a different ref.
  #
  #    `release.yml` is workflow_dispatch only and `main-push-dispatch`
  #    can be re-fired manually; without this gate, a broken `main` (or a
  #    bad merge commit) would still reach the build/deploy graph. Branch
  #    protection requires the PR-CI `CI` check green on the source PR, but
  #    this gate re-validates on the actual deploy ref to catch admin
  #    bypasses + post-merge drift.
  # ───────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: 1 · CI gate
    # Per-environment: staging passes run_ci_gate=false (the source PR already ran
    # full CI on refs/pull/N/merge before merge — re-checking the same code on the
    # auto-deploy is redundant), so staging goes straight to the build stage.
    # Production keeps it true to re-validate on the release tag. When skipped,
    # tf-outputs still proceeds (its `if` treats a skipped gate as pass).
    if: ${{ inputs.run_ci_gate }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      # Whether this gate runs the full Playwright e2e suite is per-environment
      # (inputs.run_e2e_gate): production keeps it true; staging passes false
      # because the PR merged to main already ran full e2e on refs/pull/N/merge
      # (= main + PR), so re-running it on the auto-deploy is redundant.
      # biome/typecheck/lint/vitest ALWAYS run here regardless — they re-validate
      # on the actual deploy ref (sha for staging, refs/tags/<tag> for
      # production) to catch admin-bypassed merges + post-merge drift before
      # infra touches Cloudflare. A failing job fails ci-gate, which blocks
      # tf-outputs — and with it the builds + deploy (needs: [ci-gate]).
      run_e2e: ${{ inputs.run_e2e_gate }}
    secrets:
      PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Read the CURRENT Terraform outputs (no apply — that happens as the first
  #    step of the deploy job, right before the uploads). The build matrices
  #    need them for two things only:
  #      • worker builds — real binding IDs so `wrangler deploy --dry-run` gets
  #        past config parsing. The emitted bundle does NOT embed them (the
  #        deploy job re-resolves the config it uploads), so the previous
  #        state's values are sufficient; a binding created by THIS commit is
  #        simply absent and resolves to a placeholder (TF_OUTPUTS_LENIENT).
  #      • zone builds — the VAPID public key + Sentry config baked into the
  #        browser bundle. Both come from HCP workspace variables, so they are
  #        already in the previous state's outputs.
  #    Cheap (init + `terraform output`, no plan/apply), so it barely delays the
  #    build fan-out.
  #
  #    Fresh workspace (no state → no outputs at all): fall back to a full apply
  #    here, otherwise the build stage has no VAPID key / credentials to read.
  #    That is the documented production cold-start path (see
  #    .claude/infrastructure.md § Production cold-start bootstrap); the deploy
  #    job's own apply is then a no-op second pass.
  # ───────────────────────────────────────────────────────────────────────────
  tf-outputs:
    name: 2 · Infra · Terraform outputs (read)
    needs: [ci-gate, changes]
    # Run when the gate PASSED or was SKIPPED (staging, run_ci_gate=false); only a
    # genuine gate FAILURE (or cancel) blocks the deploy. Without `always()` a
    # skipped `needs` would skip this job too.
    #
    # Skipped entirely when the plan selected nothing (tooling/docs/test-only
    # merge): there is no artifact to deploy, so there is nothing to provision
    # for. A terraform-only change forces deploy_all, so infra changes always
    # reach apply. `changes.result == 'success'` is explicit because under
    # `always()` a FAILED plan job yields an empty output string, which would
    # sail through a bare `!= 'true'` test and build off a broken plan.
    if: >-
      ${{ always()
          && needs.ci-gate.result != 'failure' && needs.ci-gate.result != 'cancelled'
          && needs.changes.result == 'success'
          && needs.changes.outputs.nothing_to_deploy != 'true' }}
    runs-on: ubuntu-latest
    # No `tf-<env>` concurrency group here — this job only READS state. The
    # group lives on the deploy job, which owns the apply. (The cold-start
    # fallback below can apply, but only on a state-less workspace, and HCP
    # serializes runs per workspace anyway.)
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ inputs.tf_workspace }}

    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Read-only: the apply runs in the deploy job. `|| echo '{}'` covers a
      # workspace with no state yet (`terraform output` exits non-zero), which
      # the cold-start branch below then resolves.
      - name: Export Terraform outputs (current state)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform output -json > tf-outputs.json 2>/dev/null || echo '{}' > tf-outputs.json
          if [[ "$(jq -r 'keys | length' tf-outputs.json)" -eq 0 ]]; then
            echo "::notice::fresh workspace (no outputs yet) — applying here so the build stage has binding IDs; the deploy job's apply becomes a second pass"
            terraform apply -auto-approve -no-color
            terraform output -json > tf-outputs.json
          fi
          echo "$(jq -r 'keys | length' tf-outputs.json) terraform outputs available to the build stage"

      - uses: actions/upload-artifact@v7
        with:
          name: tf-outputs
          path: terraform/tf-outputs.json
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build every API worker bundle in parallel. `wrangler deploy --dry-run
  #    --outdir dist` bundles + minifies WITHOUT contacting Cloudflare; the
  #    output (apis/<svc>/dist) ships as an artifact the deploy job uploads with
  #    `--no-bundle`. Binding IDs are NOT baked into the JS bundle (they're
  #    applied from wrangler.jsonc at upload), but we still run
  #    resolve-wrangler-bindings here so `--dry-run` doesn't choke on the
  #    `${...}` placeholder IDs in the committed config. It runs in LENIENT mode:
  #    Terraform hasn't applied yet at this point in the graph, so a resource
  #    this commit introduces isn't in the outputs — a placeholder ID keeps the
  #    bundle building, and the deploy job resolves the real one post-apply.
  #
  #    Short matrix → gates the (short) front of the deploy job; runs in
  #    parallel with the slow build-zones matrix.
  # ───────────────────────────────────────────────────────────────────────────
  build-workers:
    name: 3 · Build · ${{ matrix.service }} (worker bundle)
    needs: [tf-outputs, changes]
    # See deploy job below — tolerate the skipped ci-gate in the transitive
    # closure. Skip entirely when no worker changed (empty selection).
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.workers != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # One worker failing to bundle must not abort the others — the deploy job
      # gates on the whole matrix, so a partial failure already blocks the deploy.
      fail-fast: false
      matrix:
        # The changed subset (full canonical list on a full/production deploy) —
        # computed by the `changes` job. See compute-deploy-targets.sh.
        service: ${{ fromJSON(needs.changes.outputs.workers) }}

    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      # Resolve so `wrangler deploy --dry-run` sees valid binding IDs instead of
      # `${...}` placeholders. The resulting JS bundle is binding-ID-agnostic —
      # the deploy job re-resolves the config it actually uploads with, against
      # POST-apply outputs. Hence LENIENT: any output missing from the current
      # state (a resource this commit adds) becomes a dummy ID here.
      - name: Resolve wrangler bindings
        run: .github/scripts/resolve-wrangler-bindings.sh ${{ matrix.service }} ${{ inputs.environment }}
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json
          TF_OUTPUTS_LENIENT: '1'

      # Call wrangler directly (mirrors each worker's `build` script + --outdir)
      # rather than `pnpm run build -- --outdir dist`: pnpm forwards the extra
      # args behind a literal `--`, which wrangler treats as positionals, so the
      # `--outdir` flag is dropped and no dist/ is written. `exec` has no such
      # separator. The deploy job uploads dist/index.js with --no-bundle.
      - name: Build worker bundle (dry-run → dist)
        run: pnpm --filter @namthuanvn/${{ matrix.service }} exec wrangler deploy src/index.ts --dry-run --minify --outdir dist

      - name: Package worker bundle
        run: tar -cf worker-${{ matrix.service }}.tar apis/${{ matrix.service }}/dist

      - uses: actions/upload-artifact@v7
        with:
          name: worker-build-${{ matrix.service }}
          path: worker-${{ matrix.service }}.tar
          retention-days: 1
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build every Next.js zone (OpenNext → Cloudflare Workers) in parallel.
  #    `build:pages` writes apps/<zone>/.open-next, which the deploy job uploads
  #    via `wrangler deploy --env` WITHOUT rebuilding. All NEXT_PUBLIC_* +
  #    Sentry source-map config is baked HERE at build time (the client always
  #    calls same-origin /api/*). This matrix needs NOTHING from the worker
  #    deploys — only tf-outputs for the baked VAPID/Sentry values — so it runs
  #    fully in parallel with the worker build + the worker deploy chain. This is
  #    the long pole; overlapping it with everything else is the main win.
  # ───────────────────────────────────────────────────────────────────────────
  build-zones:
    name: 4 · Build · ${{ matrix.zone.name }} (Next.js zone)
    needs: [tf-outputs, changes]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.zones != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The changed zone subset ({name,pkg} objects; full canonical list on a
        # full/production deploy) — computed by the `changes` job.
        zone: ${{ fromJSON(needs.changes.outputs.zones) }}

    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      - uses: actions/download-artifact@v8
        with:
          name: tf-outputs
          path: /tmp

      # Warm THIS zone's Next compiler cache across runs. build:pages still runs
      # (always re-evaluates source — no stale-build risk) but reuses prior
      # compilation work. Keyed per-zone so the matrix legs don't clobber one
      # another's cache.
      - name: Cache Next build
        uses: actions/cache@v6
        with:
          path: apps/${{ matrix.zone.name }}/.next/cache
          key: next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**', 'packages/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-${{ matrix.zone.name }}-

      # VAPID public key (Web Push) — lives in HCP, surfaced via tf-outputs.
      - name: Load VAPID public key from tf-outputs
        id: vapid
        run: |
          jq -er .vapid_public_key.value /tmp/tf-outputs.json | xargs -I {} echo "public_key={}" >> "$GITHUB_OUTPUT"

      # Sentry config — all four optional. Empty values skip the echo so the
      # SDK initializes with `enabled: false`. See `docs/engineering/sentry.md`.
      # Every zone shares the one dashboard Sentry project (they are one product).
      - name: Load Sentry config from tf-outputs
        id: sentry
        run: |
          jq -r .sentry_dsn_dashboard.value     /tmp/tf-outputs.json | xargs -I {} echo "dsn={}"          >> "$GITHUB_OUTPUT"
          jq -r .sentry_auth_token.value        /tmp/tf-outputs.json | xargs -I {} echo "auth_token={}"  >> "$GITHUB_OUTPUT"
          jq -r .sentry_org.value               /tmp/tf-outputs.json | xargs -I {} echo "org={}"         >> "$GITHUB_OUTPUT"
          jq -r .sentry_project_dashboard.value /tmp/tf-outputs.json | xargs -I {} echo "project={}"     >> "$GITHUB_OUTPUT"

      - name: Build (OpenNext — Cloudflare Workers)
        run: pnpm --filter ${{ matrix.zone.pkg }} run build:pages
        env:
          NEXT_PUBLIC_APP_ENV: ${{ inputs.environment }}
          NEXT_PUBLIC_APP_RELEASE: ${{ steps.sha.outputs.value }}
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}
          NEXT_PUBLIC_DASHBOARD_URL: https://${{ inputs.domain }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ steps.sentry.outputs.dsn }}
          SENTRY_AUTH_TOKEN: ${{ steps.sentry.outputs.auth_token }}
          SENTRY_ORG: ${{ steps.sentry.outputs.org }}
          SENTRY_PROJECT: ${{ steps.sentry.outputs.project }}

      # tar (not a raw many-small-files upload) so the .open-next file count
      # doesn't make upload/download slow. Already minified → skip artifact gzip.
      # tar preserves the `apps/<zone>/.open-next` path so the deploy job
      # reassembles the tree verbatim by untarring.
      - name: Package zone build
        run: tar -cf zone-${{ matrix.zone.name }}.tar apps/${{ matrix.zone.name }}/.open-next

      - uses: actions/upload-artifact@v7
        with:
          name: zone-build-${{ matrix.zone.name }}
          path: zone-${{ matrix.zone.name }}.tar
          retention-days: 1
          compression-level: 0

  # ───────────────────────────────────────────────────────────────────────────
  # 4. ONE ordered deploy job. Downloads every prebuilt artifact (worker
  #    bundles + zone OpenNext outputs), APPLIES Terraform (KV, D1, Queues,
  #    Workers secrets — every binding target must exist before the uploads),
  #    resolves bindings, then uploads in strict dependency order within this
  #    single job — so the expensive checkout + pnpm install happens ONCE for
  #    the whole deploy phase instead of once per tier:
  #
  #      monitor  →  leaves  →  tier-1.5  →  gateway  →  zones  →  dispatcher
  #
  #    The order is forced by Cloudflare binding existence:
  #      • monitor first   — every worker's `tail_consumers` references it (else reject).
  #      • leaves          — base tier 1 APIs.
  #      • tier-1.5         — orchestrator/aggregator service-bind to leaves (error 10143).
  #      • gateway          — service-binds to every worker.
  #      • zones            — each service-binds to gateway for SSR prefetch.
  #      • dispatcher       — apex ingress; service-binds gateway + all zones.
  #    Within a tier order is irrelevant, so leaves / tier-1.5 / zones deploy
  #    their members concurrently (background + wait) for speed; the tiers
  #    themselves stay sequential steps.
  #
  #    API workers upload prebuilt bundles via `wrangler deploy dist/index.js
  #    --no-bundle`. Zones run their `deploy:<env>` script on the prebuilt
  #    .open-next (no rebuild). The dispatcher is a tiny plain Worker — it
  #    bundles inline at deploy (no prebuilt artifact).
  #
  #    Terraform applies HERE (not in its own job ahead of the builds) so the
  #    window between provisioning Cloudflare and shipping the code that uses it
  #    is seconds instead of the 5–7 minutes the zone builds take. Everything
  #    that does not depend on the apply (checkout, install, artifact download)
  #    runs BEFORE it, so the apply is the last thing before the first upload.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 5 · Deploy · Terraform apply + all workers + zones (ordered)
    needs: [changes, tf-outputs, build-workers, build-zones]
    # The implicit `success()` check spans the whole transitive `needs` closure,
    # which includes the (skipped-on-staging) ci-gate — so a skipped gate would
    # skip this job too. `!cancelled() && !failure()` runs on success-OR-skipped
    # ancestors while still blocking on a genuine upstream failure/cancel.
    # `nothing_to_deploy` skips the job outright: every tier's own gate would
    # no-op anyway, so this just avoids the checkout + install to do nothing —
    # and there is nothing to provision for either (a terraform-only change
    # forces deploy_all, so infra changes always reach the apply below).
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.nothing_to_deploy != 'true' }}
    runs-on: ubuntu-latest
    # Serializes the apply per environment across runs (moved here with it).
    concurrency:
      group: tf-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ inputs.tf_workspace }}

    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Capture deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install

      # Pull every prebuilt bundle/zone artifact into one dir, then untar from
      # the repo root so each tar's `apis/<svc>/dist` and `apps/<zone>/.open-next`
      # path is restored verbatim.
      - name: Download prebuilt bundles
        uses: actions/download-artifact@v8
        with:
          pattern: '*-build-*'
          merge-multiple: true
          path: /tmp/bundles

      # Tolerate zero artifacts: a selective deploy that only touched, say, the
      # dispatcher builds no worker/zone bundle, so /tmp/bundles is empty.
      - name: Unpack prebuilt bundles
        run: |
          shopt -s nullglob
          for t in /tmp/bundles/*.tar; do tar -xf "$t"; done

      # ── Infra ─────────────────────────────────────────────────────────────
      # Everything above is apply-independent, so the apply lands as late as
      # possible: from here to the first `wrangler deploy` is seconds.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # `cloudflare_workers_secret` can only attach to a Worker script that
      # already exists on the account, but new workers deploy via wrangler
      # AFTER terraform in this graph — so the first deploy of a brand-new
      # secret-bearing service dies with Cloudflare error 10007 ("This Worker
      # does not exist on your account"; first hit: exms, PR #261). Upload a
      # trivial placeholder for any missing script_name referenced by the
      # terraform modules; the real wrangler deploy overwrites it later in
      # this same job. Idempotent — a no-op GET per worker once they exist.
      # Credentials come from the PREVIOUS state's outputs (readable after
      # init, before apply); on a completely fresh workspace there are none,
      # so the step skips and the documented two-pass HCP bootstrap applies
      # (see .claude/infrastructure.md § Production cold-start bootstrap).
      - name: Bootstrap missing Workers (secrets cold-start)
        working-directory: terraform
        run: |
          terraform output -json > /tmp/pre-outputs.json 2>/dev/null || echo '{}' > /tmp/pre-outputs.json
          ACC="$(jq -r '.cloudflare_account_id.value // empty' /tmp/pre-outputs.json)"
          TOKEN="$(jq -r '.cloudflare_api_token.value // empty' /tmp/pre-outputs.json)"
          rm -f /tmp/pre-outputs.json
          if [[ -z "$ACC" || -z "$TOKEN" ]]; then
            echo "no prior terraform outputs (fresh workspace) — skipping bootstrap"
            exit 0
          fi
          echo "::add-mask::$ACC"
          echo "::add-mask::$TOKEN"
          printf 'export default { fetch() { return new Response("bootstrapping", { status: 503 }); } };\n' > /tmp/placeholder.mjs
          for name in $(grep -rho 'script_name *= *"[^"]*"' apis/ | sed 's/.*"\(.*\)"/\1/' | sort -u); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/services/$name")"
            if [[ "$code" == "404" ]]; then
              echo "worker '$name' missing — uploading placeholder so its secret can attach"
              curl -sf -X PUT \
                -H "Authorization: Bearer $TOKEN" \
                -F 'metadata={"main_module":"placeholder.mjs","compatibility_date":"2024-11-01"};type=application/json' \
                -F 'placeholder.mjs=@/tmp/placeholder.mjs;type=application/javascript+module' \
                "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$name" > /dev/null
            else
              echo "worker '$name' exists (HTTP $code)"
            fi
          done

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -no-color

      # POST-apply outputs — this file (not the build stage's read-only copy) is
      # what every resolve/bake step below reads, so a resource created by the
      # apply above resolves to its real ID.
      - name: Export Terraform outputs
        working-directory: terraform
        run: terraform output -json > /tmp/tf-outputs.json

      # Resolve config for each SELECTED API worker (substitutes binding IDs into
      # apis/<svc>/wrangler.jsonc) AND export the shared Cloudflare credentials to
      # $GITHUB_ENV for the deploy + migration steps. `dashboard` is a
      # credentials-only pass (zones/dispatcher carry no Terraform-owned
      # resources) — always included so the creds are loaded even when no worker
      # changed. WORKERS is the changed subset (full list on a full deploy).
      - name: Resolve wrangler bindings + credentials
        env:
          TF_OUTPUTS_JSON: /tmp/tf-outputs.json
          WORKERS: ${{ needs.changes.outputs.workers_list }}
        run: |
          set -euo pipefail
          for svc in $WORKERS dashboard; do
            .github/scripts/resolve-wrangler-bindings.sh "$svc" ${{ inputs.environment }}
          done

      # Sentry DSN — runtime `--var` for the zone + dispatcher worker wraps.
      - name: Load Sentry DSN from tf-outputs
        id: sentry
        run: |
          jq -r .sentry_dsn_dashboard.value /tmp/tf-outputs.json | xargs -I {} echo "dsn={}" >> "$GITHUB_OUTPUT"

      # Vectorize index for the assistant leaf — Cloudflare TF provider v4 lacks
      # `cloudflare_vectorize_index` (added in v5). Idempotent: first run creates
      # the index + metadata indexes, later runs are no-ops. Must precede the
      # assistant deploy (its binding references the index).
      # See `.claude/infrastructure.md` § Vectorize bootstrap. Only needed when
      # the assistant leaf is being (re)deployed — its binding references the index.
      - name: Bootstrap Vectorize index (idempotent)
        if: ${{ contains(fromJSON(needs.changes.outputs.workers), 'assistant') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          INDEX="assistant-vectors"
          if npx wrangler vectorize list 2>/dev/null | grep -qE "(^|[[:space:]])${INDEX}([[:space:]]|\$)"; then
            echo "✓ Vectorize index '${INDEX}' already exists — skipping create."
          else
            echo "Creating Vectorize index '${INDEX}'..."
            npx wrangler vectorize create "${INDEX}" --dimensions=1024 --metric=cosine
            npx wrangler vectorize create-metadata-index "${INDEX}" --property-name=requiredPermission --type=string
            npx wrangler vectorize create-metadata-index "${INDEX}" --property-name=entityType --type=string
            echo "✓ Vectorize index '${INDEX}' created with metadata indexes."
          fi

      # ── Tier order ────────────────────────────────────────────────────────
      - name: Deploy monitor (tail logs)
        if: ${{ contains(fromJSON(needs.changes.outputs.workers), 'monitor') }}
        run: pnpm --filter @namthuanvn/monitor exec wrangler deploy dist/index.js --no-bundle --var "SENTRY_RELEASE:${{ steps.sha.outputs.value }}"

      # Leaves (tier 1) — independent of one another, so deploy concurrently.
      # Each: apply its D1 migrations (needs resolved binding + remote DB), then
      # upload the prebuilt bundle. Per-service logs are grouped; any failure
      # fails the step.
      - name: Deploy leaves (tier 1)
        env:
          WORKERS: ${{ needs.changes.outputs.workers_list }}
        run: |
          set -uo pipefail
          SHA='${{ steps.sha.outputs.value }}'
          pids=""
          # The hardcoded list fixes tier membership + order; each member deploys
          # only if it's in the changed set (WORKERS). Empty set → deploys nothing.
          for svc in hris expense utilities exms social oms sourcing bom quotation procurement notifications messenger audit auth assistant files; do
            case " $WORKERS " in *" $svc "*) ;; *) continue ;; esac
            (
              set -e
              pnpm --filter "@namthuanvn/$svc" --if-present db:migrate:remote
              pnpm --filter "@namthuanvn/$svc" exec wrangler deploy dist/index.js --no-bundle --var "SENTRY_RELEASE:$SHA"
            ) > "/tmp/leaf-$svc.log" 2>&1 &
            pids="$pids $!:$svc"
          done
          fail=0
          for p in $pids; do
            pid=${p%%:*}; svc=${p##*:}
            if ! wait "$pid"; then echo "::error::leaf deploy failed: $svc"; fail=1; fi
            echo "::group::leaf $svc"; cat "/tmp/leaf-$svc.log"; echo "::endgroup::"
          done
          exit "$fail"

      # Tier 1.5 — orchestrator/aggregator service-bind to the leaves above.
      - name: Deploy composers (tier 1.5)
        env:
          WORKERS: ${{ needs.changes.outputs.workers_list }}
        run: |
          set -uo pipefail
          SHA='${{ steps.sha.outputs.value }}'
          pids=""
          for svc in orchestrator aggregator; do
            case " $WORKERS " in *" $svc "*) ;; *) continue ;; esac
            (
              set -e
              pnpm --filter "@namthuanvn/$svc" --if-present db:migrate:remote
              pnpm --filter "@namthuanvn/$svc" exec wrangler deploy dist/index.js --no-bundle --var "SENTRY_RELEASE:$SHA"
            ) > "/tmp/tier15-$svc.log" 2>&1 &
            pids="$pids $!:$svc"
          done
          fail=0
          for p in $pids; do
            pid=${p%%:*}; svc=${p##*:}
            if ! wait "$pid"; then echo "::error::composer deploy failed: $svc"; fail=1; fi
            echo "::group::composer $svc"; cat "/tmp/tier15-$svc.log"; echo "::endgroup::"
          done
          exit "$fail"

      # Gateway — service-binds to every worker; uses --env (env-specific name +
      # routes live in its wrangler.jsonc env block). Bindings resolve by worker
      # NAME, so an unchanged gateway keeps routing to a redeployed leaf — it
      # only redeploys when its own package changed.
      - name: Deploy gateway (router)
        if: ${{ contains(fromJSON(needs.changes.outputs.workers), 'gateway') }}
        run: pnpm --filter @namthuanvn/gateway exec wrangler deploy --env ${{ inputs.environment }} dist/index.js --no-bundle --var "SENTRY_RELEASE:${{ steps.sha.outputs.value }}"

      # Zones — each service-binds to gateway; deploy the prebuilt .open-next via
      # their deploy:<env> script (no rebuild). Independent → concurrent.
      # SENTRY_DSN is a runtime var for the zone's @sentry/cloudflare worker wrap
      # (apps/<zone>/worker.ts); empty in envs without a DSN → Sentry disabled.
      - name: Deploy zones (Next.js)
        env:
          ZONES: ${{ needs.changes.outputs.zones_list }}
        run: |
          set -uo pipefail
          DSN='${{ steps.sentry.outputs.dsn }}'
          SUFFIX='${{ inputs.deploy_script_suffix }}'
          pids=""
          # ZONES is the changed subset as "name:pkg" pairs (full list on a full
          # deploy). Empty → deploys no zone.
          for entry in $ZONES; do
            name=${entry%%:*}; pkg=${entry##*:}
            ( pnpm --filter "$pkg" run "deploy$SUFFIX" -- --var "SENTRY_DSN:$DSN" ) > "/tmp/zone-$name.log" 2>&1 &
            pids="$pids $!:$name"
          done
          fail=0
          for p in $pids; do
            pid=${p%%:*}; name=${p##*:}
            if ! wait "$pid"; then echo "::error::zone deploy failed: $name"; fail=1; fi
            echo "::group::zone $name"; cat "/tmp/zone-$name.log"; echo "::endgroup::"
          done
          exit "$fail"

      # Apex dispatcher — a tiny plain Worker fronting the public custom_domain,
      # routing /api/* → gateway and each page/asset prefix → its zone over
      # service bindings. Deploys LAST: its bindings target the gateway + all six
      # zone workers, which must already exist (Cloudflare error 10143). No
      # Next.js build — it bundles inline at deploy. SENTRY_DSN is its only
      # runtime var (its worker wraps `withSentry` with a dispatcher service tag).
      # Redeploys only when its own package changed (its bindings resolve the
      # gateway + zones by NAME, so unchanged targets stay valid).
      - name: Deploy dispatcher (apex ingress)
        if: ${{ needs.changes.outputs.deploy_dispatcher == 'true' }}
        run: pnpm --filter @namthuanvn/dispatcher run deploy${{ inputs.deploy_script_suffix }} -- --var "SENTRY_DSN:${{ steps.sentry.outputs.dsn }}" --var "SENTRY_RELEASE:${{ steps.sha.outputs.value }}"

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Pingback. The dispatcher in the private repo created a *pending*
  #    GitHub Deployment; we close it out here with success/failure so
  #    erp-namthuan's Environments tab + commit status reflect the real
  #    outcome. Both steps no-op when the run was a manual workflow_dispatch
  #    (no deployment_id / sha in the event payload).
  # ───────────────────────────────────────────────────────────────────────────
  report-deployment:
    name: 6 · Report · deployment status
    # ci-gate + the build matrices are in `needs:` so a failure anywhere in the
    # graph (which skips the deploy job) still surfaces as a `failure` state to
    # the Deployment-status pingback. `deploy` is the single terminal job; its
    # success implies every tier (workers + zones + dispatcher) succeeded.
    #
    # `!cancelled()` (not `always()`): a run cancelled by concurrency
    # (superseded staging deploy — expected, not an error) skips reporting
    # entirely — no Telegram alert, and its pending GitHub Deployment is
    # auto-marked inactive when the superseding deploy posts `success`.
    needs: [changes, ci-gate, build-workers, build-zones, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `.github/scripts/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see .claude/ppap.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - name: Compute outcome
        id: outcome
        env:
          NOTHING: ${{ needs.changes.outputs.nothing_to_deploy }}
        run: |
          # A plan that selected nothing skips the deploy job by design — staging
          # already matches this commit, so that is a SUCCESS. Without this branch
          # the `deploy.result = success` test below would read the deliberate
          # skip as a failed deploy and fire the Telegram alert.
          if [ "$NOTHING" = "true" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "nothing=true" >> "$GITHUB_OUTPUT"
          # ci-gate is `success` when it ran (production) or `skipped` when the
          # environment opted out (staging, run_ci_gate=false) — both are OK; only
          # a `failure`/`cancelled` gate counts against the deploy.
          elif [ "${{ needs.ci-gate.result }}" != "failure" ] && \
               [ "${{ needs.ci-gate.result }}" != "cancelled" ] && \
               [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Deployment status on private repo
        if: inputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          STATE: ${{ steps.outcome.outputs.state }}
          TAG_SUFFIX: ${{ inputs.release_tag && format(' ({0})', inputs.release_tag) || '' }}
          NOTE: ${{ steps.outcome.outputs.nothing == 'true' && ' — no deployable change' || '' }}
        run: |
          gh api repos/${{ env.PRIVATE_REPO }}/deployments/${{ inputs.deployment_id }}/statuses \
            -f state="$STATE" \
            -f environment_url="https://${{ inputs.domain }}" \
            -f log_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="ppap run #${{ github.run_id }}${TAG_SUFFIX}${NOTE}"

      - name: Ping commit status on private repo
        if: inputs.commit_sha != ''
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          STATE: ${{ steps.outcome.outputs.state }}
          TAG_SUFFIX: ${{ inputs.release_tag && format(' ({0})', inputs.release_tag) || '' }}
          NOTE: ${{ steps.outcome.outputs.nothing == 'true' && ' — no deployable change' || '' }}
        run: |
          gh api repos/${{ env.PRIVATE_REPO }}/statuses/${{ inputs.commit_sha }} \
            -f state="$STATE" \
            -f context=${{ inputs.status_context }} \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="ppap deploy $STATE${TAG_SUFFIX}${NOTE}"

      - name: Summary
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Outcome: ${{ steps.outcome.outputs.state }}"
          echo "Tag: ${{ inputs.release_tag }}"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "URL: https://${{ inputs.domain }}"

      # Failure-only Telegram alert to the build topic of the team supergroup
      # (same bot as the runtime error alerts; secrets live in this repo's
      # Actions secrets). Last step + non-fatal so a Telegram outage can never
      # disturb the Deployment/commit-status pingbacks above.
      - name: Notify Telegram on failure
        if: steps.outcome.outputs.state == 'failure'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_BUILD_THREAD_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
          RUN_TITLE: ${{ inputs.run_title }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          R_CI: ${{ needs.ci-gate.result }}
          R_BUILD_WORKERS: ${{ needs.build-workers.result }}
          R_BUILD_ZONES: ${{ needs.build-zones.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "Telegram not configured (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID empty) — skipping notify."
            exit 0
          fi
          TAG_SUFFIX=""
          if [ -n "${RELEASE_TAG:-}" ]; then TAG_SUFFIX=" (${RELEASE_TAG})"; fi
          ENV_UPPER=$(printf '%s' "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          # Commit subjects are user-controlled text inside parse_mode=HTML — escape.
          SAFE_TITLE=$(printf '%s' "${RUN_TITLE:-}" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          # Context line: actor · commit. Both optional (empty on a manual
          # workflow_dispatch) so the line collapses gracefully.
          META=""
          if [ -n "${TRIGGERED_BY:-}" ]; then META="by @${TRIGGERED_BY}"; fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            META="${META:+$META · }commit <a href=\"https://github.com/${{ env.PRIVATE_REPO }}/commit/${COMMIT_SHA}\">${COMMIT_SHA:0:7}</a>"
          fi
          TEXT="🚨 <b>Deploy failed</b> — <b>${ENV_UPPER}</b>${TAG_SUFFIX}"
          if [ -n "$SAFE_TITLE" ]; then TEXT="${TEXT}: ${SAFE_TITLE}"; fi
          if [ -n "$META" ]; then TEXT="${TEXT}"$'\n'"${META}"; fi
          TEXT="${TEXT}"$'\n'"Ref: <code>${CHECKOUT_REF}</code>"
          TEXT="${TEXT}"$'\n'"Jobs: ci-gate ${R_CI} · build-workers ${R_BUILD_WORKERS} · build-zones ${R_BUILD_ZONES} · deploy ${R_DEPLOY}"
          TEXT="${TEXT}"$'\n'"<a href=\"${RUN_URL}\">View run</a>"
          THREAD_ARGS=()
          if [ -n "${THREAD_ID:-}" ]; then THREAD_ARGS=(-d "message_thread_id=${THREAD_ID}"); fi
          if curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            "${THREAD_ARGS[@]}" \
            --data-urlencode "text=${TEXT}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true; then
            echo "✓ Telegram failure alert sent."
          else
            echo "::warning::Telegram notify failed (deploy failure alert not delivered)."
          fi
