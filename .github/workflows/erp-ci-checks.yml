      - uses: ./.github/actions/install

      # The develop variant's backend: `pnpm dev:lite` on :3008, as in local
      # development (the boot itself is the one erp-local-stack-matrix.yml
      # proves on every OS). nohup, because the stack must outlive this step.
      # Dependency verification is off for the same reason as scripts/ci/e2e/ci-boot.sh:
      # the install action's cache already holds the lockfile's node_modules.
      - name: Boot the local stack (pnpm dev:lite → :3008)
        timeout-minutes: 15
        env:
          pnpm_config_verify_deps_before_run: 'false'
        run: |
          set -uo pipefail
          mkdir -p .wrangler
          nohup pnpm dev:lite > .wrangler/dev-lite.log 2>&1 &
          BOOT_PID=$!
          waited=0
          until curl -sf -o /dev/null --max-time 20 http://127.0.0.1:3008/api/health; do
            if ! kill -0 "$BOOT_PID" 2>/dev/null || [ "$waited" -ge 600 ]; then
              echo "::error::pnpm dev:lite did not answer /api/health within ${waited}s"
              tail -80 .wrangler/dev-lite.log
              exit 1
            fi
            sleep 2
            waited=$((waited + 2))
          done
          echo "✓ /api/health → up after ${waited}s"
          # Health answers before the first login and feed do; warm them so the journeys' waits time the app.
          bash scripts/ci/native/warm-stack.sh

      # Launches Gradle only; the daemon's own JDK comes from
      # gradle/gradle-daemon-jvm.properties, provisioned by the toolchain resolver.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The emulator needs hardware acceleration, which the runner only grants
      # once /dev/kvm is opened to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, lint + unit tests
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest ktlintCheck detekt :app:lintDevDebug

      # The emulator runner below downloads the emulator and its system image on every run, once:
      # one corrupt download (`Error on ZipFile unknown archive`, after 9 min on #8320) failed the
      # job with no test run. Install both here with a bounded retry; the runner's own install
      # then finds them present and downloads nothing.
      - name: Install the emulator and its system image
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PKGS=(emulator 'system-images;android-35;aosp_atd;x86_64')
          yes | timeout 60 "$SDKM" --licenses > /dev/null || true
          for i in 1 2 3; do
            timeout 300 "$SDKM" --install "${PKGS[@]}" --channel=0 > /dev/null && exit 0
            echo "sdkmanager install attempt $i of 3 failed" >&2
            rm -rf "$ANDROID_HOME/.temp"
          done
          echo "::error::installing ${PKGS[*]} failed 3 times"
          exit 1

      - name: Compose UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # The same headless image as the managed device in app/build.gradle.kts.
          target: aosp_atd
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: apps/mobile/android
          script: ./gradlew :app:connectedDevDebugAndroidTest

      # Gradle reports success when the device ran nothing, so count the
      # results: a UI-test step that ran zero tests is red, not green.
      - name: Count the UI tests that ran
        run: |
          set -euo pipefail
          DIR=apps/mobile/android/app/build/outputs/androidTest-results/connected
          count() { { find "$DIR" -name '*.xml' -exec cat {} + 2>/dev/null || true; } | { grep -o "$1" || true; } | wc -l | tr -d ' '; }
          RAN=$(count '<testcase'); FAILED=$(count '<failure'); SKIPPED=$(count '<skipped')
          echo "UI tests: $RAN ran, $FAILED failed, $SKIPPED skipped"
          [ "$((RAN - SKIPPED))" -gt 0 ] || { echo "::error::no Compose UI test ran on the emulator (results under $DIR)"; exit 1; }

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-results
          # Test reports only, never lint's HTML: it quotes source, and ppap repos are public.
          path: |
            apps/mobile/android/app/build/reports/tests
            apps/mobile/android/app/build/reports/androidTests
            apps/mobile/android/app/build/outputs/androidTest-results
            .wrangler/dev-lite.log
            .wrangler/state/api.log
            .wrangler/state/next.log
          retention-days: 7
          if-no-files-found: ignore

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true

  # ONE native verdict for the caller. Green only when the plan succeeded,
  # every platform it asked for passed and every other platform was skipped —
  # a platform that ran unasked, or was asked and skipped, is red. A crashed
  # job here leaves the output empty, which the caller reads as red.
  native:
    name: 1 · CI · Mobile (result)
    needs: [native-plan, native-gates, native-ios, native-android]
    if: ${{ !cancelled() && inputs.run_native }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - name: Emit native verdict
        id: verdict
        env:
          PLAN: ${{ needs.native-plan.result }}
          WANT_GATES: ${{ needs.native-plan.outputs.web == 'false' && startsWith(inputs.checkout_ref, 'refs/pull/') }}
          GOT_GATES: ${{ needs.native-gates.result }}
          WANT_IOS: ${{ needs.native-plan.outputs.ios }}
          WANT_ANDROID: ${{ needs.native-plan.outputs.android }}
          GOT_IOS: ${{ needs.native-ios.result }}
          GOT_ANDROID: ${{ needs.native-android.result }}
        run: |
          set -euo pipefail
          RESULT=success
          [ "$PLAN" = success ] || RESULT=failure
          for p in GATES IOS ANDROID; do
            want="WANT_$p"; got="GOT_$p"
            if [ "${!want}" = true ]; then exp=success; else exp=skipped; fi
            [ "${!got}" = "$exp" ] || RESULT=failure
          done
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "▶ native verdict: plan=$PLAN gates=$WANT_GATES/$GOT_GATES ios=$WANT_IOS/$GOT_IOS android=$WANT_ANDROID/$GOT_ANDROID → $RESULT" >&2
