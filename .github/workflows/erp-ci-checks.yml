name: ERP · CI · Checks · Reusable

# Reusable CI graph: repo gates / lint / typecheck / test and the e2e suite
# against an arbitrary erp-namthuan ref. Called by both PR-CI
# (ppap:erp-ci-pr.yml) and the deploy gate (ppap:erp-deploy-reusable.yml).
# Every suite runs as SHARDS fanned out to idle fleet repos — the checks via
# erp-ci-checks-batch.yml, e2e via erp-ci-e2e-batch.yml — and this run
# coordinates. Outputs one verdict per suite so callers can build a per-suite
# summary.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'erp-namthuan ref to check out (refs/pull/<N>/merge for PR CI, sha for staging deploy, refs/tags/<tag> for production).'
        type: string
        required: true
      e2e_shards:
        description: 'DESIRED number of parallel Playwright shards. The effective count is min(this, available capacity) — see the e2e job. 48 = 4 workers x 12 shards at the default WORKER_SLOTS on an idle fleet, more workers with smaller batches on a busy one. Both PR CI and the deploy gate inherit it.'
        type: number
        default: 48
      fleet:
        description: 'Comma-separated owner/repo list of ppap CI repos this run may borrow idle capacity from, for the check shards and the e2e shards alike (the erp-namthuan variable PPAP_CI_REPOS). Empty ⇒ scripts/ci/fanout.mjs reads PPAP_CI_REPOS from erp-namthuan itself; only an unreadable variable keeps every shard on this repo.'
        type: string
        default: ''
      pr_number:
        description: 'Source PR number, forwarded to check and e2e batches so they can detect a moved head and bail early.'
        type: string
        default: ''
      head_sha:
        description: 'Head SHA under test, forwarded to check and e2e batches for the same stale check.'
        type: string
        default: ''
      run_e2e:
        description: 'Whether to run the e2e matrix. PR CI keeps the default (true); the deploy gate passes false so staging/production builds are not blocked on dashboard e2e.'
        type: boolean
        default: true
      gates_shards:
        description: 'Shards for the repo gates (scripts/ci/checks/plan.mjs GATES). Capped at the gate count. Neither caller passes it, so PR CI and the deploy gate run the same split.'
        type: number
        default: 2
      lint_shards:
        description: 'Shards for ESLint (root config split by workspace directory, plus each workspace lint:js). Capped at the unit count.'
        type: number
        default: 2
      typecheck_shards:
        description: 'Shards for typecheck (one unit per workspace package with a typecheck script). Capped at the package count.'
        type: number
        default: 4
      test_shards:
        description: 'Shards for Vitest (one unit per workspace package with a test script). Capped at the package count.'
        type: number
        default: 6
      e2e_changed_only:
        description: 'Scope e2e to the changed service''s specs (broad/shared change → full suite, nothing relevant → skip). NOBODY passes true any more: PR CI stopped scoping in #3722 because a PR could be green while the suite was red, and the deploy gate always ran full. Kept because the scoping logic below is still the right tool if a caller ever needs it. See scripts/ci/e2e/plan.sh.'
        type: boolean
        default: false
      run_native:
        description: 'Plan the change with scripts/ci/native/scope.sh: run the native iOS / Android jobs for the platforms it touches, and skip the web/backend checks and e2e (reported as success) when every changed file is under apps/mobile/ or is markdown. Only PR CI passes true; the deploy gate keeps the default (false), so none of this runs there and every web suite runs as before.'
        type: boolean
        default: false
    outputs:
      # The four check verdicts keep the names (and meaning) they had as
      # separate jobs, so erp-ci-pr.yml and erp-deploy-reusable.yml read them
      # unchanged. `biome` is the repo-gates suite — the key stayed when the job
      # was renamed, and callers read it as R_BIOME. Each is `success` only when
      # every shard of that suite passed; anything else, empty included, is red.
      biome:
        description: 'Verdict of the sharded repo-gates suite.'
        value: ${{ jobs.checks.outputs.gates }}
      typecheck:
        description: 'Verdict of the sharded typecheck suite.'
        value: ${{ jobs.checks.outputs.typecheck }}
      lint:
        description: 'Verdict of the sharded ESLint suite.'
        value: ${{ jobs.checks.outputs.lint }}
      test:
        description: 'Verdict of the sharded Vitest suite.'
        value: ${{ jobs.checks.outputs.test }}
      check_runs:
        description: 'JSON array of the fanned-out check batch runs ([{repo, batch, run_id, conclusion}]), the checks counterpart of e2e_runs.'
        value: ${{ jobs.checks.outputs.runs }}
      e2e:
        description: 'e2e verdict: success when every batch passed OR the plan had nothing relevant to test; failure otherwise. Empty (⇒ red) if the job itself died.'
        value: ${{ jobs.e2e.outputs.result }}
      e2e_runs:
        description: 'JSON array of the fanned-out batch runs ([{repo, batch, run_id, conclusion}]) so the caller can scan their logs. Empty when nothing was dispatched.'
        value: ${{ jobs.e2e.outputs.runs }}
      native:
        description: 'Native mobile verdict: success when every platform job the plan asked for passed and the rest were skipped (and always when run_native is false); failure otherwise. Empty (⇒ red) if the verdict job itself died.'
        value: ${{ !inputs.run_native && 'success' || jobs.native.outputs.result }}
    secrets:
      # The multi-account PAT pool — the ONLY token source. Required: the
      # single-PAT fallback was retired once the pool was live in all 8 stores,
      # because a fallback meant a mis-set pool silently reverted the whole
      # system to one account's quota and looked healthy doing it.
      PAT_TOKEN_POOL:
        required: true
      # The fleet's GitHub App (ppap-github-app.md) — used only when the repo
      # variable FLEET_AUTH_MODE is `app`; optional so the pool keeps working without them.
      FLEET_APP_ID:
        required: false
      FLEET_APP_PRIVATE_KEY:
        required: false
      # The ERP fleet hub's client credentials (scripts/agent/board/lib/hub.mjs),
      # read by `fanout.mjs run`. Optional: unset, the fan-out finds its batch
      # runs on GitHub after the grace period instead.
      ERP_HUB_CLIENT_ID_STAGING:
        required: false
      ERP_HUB_CLIENT_SECRET_STAGING:
        required: false
      ERP_HUB_CLIENT_ID_PRODUCTION:
        required: false
      ERP_HUB_CLIENT_SECRET_PRODUCTION:
        required: false

permissions: read-all

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan
  # Pre-seed init.defaultBranch so actions/checkout's internal `git init` stops
  # printing the "hint: git config --global init.defaultBranch <name>" line on
  # every job. git reads these GIT_CONFIG_* env vars as extra config, so the
  # hint's precondition (unset init.defaultBranch) is never met. Cosmetic
  # CI-log-noise removal only.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ONE job for the repo gates, ESLint, typecheck and Vitest: plan their shards,
  # dispatch them to idle fleet repos, wait, and emit one verdict per suite.
  #
  # These were four fixed jobs here — Repo gates, Lint, and two 3-leg matrices
  # whose legs were hand-binned package lists — holding 8 of this org's 20
  # concurrent-job slots next to the 10 zone builds on the e2e critical path.
  # Now scripts/ci/checks/plan.mjs discovers each suite's units (packages,
  # gates, ESLint directories), bin-packs them by measured weight into
  # `<suite>_shards` shards, and scripts/ci/fanout.mjs (SUITE=checks) sends them
  # to erp-ci-checks-batch.yml on whichever fleet repos have room — the same
  # recruitment the e2e shards use. Widening a suite is changing its input.
  #
  # Starts at t=0 with no `needs:`: a checks batch needs no build artifact, so
  # it runs alongside the zone builds and is usually done before e2e starts.
  # The e2e dispatch that follows sees the check batches in each host's
  # in-flight job count, so the two never over-commit a host.
  #
  # FAILS CLOSED per suite: an output is `success` only when every unit of
  # that suite reported a green job (scripts/ci/lib/fanout-plan.mjs
  # suiteVerdicts). A dispatch failure, a timeout or a missing job is red.
  checks:
    name: 1 · CI · Checks
    runs-on: ubuntu-latest
    # Bounded by the slowest remote unit (20 min) plus queueing on a busy host.
    timeout-minutes: 45
    outputs:
      gates: ${{ steps.verdict.outputs.gates }}
      lint: ${{ steps.verdict.outputs.lint }}
      typecheck: ${{ steps.verdict.outputs.typecheck }}
      test: ${{ steps.verdict.outputs.test }}
      runs: ${{ steps.collect.outputs.runs }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      # actions/checkout skips its GET /repos/{o}/{r}/hash-algorithm REST call
      # (one pooled-PAT call per checkout) only when `ref` is a full sha. Resolve
      # the caller's ref over the git protocol, which costs no REST quota. An
      # unresolvable ref (a conflicted PR has no refs/pull/N/merge) passes through
      # unchanged, so the checkout fails exactly as it did before.
      - name: Resolve the ref to a commit
        id: resolve
        env:
          REF: ${{ inputs.checkout_ref }}
          TOKEN: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
        run: |
          set -uo pipefail
          if printf '%s' "$REF" | grep -Eq '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'; then
            SHA="$REF"
          else
            Q="$REF"; case "$Q" in refs/*) ;; *) Q="refs/heads/$Q" ;; esac
            # An annotated tag lists its peeled commit as `<ref>^{}` — prefer it.
            SHA=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git" "$Q" "$Q^{}" |
              awk -v q="$Q" '$2 == q "^{}" { p = $1 } $2 == q { r = $1 } END { print (p != "" ? p : r) }')
          fi
          echo "ref=${SHA:-$REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ steps.resolve.outputs.ref }}
          # HEAD^1 for the mobile-only check below; the deploy gate keeps depth 1.
          fetch-depth: ${{ inputs.run_native && 2 || 1 }}
          persist-credentials: false

      # The remote check shards run the commit this job checked out, not the
      # moving `checkout_ref` (see the e2e-plan job's pin step).
      - name: Pin the commit under test
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A PR whose every changed file is under apps/mobile/ or is markdown has no
      # web code for these suites to check: scripts/ci/native/scope.sh answers
      # web=false, no shard is planned or dispatched, and every suite reports
      # success; the repo gates still run in the native-gates job. PR CI
      # only (run_native), and only on a PR merge ref — a manual run on `main`
      # smoke-tests the whole graph. A ref without the script runs everything.
      - name: Plan mobile-only skip
        id: native
        if: ${{ inputs.run_native && startsWith(inputs.checkout_ref, 'refs/pull/') }}
        run: |
          set -euo pipefail
          if [ -f scripts/ci/native/scope.sh ]; then
            NATIVE_SCOPE_BASE=HEAD^1 bash scripts/ci/native/scope.sh
          fi

      - name: Plan check shards
        id: plan
        if: ${{ steps.native.outputs.web != 'false' }}
        env:
          GATES_SHARDS: ${{ inputs.gates_shards }}
          LINT_SHARDS: ${{ inputs.lint_shards }}
          TYPECHECK_SHARDS: ${{ inputs.typecheck_shards }}
          TEST_SHARDS: ${{ inputs.test_shards }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/checks/plan.mjs ]; then
            echo "::error::scripts/ci/checks/plan.mjs is missing on this ref — rebase the PR onto main."
            exit 1
          fi
          UNITS="$(node scripts/ci/checks/plan.mjs units \
            "gates=$GATES_SHARDS" "lint=$LINT_SHARDS" \
            "typecheck=$TYPECHECK_SHARDS" "test=$TEST_SHARDS")"
          echo "units=$UNITS" >> "$GITHUB_OUTPUT"
          echo "▶ check units: $UNITS" >&2

      # ONE step: each batch leaves the moment a fleet host with room is found
      # (random order, never this repo nor NamThuanVn/ppap), then the same step
      # waits for every batch run and sets result_<suite> per suite.
      - name: Dispatch + wait for check batches
        id: collect
        if: ${{ steps.native.outputs.web != 'false' }}
        env:
          # A pooled PAT, not GITHUB_TOKEN: the probe and the dispatch both cross
          # org boundaries, and events created with GITHUB_TOKEN do not trigger
          # workflows at all.
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          # The whole pool, so fanout.mjs can move a call refused by GitHub's
          # per-account secondary rate limit to another account.
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          SUITE: checks
          CHECK_UNITS: ${{ steps.plan.outputs.units }}
          SELF: ${{ github.repository }}
          FLEET: ${{ inputs.fleet }}
          CHECKOUT_REF: ${{ steps.pin.outputs.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CORRELATION: ${{ github.run_id }}-${{ github.run_attempt }}
          # Per-host cap. 14 default units over 8 lands on two hosts, leaving
          # the rest of the fleet to the e2e shards that dispatch minutes later.
          WORKER_SLOTS: '8'
          # TIMEOUT_S bounds the whole step (inside the job's timeout-minutes);
          # DISPATCH_WAIT_S is how much of it a busy fleet may keep items
          # waiting for room before the run fails.
          DISPATCH_WAIT_S: '1200'
          TIMEOUT_S: '2400'
          # The ERP fleet hub (scripts/agent/board/lib/hub.mjs).
          ERP_HUB_ENV: ${{ vars.ERP_HUB_ENV }}
          ERP_HUB_CLIENT_ID_STAGING: ${{ secrets.ERP_HUB_CLIENT_ID_STAGING }}
          ERP_HUB_CLIENT_SECRET_STAGING: ${{ secrets.ERP_HUB_CLIENT_SECRET_STAGING }}
          ERP_HUB_CLIENT_ID_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_ID_PRODUCTION }}
          ERP_HUB_CLIENT_SECRET_PRODUCTION: ${{ secrets.ERP_HUB_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/fanout.mjs ]; then
            echo "::error::scripts/ci/fanout.mjs is missing on this ref — rebase the PR onto main."
            exit 1
          fi
          if grep -q "cmd === 'run'" scripts/ci/fanout.mjs; then
            node scripts/ci/fanout.mjs run
            exit 0
          fi
          # A ref cut before the merged step: its fanout.mjs only knows the old
          # two-step dispatch/collect (and may still self-dispatch). Remove once
          # no open PR predates it.
          node scripts/ci/fanout.mjs dispatch
          FANOUT="$(cat ci-fanout-checks.json)" node scripts/ci/fanout.mjs collect

      # Consumed by scripts/ci/ppap/ci-repo.sh --fanout (and scripts/ci/progress.mjs)
      # to find the batch runs that live in other repos.
      - name: Upload check fan-out map
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-fanout-checks
          path: ci-fanout-checks.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      - name: Emit per-suite verdicts
        id: verdict
        if: ${{ always() }}
        env:
          R_GATES: ${{ steps.collect.outputs.result_gates }}
          R_LINT: ${{ steps.collect.outputs.result_lint }}
          R_TYPECHECK: ${{ steps.collect.outputs.result_typecheck }}
          R_TEST: ${{ steps.collect.outputs.result_test }}
          WEB: ${{ steps.native.outputs.web }}
        run: |
          set -euo pipefail
          # Anything but a literal `success` is red — including an empty value
          # from a dispatch that failed or a collect that never ran. The one
          # exception is a mobile-only or markdown-only change, which had nothing to check.
          for s in gates lint typecheck test; do
            var="R_$(printf '%s' "$s" | tr '[:lower:]' '[:upper:]')"
            v="${!var:-}"
            [ "${WEB:-}" = false ] && v=success
            [ "$v" = success ] || v=failure
            echo "$s=$v" >> "$GITHUB_OUTPUT"
            echo "▶ $s: $v" >&2
          done

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true

  # Plan the e2e run. Two responsibilities:
  #   1. Decide SCOPE — when e2e_changed_only is true (PR CI), diff the PR
  #      (HEAD^1..HEAD on refs/pull/N/merge) through scripts/ci/e2e/plan.sh:
  #      full | scoped <specs> | skip. Otherwise (deploy gate) → full.
  #   2. Fan the effective shard count into a JSON array (`[1,2,...,N]`) for the
  #      matrix via fromJSON — full → e2e_shards shards; scoped → 1 shard (a
  #      handful of specs doesn't need 12 stacks); skip → empty (matrix no-op).
  # Pure git + jq + bash (no pnpm install). `run` is 'true' unless mode==skip.
  e2e-plan:
    name: 1 · CI · E2E (plan)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      # The zone build matrix, DISCOVERED rather than hardcoded — see the
      # `zones` step below and scripts/ci/e2e/zones.mjs.
      zones: ${{ steps.zones.outputs.matrix }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      # actions/checkout skips its GET /repos/{o}/{r}/hash-algorithm REST call
      # (one pooled-PAT call per checkout) only when `ref` is a full sha. Resolve
      # the caller's ref over the git protocol, which costs no REST quota. An
      # unresolvable ref (a conflicted PR has no refs/pull/N/merge) passes through
      # unchanged, so the checkout fails exactly as it did before.
      - name: Resolve the ref to a commit
        id: resolve
        env:
          REF: ${{ inputs.checkout_ref }}
          TOKEN: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
        run: |
          set -uo pipefail
          if printf '%s' "$REF" | grep -Eq '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'; then
            SHA="$REF"
          else
            Q="$REF"; case "$Q" in refs/*) ;; *) Q="refs/heads/$Q" ;; esac
            # An annotated tag lists its peeled commit as `<ref>^{}` — prefer it.
            SHA=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${PRIVATE_REPO}.git" "$Q" "$Q^{}" |
              awk -v q="$Q" '$2 == q "^{}" { p = $1 } $2 == q { r = $1 } END { print (p != "" ? p : r) }')
          fi
          echo "ref=${SHA:-$REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ steps.resolve.outputs.ref }}
          # Full history so HEAD^1 (the PR's base parent on the merge ref) is
          # available for the diff.
          fetch-depth: 0
          persist-credentials: false

      # The commit every e2e job tests. `checkout_ref` is a MOVING ref (`main`, or
      # refs/pull/N/merge, which GitHub recomputes when main moves), and each job
      # and every remote batch checks it out on its own, minutes apart: a merge in
      # between ran main's NEW specs against the bundles built from the OLD main
      # (race-control-replay-ui, ppap run 38651378126). Resolved once here.
      - name: Pin the commit under test
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          CHANGED_ONLY: ${{ inputs.e2e_changed_only }}
          TOTAL: ${{ inputs.e2e_shards }}
          # The checks job's web=false rule, applied here too: a PR whose every
          # changed file is under apps/mobile/ or is markdown has no web surface to test.
          NATIVE: ${{ inputs.run_native && startsWith(inputs.checkout_ref, 'refs/pull/') }}
        run: |
          set -euo pipefail
          MODE=full
          TARGETS=""
          if [ "$CHANGED_ONLY" = "true" ]; then
            # HEAD^1 on refs/pull/N/merge = the base (main); the diff to HEAD is
            # exactly the PR's delta.
            DECISION="$(E2E_PLAN_BASE=HEAD^1 bash scripts/ci/e2e/plan.sh)"
            MODE="${DECISION%% *}"
            TARGETS="${DECISION#"$MODE"}"; TARGETS="${TARGETS# }"
          fi
          if [ "$NATIVE" = "true" ] && [ -f scripts/ci/native/scope.sh ] &&
            NATIVE_SCOPE_BASE=HEAD^1 GITHUB_OUTPUT='' bash scripts/ci/native/scope.sh | grep -qx 'web=false'; then
            MODE=skip
            TARGETS=""
          fi
          case "$MODE" in
            skip)
              echo "run=false"  >> "$GITHUB_OUTPUT"
              echo "shards=[]"  >> "$GITHUB_OUTPUT"
              echo "total=0"    >> "$GITHUB_OUTPUT" ;;
            scoped)
              # A scoped run USED to be pinned to exactly one shard, on the
              # assumption that "a handful of specs doesn't need 12 stacks".
              # That assumption does not hold: scripts/ci/e2e/plan.sh emits spec
              # DIRECTORIES as well as files, and the directories are uneven.
              # It used to be far worse — `sourcing` mapped to a single
              # 232-spec `scpms` folder shared by four zones — but even now
              # apps/procurement/e2e is ~99 specs against apps/mail/e2e's 1,
              # and the big ones ran serially in ONE job, so the most common
              # kind of PR in this repo got the slowest possible e2e.
              #
              # Size the matrix to the number of specs actually selected, at
              # the same ~25-specs-per-shard density the full run uses (467
              # specs / 18 shards). Capped at 8 so a scoped run still leaves
              # room in the org's 20-job budget for the rest of the graph.
              SPEC_COUNT=0
              for t in $TARGETS; do
                if [ -d "$t" ]; then
                  n=$(find "$t" -name '*.spec.ts' -type f | wc -l)
                else
                  n=1
                fi
                SPEC_COUNT=$(( SPEC_COUNT + n ))
              done
              N=$(( (SPEC_COUNT + 24) / 25 ))
              [ "$N" -lt 1 ] && N=1
              [ "$N" -gt 8 ] && N=8
              SHARDS=$(seq 1 "$N" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"      >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
              echo "total=$N"       >> "$GITHUB_OUTPUT"
              echo "▶ scoped: $SPEC_COUNT spec files → $N shard(s)" >&2 ;;
            *)
              SHARDS=$(seq 1 "$TOTAL" | jq -R 'tonumber' | jq -cs '.')
              echo "run=true"       >> "$GITHUB_OUTPUT"
              echo "shards=$SHARDS"  >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL"    >> "$GITHUB_OUTPUT" ;;
          esac
          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "▶ e2e plan: mode=$MODE targets=[$TARGETS]" >&2

      # Which zones to build, DISCOVERED from apps/*/wrangler.jsonc — the same
      # scan serve-parity.sh and ci-boot.sh use to decide which zones to BOOT.
      #
      # This used to be a hardcoded matrix below, and the two drifted the moment
      # a zone was added: apps/mail was booted but never built, so under BUILD=0
      # it crashed and took the whole stack down — every shard red. Worse, the
      # fix could not reach the PR that caused it, because this file only
      # arrives in the satellite repos on a push to main. Deriving it means
      # adding a zone needs no workflow edit at all.
      - id: zones
        run: |
          set -euo pipefail
          MATRIX="$(node scripts/ci/e2e/zones.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "▶ e2e zones: $(node scripts/ci/e2e/zones.mjs --names | tr '\n' ' ')" >&2

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true

  # Build each dashboard zone on its OWN runner, in parallel. The 6 OpenNext
  # zones are fully independent (no cross-zone deps; dashboard-shell exports raw
  # `src/` so there's no prebuild step), so a per-zone matrix turns the old
  # ~258s serial "build all 6 on one 2-core runner" step into ~6 concurrent
  # ~60–90s builds — the dominant PR-CI / deploy-gate cost. Each leg tars its own
  # `apps/<zone>/.open-next` and uploads it; the shards download every zone tar
  # and reassemble the tree. `fail-fast: false` so one zone's build failure
  # doesn't mask the others. Free on public-repo minutes — fan out wide.
  e2e-build-zones:
    name: 1 · CI · E2E (build ${{ matrix.zone.name }})
    needs: e2e-plan
    # Skipped when the plan says nothing e2e-relevant changed. A scoped run still
    # builds ALL zones — the e2e stack boots the whole multi-zone router.
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # DERIVED from apps/*/wrangler.jsonc by scripts/ci/e2e/zones.mjs — the
        # same discovery serve-parity.sh and ci-boot.sh use to decide which
        # zones to BOOT. Never hardcode this list again: a zone booted but not
        # built crashes the whole e2e stack, and the fix cannot reach the PR
        # that introduced it. scripts/gate/ci/zone-matrix.mjs keeps it derived.
        zone: ${{ fromJSON(needs.e2e-plan.outputs.zones) }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ needs.e2e-plan.outputs.sha }}
          persist-credentials: false

      # Both cache keys are hashed HERE, once, on the freshly checked-out tree.
      # actions/cache re-evaluates its `key:` input in its post step too, after
      # the build has filled apps/<zone>/ with .next/ and .open-next/ — and
      # hashFiles has a hard 120s limit. The shell zone crossed it, failing a
      # green build in `Post Cache Next build` (ppap run 39360182925). A key
      # read from a step output costs the post step nothing.
      - name: Cache keys
        id: keys
        run: |
          echo "zonetar=zonetar-v2-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json', '.github/actions/install/action.yml', format('apps/{0}/**', matrix.zone.name), 'apps/*/src/app/**', 'apps/*/src/components/scpms/**', 'apps/shell/src/styles/**', 'scripts/ci/remote/**', 'packages/api-types/**', 'packages/utils/**', 'packages/dashboard-shell/**') }}" >> "$GITHUB_OUTPUT"
          echo "next=next-${{ runner.os }}-${{ matrix.zone.name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles(format('apps/{0}/**', matrix.zone.name), 'apps/*/src/app/**', 'apps/*/src/components/scpms/**', 'apps/shell/src/styles/**', 'packages/api-types/**', 'packages/utils/**', 'packages/dashboard-shell/**') }}" >> "$GITHUB_OUTPUT"

      # OUTPUT cache — the packaged bundle itself, not just the compiler cache.
      # On a hit this job does checkout → restore → upload (~10s) and skips
      # install AND the build entirely; the ~103–166s build is the single
      # largest item on the e2e critical path, so this is the cheapest minute
      # in the graph to buy back.
      #
      # The key must name EVERYTHING that can change the emitted bundle, and
      # nothing that can't — a false hit ships a stale bundle into e2e, which
      # is far worse than a miss. A zone depends on its own source, the shared
      # packages it transpiles (`transpilePackages: api-types, utils,
      # dashboard-shell` — see apps/<zone>/next.config.ts) and the root
      # compile/dependency config. Zones are mutually independent (no
      # cross-zone imports; they share code only through packages/*), which is
      # what makes the PER-ZONE scope sound — and it matters: keying on the
      # whole of `apps/**` busts all ten zones whenever any one app changes,
      # i.e. on almost every PR. Scoped this way, a PR touching apps/quotation
      # rebuilds quotation and restores the other nine.
      #
      # The package side is scoped for the same reason, and it was NOT: the key
      # hashed all of `packages/**`, so editing one busted all eleven zones even
      # when no bundle could contain it. packages/e2e-kit is Playwright helper
      # code that only specs import, and touching it rebuilt every zone — ~25
      # runner-minutes and ~3.5 wall-clock minutes for a change that cannot alter
      # an emitted byte. The three named below are the real closure: a zone's
      # source imports api-types, utils and dashboard-shell, and of those only
      # utils and dashboard-shell have workspace dependencies of their own (both
      # on api-types).
      #
      # That closure is computed from source and compared with this key by
      # scripts/gate/ci/zone-cache-key.mjs, on every commit and in CI, because
      # the failure it prevents is invisible: a zone importing a fourth package
      # would keep hitting this cache, and e2e would test source the key never
      # saw. Add the package here AND let that gate confirm it.
      #
      # The three non-package entries are the App Shell's CSS coupling: the
      # shell's stylesheet `@source`s every zone's route tree, and a zone remote
      # (scripts/ci/remote/build.mjs) ships only the utilities that scan missed —
      # so any zone's `src/app`, the shell's styles, or the remote builder can
      # change another zone's emitted CSS.
      - name: Cache zone bundle
        id: zonetar
        uses: actions/cache@v6
        with:
          path: zone-${{ matrix.zone.name }}.tar
          key: ${{ steps.keys.outputs.zonetar }}
          # No restore-keys ON PURPOSE: a partial-match restore would hand back
          # a bundle built from different source. Exact key or rebuild.

      - uses: ./.github/actions/install
        if: steps.zonetar.outputs.cache-hit != 'true'

      # Warm THIS zone's Next compiler cache across runs. build:pages still runs
      # (so it always re-evaluates source — no stale-build risk) but reuses prior
      # compilation work, cutting a cold ~60–120s build to ~20–40s on unchanged
      # source. Keyed per-zone so the matrix legs don't clobber one another's
      # cache. Scoped to this zone's own inputs for the same reason as the
      # bundle cache above — an `apps/**` key made every zone miss on any app
      # change. The key also names every zone's `src/app`, every zone's `src/components/scpms` and the shell styles:
      # the shell's Tailwind CSS scans those via `@source`, and a restored
      # compiler cache does not notice a class added outside `apps/shell` — the
      # shell served CSS without `min-w-39` (PR #7825, OMS po-list-po-total). So
      # there are NO restore-keys either: a stale compiler cache is NOT only a
      # slower build.
      - name: Cache Next build
        if: steps.zonetar.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: apps/${{ matrix.zone.name }}/.next/cache
          key: ${{ steps.keys.outputs.next }}

      # Generic relative `/api` build — no host/port baked, so the same bundle
      # boots on every shard's free port.
      - name: Build zone (OpenNext shell / zone remote)
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: pnpm --filter ${{ matrix.zone.pkg }} run build:pages

      # The shell's built stylesheet must hold every utility its @source scan
      # produces — a stale compiler cache otherwise ships an old sheet with a green
      # build. Skipped on a ref older than the check (a rollback to an earlier tag).
      - name: Check the shell stylesheet
        if: steps.zonetar.outputs.cache-hit != 'true' && matrix.zone.name == 'shell'
        run: |
          if [ ! -f scripts/ci/shell-css.mjs ]; then echo "::notice::scripts/ci/shell-css.mjs is not in this ref — skipped"; exit 0; fi
          node scripts/ci/shell-css.mjs apps/shell/.open-next

      # tar (not a raw many-small-files upload) so the file count doesn't make
      # upload/download slow. The bundle is already minified, so skip artifact
      # gzip. tar preserves the `apps/<zone>/.open-next` (shell) or
      # `apps/<zone>/.remote` (zone remote) path so the shard reassembles the
      # tree verbatim by untarring every zone tar.
      - name: Package zone build
        if: steps.zonetar.outputs.cache-hit != 'true'
        run: |
          app=apps/${{ matrix.zone.name }}
          if [ -d "$app/.open-next" ]; then out="$app/.open-next"; else out="$app/.remote"; fi
          tar -cf zone-${{ matrix.zone.name }}.tar "$out"

      # Runs on hit AND miss — on a hit the tar came from the cache, on a miss
      # from the step above. Either way the shards' `pattern: e2e-*` download
      # must find it.
      - name: Upload zone build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-zone-${{ matrix.zone.name }}
          path: zone-${{ matrix.zone.name }}.tar
          retention-days: 1
          compression-level: 0

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true

  # Seed the isolated e2e DB ONCE, in parallel with the zone builds (it only
  # needs the per-service migration scripts, not the dashboard build output).
  # Isolated-state branch of scripts/dev/db/reset.sh: per-service `wrangler d1 migrations
  # apply --persist-to .wrangler/state-e2e`, no ExMS demo seed — exactly the DB
  # each shard would have produced itself. Each shard is a separate runner, so
  # its untarred copy of the state dir is its own mutable DB — shard isolation
  # is preserved without snapshotting.
  e2e-seed:
    name: 1 · CI · E2E (seed db)
    needs: e2e-plan
    if: ${{ inputs.run_e2e && needs.e2e-plan.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
          set -uo pipefail
          if [ "${AUTH_MODE:-pat}" = app ]; then
            # GitHub App mode (docs/engineering/platform/ppap-github-app.md): one App
            # installed on every fleet org instead of the pooled user PATs. Mint the
            # NamThuanVn installation's token here (the checkout needs it), then fetch
            # scripts/ci/ppap/fleet-token.sh from main and let it install the `gh`
            # wrapper + git helper that hand every later call its own org's token.
            D="$RUNNER_TEMP/fleet-app"; mkdir -p "$D/tokens"; chmod 700 "$D" "$D/tokens"
            B64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            KEY=$(mktemp); chmod 600 "$KEY"; printf '%s\n' "$APP_KEY" > "$KEY"; NOW=$(date +%s)
            JWT="$(printf '{"alg":"RS256","typ":"JWT"}' | B64).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW-60)) $((NOW+540)) "$APP_ID" | B64)"
            JWT="$JWT.$(printf '%s' "$JWT" | openssl dgst -sha256 -sign "$KEY" | B64)"; rm -f "$KEY"
            ID=$(curl -sf -m 20 -H "Authorization: Bearer $JWT" https://api.github.com/orgs/NamThuanVn/installation | jq -r '.id // empty')
            TOK=$(curl -sf -m 20 -X POST -H "Authorization: Bearer $JWT" "https://api.github.com/app/installations/${ID:-0}/access_tokens")
            BEST=$(printf '%s' "$TOK" | jq -r '.token // empty'); EXP=$(printf '%s' "$TOK" | jq -r '.expires_at // empty | fromdateiso8601')
            [ -n "$BEST" ] || { echo "::error::FLEET_AUTH_MODE=app but no App token for NamThuanVn — check FLEET_APP_ID / FLEET_APP_PRIVATE_KEY on this repo and that the App is installed (ppap-github-app.md)"; exit 1; }
            echo "::add-mask::$BEST"
            printf '%s %s\n' "$EXP" "$BEST" > "$D/tokens/NamThuanVn"
            # raw.githubusercontent.com costs no REST quota; the contents API costs one NT call per job
            # (about 80 jobs per PR). The contents API stays as the fallback.
            curl -sf -m 20 -H "Authorization: Bearer $BEST" -o "$D/fleet-token.sh" \
              'https://raw.githubusercontent.com/NamThuanVn/erp-namthuan/main/scripts/ci/ppap/fleet-token.sh' \
              || curl -sf -m 20 -H "Authorization: Bearer $BEST" -H 'Accept: application/vnd.github.raw' -o "$D/fleet-token.sh" \
              'https://api.github.com/repos/NamThuanVn/erp-namthuan/contents/scripts/ci/ppap/fleet-token.sh?ref=main' \
              || { echo "::error::could not fetch scripts/ci/ppap/fleet-token.sh from main"; exit 1; }
            FLEET_APP_ID="$APP_ID" FLEET_APP_KEY="$APP_KEY" FLEET_APP_DIR="$D" bash "$D/fleet-token.sh" setup || exit 1
            # actions/checkout spends one GET /repos/{owner}/{repo}/hash-algorithm per checkout of a
            # branch, on the token it is given. A checkout that persists no credentials only reads,
            # so it takes a pooled PAT (CHECKOUT_PAT) for that call; git writes stay on the App.
            CO=$(FLEET_APP_DIR="$D" "$D/bin/fleet-token" spill NamThuanVn api repos/NamThuanVn/erp-namthuan/hash-algorithm 2>/dev/null) || CO=''
            if [ -n "$CO" ]; then echo "::add-mask::$CO"; echo "CHECKOUT_PAT=$CO" >> "$GITHUB_ENV"; fi
            LOGIN='namthuan-erp-fleet[bot]'
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; echo "FLEET_AUTH_MODE=app"; } >> "$GITHUB_ENV"
            echo "GitHub App -> @$LOGIN"
          else
            POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
            # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
            # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
            # account reads 5000 — so one account served every job while the rest idled,
            # which is the concentration the pool exists to prevent. Jobs shuffle
            # independently, so a fan-out spreads instead of stampeding onto one token.
            POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
            # The budget comes from the X-RateLimit headers of a REAL call (GET /user, which
            # also names the account), never from /rate_limit: for these accounts that
            # endpoint reports 0 used while real calls show hundreds (2026-10-08, it2nt:
            # /rate_limit 0 vs /user 916), so every job saw a 5000-each tie and piled onto
            # one account until GitHub refused it. Stop at the first account with GOOD calls
            # left — still about one call per job, and the login comes with it.
            GOOD=1500; BEST=''; BEST_REM=-1; LOGIN=''; BODY=$(mktemp)
            while IFS= read -r T; do
              [ -n "$T" ] || continue
              echo "::add-mask::$T"
              H=$(curl -s -m 15 -D - -o "$BODY" -H "Authorization: Bearer $T" https://api.github.com/user) || continue
              R=$(printf '%s\n' "$H" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-ratelimit-remaining"{print $2}' | tail -n1)
              case "$R" in ''|*[!0-9]*) continue ;; esac
              L=$(jq -r '.login // empty' "$BODY" 2>/dev/null)
              [ -n "$L" ] || continue
              if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; LOGIN="$L"; fi
              [ "$R" -ge "$GOOD" ] && break
            done <<< "$POOL"
            rm -f "$BODY"
            [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
            { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
            echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
            if [ "$BEST_REM" -lt 500 ]; then
              echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
            fi
          fi
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ needs.e2e-plan.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/install

      - name: Seed e2e database (once)
        env:
          # scripts/dev/db/reset.sh restores the pre-migrated D1 snapshot, which lives on a
          # release in the PRIVATE repo (it contains real seeded employee/budget
          # data and must not be public). Without a token `gh` cannot read it and
          # this job silently falls back to a full cold migration run — correct,
          # just slower — so the seed step would quietly lose its speedup.
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
        run: STATE_DIR=.wrangler/state-e2e bash scripts/dev/db/reset.sh

      # Mostly-incompressible sqlite — skip artifact gzip.
      - name: Package seed
        run: tar -cf e2e-seed.tar .wrangler/state-e2e

      - name: Upload e2e seed
        uses: actions/upload-artifact@v7
        with:
          name: e2e-seed
          path: e2e-seed.tar
          retention-days: 1
          compression-level: 0

      # The job's GitHub calls per token as ONE greppable log line (scripts/ci/ppap/fleet-token.sh
      # calls-report) — ranks which jobs burn the NT App's 5,000/h. App mode only; never fails.
      - name: GitHub calls (NT / PAT)
        if: always()
        run: command -v fleet-token >/dev/null 2>&1 && fleet-token calls-report || true
  # ONE job for the whole e2e stage: work out where the shards go, dispatch
  # them, wait for them, and emit the single verdict the caller reads.
  #
  # This used to be three jobs (fan-out → collect → result). They were always
  # sequential and always all-or-nothing, so the split bought nothing but three
  # nodes in the run graph and two sets of job plumbing. The `result` job
  # existed only because a workflow output must be produced even when the stage
  # is skipped — handled here by `if: !cancelled()` plus an explicit precondition
  # gate, which is also the one place that has to get "did the stage actually
  # run?" right.
  #
  # `!cancelled()`, never `always()`: on a cancel GitHub re-evaluates each running
  # job's `if:` and keeps the ones still true, so an `always()` coordinator outlived
  # every superseding push — it sat in `Dispatch + wait for e2e batches` to the 40-minute
  # TIMEOUT_S while the new run waited `pending` on the `ci-<pr>` concurrency
  # group (PR #5831: two re-pushes, ~36 min each, and the lane exited 65 at
  # terminal-state-unmet). scripts/gate/ci/workflows.sh pass 0g enforces it.
  #
  # FAILS CLOSED by construction: `result` is the workflow's `e2e` output and
  # the caller treats anything other than the literal `success` as red, so a
  # crashed job (empty output) is a red run, never a silent pass.
  e2e:
    name: 1 · CI · E2E
    needs: [e2e-plan, e2e-build-zones, e2e-seed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Bounded by the slowest remote shard; the batch jobs cap at 30 min each.
    timeout-minutes: 60
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      runs: ${{ steps.collect.outputs.runs }}
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
          AUTH_MODE: ${{ vars.FLEET_AUTH_MODE }}
          APP_ID: ${{ secrets.FLEET_APP_ID }}
          APP_KEY: ${{ secrets.FLEET_APP_PRIVATE_KEY }}
          # A batch job's PAT budgets from its coordinator (scripts/ci/ppap/fleet-token.sh hint); empty otherwise.
          FLEET_PAT_HINT: ${{ github.event.client_payload.ctx.pat_hint }}
        run: |
