          token: ${{ env.CHECKOUT_PAT || env.RESOLVED_PAT }}
          ref: ${{ needs.native-plan.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/install

      # The develop variant's backend: `pnpm dev:lite` on :3008, as in local
      # development (the boot itself is the one erp-local-stack-matrix.yml
      # proves on every OS). nohup, because the stack must outlive this step.
