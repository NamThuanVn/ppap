name: ERP · CI · PR · Lint · Typecheck · Test · E2E

# PR CI entrypoint. Triggered cross-repo by erp-namthuan/.github/workflows/
# pr-triage-and-ci-dispatch.yml via repository_dispatch[ci]; workflow_dispatch is the
# manual re-run escape hatch. The actual job graph (biome / typecheck /
# lint / test / e2e-shards) lives in erp-ci-checks.yml (reusable workflow_call)
# — this file just wires that graph to the PR-CI trigger surface and pings
# the Check Run back on completion.
#
# Uses a pooled PAT (same pool as deploy/sync, ppap-side copy). It must have
# Checks:R/W on erp-namthuan so the `report` job can PATCH the Check Run.
# Note: this collapses the fork-safety boundary that a separate CI_PAT
# would have provided — see the trade-off note in docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL.

run-name: "${{ (github.event.client_payload.pr_number || inputs.pr_number) && format('ERP · CI · PR #{0} · {1}', github.event.client_payload.pr_number || inputs.pr_number, github.event.client_payload.title || 'manual rerun') || 'ERP · CI · manual · main' }}"

on:
  repository_dispatch:
    types: [ci]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number on NamThuanVn/erp-namthuan to (re)run CI for. Leave EMPTY to smoke-test the full CI graph against erp-namthuan main.'
        required: false
        type: string
      e2e_shards:
        description: 'Override default Playwright shard count for a manual re-run (leave empty to use erp-ci-checks.yml default).'
        required: false
        type: number
      fleet:
        description: 'Comma-separated owner/repo ppap list to borrow idle e2e capacity from (the erp-namthuan variable PPAP_CI_REPOS). Empty on a manual run ⇒ no fan-out, every shard lands on this repo.'
        required: false
        default: ''
        type: string

permissions: read-all

concurrency:
  group: ci-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

env:
  PRIVATE_REPO: NamThuanVn/erp-namthuan

jobs:
  # Echo the source pull request on erp-namthuan (this run has no PR context of
  # its own — it's fired cross-repo via repository_dispatch). Prints to the log
  # and the run's Summary so reviewers can jump straight to the PR being tested.
  source-pr:
    name: Source PR
    runs-on: ubuntu-latest
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
          # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
          # account reads 5000 — so one account served every job while the rest idled,
          # which is the concentration the pool exists to prevent. Jobs shuffle
          # independently, so a fan-out spreads instead of stampeding onto one token.
          POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - name: Print source PR
        env:
          PR: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
          TITLE: ${{ github.event.client_payload.title }}
          SHA: ${{ github.event.client_payload.head_sha }}
          ACTOR: ${{ github.event.client_payload.triggered_by }}
        run: |
          URL="https://github.com/${{ env.PRIVATE_REPO }}/pull/${PR}"
          echo "Source PR: #${PR} — ${TITLE:-<no title>}"
          echo "  ${URL}"
          echo "  head_sha: ${SHA:-n/a} · triggered_by: ${ACTOR:-n/a}"
          {
            echo "### Source pull request"
            echo ""
            echo "- **PR:** [#${PR}](${URL}) — ${TITLE:-_no title_}"
            echo "- **Head SHA:** \`${SHA:-n/a}\`"
            echo "- **Triggered by:** ${ACTOR:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Re-post the pending CI status so its Details link points at THIS run
      # instead of the generic /actions list the dispatcher had to use
      # (repository_dispatch is fire-and-forget — only the run knows its id).
      # `status_context` lets ONE pull request carry SEVERAL independent CI
      # runs. A commit status is keyed by its context, so N runs all posting
      # `CI` overwrite each other and the PR shows one ambiguous check for N
      # runs — which is exactly what a 5-way verification fan-out looked like
      # before this. A dispatcher that sends no context keeps plain `CI`, so
      # every ordinary PR is untouched.
      - name: Point CI status at this run
        if: github.event.client_payload.head_sha
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          STATUS_CONTEXT: ${{ github.event.client_payload.status_context || 'CI' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api repos/${{ env.PRIVATE_REPO }}/statuses/"$HEAD_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Running on ppap" \
            -f target_url="$RUN_URL"
          echo "✓ Pending $STATUS_CONTEXT status now targets $RUN_URL"

  # Run the 4-job CI graph. erp-ci-checks.yml lives in the same repo and exposes
  # each job's `result` as a workflow_call output, so the report job below
  # can build a per-job summary without re-querying the API.
  #
  # A PR (repository_dispatch, or workflow_dispatch WITH a number) checks out
  # refs/pull/<N>/merge — the merge commit GitHub computes between the PR head
  # and base, mirroring what `pull_request` would test (absent on a merge
  # conflict → checkout fails → the report surfaces a "resolve conflict" hint).
  # A manual workflow_dispatch with NO number checks out erp-namthuan `main`
  # instead, so the full CI graph can be smoke-tested without opening a PR.
  checks:
    uses: ./.github/workflows/erp-ci-checks.yml
    with:
      checkout_ref: ${{ (github.event.client_payload.pr_number || inputs.pr_number) && format('refs/pull/{0}/merge', github.event.client_payload.pr_number || inputs.pr_number) || 'main' }}
      # DESIRED shard count. The effective count is min(this, capacity) —
      # erp-ci-checks.yml's e2e job borrows idle fleet repos for the surplus,
      # so this can exceed one org's ~14-shard ceiling. Empty ⇒ erp-ci-checks.yml's
      # own default.
      # 48, not 32: fan-out recruits ceil(total/WORKER_SLOTS) hosts, so this is
      # 6 of the ~15 idle fleet repos and leaves the rest for concurrent PRs.
      # Measured at 32 (ppap run 33893945508): 32 shards, mean 240s, max 376s,
      # e2e leg 413s of a 700s run. Going 14 → 32 scaled nearly linearly
      # (per-shard ~520s → ~240s), so there is headroom left; the floor is each
      # shard's fixed cost (~30s of install + artifact restore, plus the stack
      # boot), which is why this stops at 48 rather than 64. Shorter shards also
      # shrink the slow-shard tail that sets the batch job's 40-minute ceiling.
      # Revert to 32 here if concurrent PRs start finding the fleet busy.
      e2e_shards: ${{ fromJSON(inputs.e2e_shards || '48') }}
      # The fleet this run may borrow e2e capacity from, forwarded by the
      # private dispatcher (which owns PPAP_CI_REPOS). Absent on a manual
      # workflow_dispatch → no fan-out, every shard stays here.
      # A repository_dispatch carries the list; a manual run has to be given it,
      # otherwise fanout finds no pool, logs "no worker with room" and collapses every
      # shard onto this one repo (up to COORD_FALLBACK_SLOTS). That made manual
      # main smoke tests unrepresentative of real PR CI — and unusable for
      # measuring a shard-count change.
      fleet: ${{ github.event.client_payload.fleet || inputs.fleet }}
      pr_number: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      head_sha: ${{ github.event.client_payload.head_sha }}
      # EVERY PR runs the FULL e2e suite, and it blocks the merge (issue #3722).
      #
      # It used to scope to the changed service's specs, which is why a PR could
      # be green while the suite was red: a change under `scripts/` selected ~0
      # specs, so nothing outside the touched area was ever exercised before
      # merge. The gap was invisible for as long as the noise scan was broken
      # (#3717) and only surfaced when the failure digest became readable.
      #
      # Cost is deliberately not the deciding factor: this runs on the ppap
      # fleet's free public-repo minutes, so the trade is wall-clock for a
      # guarantee that nothing merges past a broken spec.
      #
      # KNOWN AND ACCEPTED: the suite is flaky today — 6 green / 2 red measured
      # across 8 full runs against `main`, with ~11 specs failing intermittently
      # and the membership changing run to run. Until that rate comes down, this
      # gate WILL red a PR for reasons unrelated to it. The mitigation is to fix
      # the flake spec-by-spec (see #3722 for the measured profile and the
      # "assert the precondition" pattern that fixed the first one), NOT to
      # re-narrow the scope — re-narrowing restores the exact hole this closes.
      e2e_changed_only: false
    secrets:
      PAT_TOKEN_POOL: ${{ secrets.PAT_TOKEN_POOL }}

  # Publishes each check job's failures to the PR AS THAT JOB FINISHES, instead
  # of making the agent driving the PR wait for `report` below.
  #
  # `report` needs: [checks], so it cannot exist until every job has finished.
  # Measured on a real ~10.5-minute run: typecheck was final 7m51s before the
  # report comment appeared, vitest/gates/lint 5m40s before. All of that was
  # dead time for whoever was driving the PR — and the agent fleet spends it on
  # every attempt of every item.
  #
  # Deliberately a WATCHER with no `needs:`, rather than a publish step inside
  # each job. A per-job step would have to capture that job's own stdout
  # (`cmd | tee log`), and Actions' default shell is `bash -e {0}` with pipefail
  # OFF — so every such call site that forgot `set -o pipefail` would silently
  # turn a failing job green. A hole in the gate is a far worse outcome than a
  # slow round trip, so nothing about the existing jobs is touched: this reads
  # their logs through the same API the report job already uses.
  #
  # Never gates anything. It has no dependants, always exits 0, and its comments
  # are deleted by `report`. If it dies, CI behaves exactly as it did before.
  progress:
    name: Publish CI progress
    if: ${{ (github.event.client_payload.pr_number || inputs.pr_number) && !cancelled() }}
    runs-on: ubuntu-latest
    # Comfortably past the e2e leg's own ceiling, so the watcher is still alive
    # to report the last job; it exits on its own once every watched job is done.
    timeout-minutes: 45
    steps:
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
          # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
          # account reads 5000 — so one account served every job while the rest idled,
          # which is the concentration the pool exists to prevent. Jobs shuffle
          # independently, so a fan-out spreads instead of stampeding onto one token.
          POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      - name: Checkout ppap (for scripts/ci)
        uses: actions/checkout@v5

      - name: Check out erp-namthuan scripts
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ (github.event.client_payload.pr_number || inputs.pr_number) && format('refs/pull/{0}/merge', github.event.client_payload.pr_number || inputs.pr_number) || 'main' }}
          token: ${{ env.RESOLVED_PAT }}
          path: erp
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: false

      - name: Watch jobs and publish parts
        continue-on-error: true
        env:
          # Two tokens by role, same split the report job uses: the run's own
          # token reads this repo's job logs, the pooled PAT writes the comment
          # on the private repo.
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          SELF_TOKEN: ${{ github.token }}
          PRIVATE_REPO: ${{ env.PRIVATE_REPO }}
        run: |
          node erp/scripts/ci/progress.mjs \
            --pr "${{ github.event.client_payload.pr_number || inputs.pr_number }}" \
            --sha "${{ github.event.client_payload.head_sha }}" \
            --run-id "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --private-repo "${{ env.PRIVATE_REPO }}"

  # Posts the final commit-status update on the PR's head SHA, replacing the
  # `pending` status that pr-triage-and-ci-dispatch.yml created. `if: !cancelled()` so
  # failures still get a final pingback, but runs cancelled by concurrency
  # (superseded by a newer push — expected, not an error) stay silent: the
  # superseding run re-posts a fresh pending status and delivers the real
  # final state. The shell step itself no-ops if `head_sha` is empty
  # (manual workflow_dispatch).
  #
  # Statuses (not Check Runs) because the Checks API update endpoint
  # requires a GitHub App installation token; a pooled PAT is a fine-grained
  # PAT, which the Statuses API accepts with Statuses:R/W.
  report:
    name: Report CI
    needs: [checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # PAT pool: pick whichever pooled account still has REST quota. ONE account's
      # 5,000/hr used to cover the whole agent fleet, every fleet CI status post, the
      # deploy graph AND the PR CI dispatcher — when it ran dry, even human PR CI
      # could not be dispatched (`API rate limit exceeded for user ID 286265802`,
      # ppap run 32333654329). `GET /rate_limit` does NOT count against the limit, so
      # probing every token is free. Inlined rather than calling
      # `scripts/ci/ppap/pat-pool.sh` (the canonical copy — keep the two in step)
      # because a private-repo checkout itself needs a token, so the pool cannot live
      # behind it.
      #
      # PAT_TOKEN_POOL is the ONLY source — the single-PAT fallback was retired once
      # the pool was live in all 8 stores (#2611 shipped it, this removed it). That is
      # deliberate: a fallback meant a mis-set pool silently reverted the whole system
      # to one account's quota, i.e. straight back to the outage above, looking healthy
      # the entire time. Now a missing pool fails the job loudly instead.
      - name: Resolve PAT from pool
        env:
          PAT_POOL: ${{ secrets.PAT_TOKEN_POOL }}
        run: |
          set -uo pipefail
          POOL=$(printf '%s\n' "${PAT_POOL:-}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$')
          # Shuffle before the scan so EQUAL budgets tie-break evenly. The `-gt` below
          # keeps the FIRST token on a tie, and a rested pool is ALL ties — every
          # account reads 5000 — so one account served every job while the rest idled,
          # which is the concentration the pool exists to prevent. Jobs shuffle
          # independently, so a fan-out spreads instead of stampeding onto one token.
          POOL=$(printf '%s\n' "$POOL" | while IFS= read -r T; do printf '%s\t%s\n' "$RANDOM" "$T"; done | sort -n | cut -f2-)
          BEST=''; BEST_REM=-1
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            echo "::add-mask::$T"
            R=$(curl -sf -m 15 -H "Authorization: Bearer $T" https://api.github.com/rate_limit \
                  | jq -r '.resources.core.remaining' 2>/dev/null) || continue
            case "$R" in ''|*[!0-9]*) continue ;; esac
            if [ "$R" -gt "$BEST_REM" ]; then BEST="$T"; BEST_REM="$R"; fi
          done <<< "$POOL"
          [ -n "$BEST" ] || { echo "::error::PAT_TOKEN_POOL is unset/empty on this repo, or every token in it was unreachable — see docs/engineering/platform/ppap-secrets.md § PAT_TOKEN_POOL"; exit 1; }
          LOGIN=$(curl -sf -m 15 -H "Authorization: Bearer $BEST" https://api.github.com/user | jq -r '.login')
          { echo "GH_TOKEN=$BEST"; echo "RESOLVED_PAT=$BEST"; echo "RESOLVED_PAT_LOGIN=$LOGIN"; } >> "$GITHUB_ENV"
          echo "PAT pool -> @$LOGIN ($BEST_REM core remaining)"
          if [ "$BEST_REM" -lt 500 ]; then
            echo "::warning::best pooled PAT has only $BEST_REM core calls left — add another account to PAT_TOKEN_POOL"
          fi
          exit 0

      # Sparse checkout of scripts/ci only. This job otherwise never touches the
      # repo — the noise scan reads every log through the API — but the digest
      # step below runs scripts/ci/failure-digest.mjs, and a script belongs in
      # scripts/ (CLAUDE.md) rather than inlined here where nothing can test it.
      # One non-cone path keeps this to a few KB, and no `pnpm install` is needed:
      # the script imports only node: builtins.
      #
      # `continue-on-error`: this job's product is the commit status and the
      # sticky comment. If the checkout blips the digest degrades to absent and
      # the report still posts — it must never be why a green PR misses its
      # auto-merge.
      - name: Check out the digest script
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ env.RESOLVED_PAT }}
          ref: ${{ (github.event.client_payload.pr_number || inputs.pr_number) && format('refs/pull/{0}/merge', github.event.client_payload.pr_number || inputs.pr_number) || 'main' }}
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The "green is not clean" scan, folded into this job rather than a
      # separate one in erp-ci-checks.yml. It was its own job only because that is
      # where the e2e shards used to live; it reads everything through the API
      # by run id, so it can run anywhere — and its sole consumer is the status
      # + comment steps right below it. One report job instead of two.
      #
      # Reusable-workflow jobs share THIS run, so `github.run_id` covers every
      # coordinator job; the fanned-out batches live in other repos and come
      # from the `e2e_runs` output.
      #
      # `continue-on-error` + `set +e`: a scan hiccup must never red a run whose
      # actual checks passed. When it cannot run, `clean` stays empty, which the
      # steps below treat as "not clean" — so the failure mode is a missed
      # auto-merge, never a wrongly-permitted one.
      - name: Scan this run's logs for noise
        id: noise
        continue-on-error: true
        env:
          # TWO tokens, by repo. The e2e batch logs live in OTHER fleet repos,
          # which only the pooled PAT can read — that is why it is here at all.
          # GITHUB_TOKEN is used for this repo's own jobs, where it always has
          # actions:read.
          #
          # NOTE: permissions were NOT what broke the scan in #3717 — that was
          # `gh` refusing to print a response containing ANSI escapes (see the
          # --allow-escape-sequences note below). The split is kept because it is
          # the right scoping, not because it was the fix.
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          POOL_PAT: ${{ env.RESOLVED_PAT }}
          SELF_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          BATCH_RUNS: ${{ needs.checks.outputs.e2e_runs }}
          # Which categories CI itself calls red. The digest uses this to tell
          # "this job passed" apart from "this job failed and I could not parse
          # why" — an unparsed red job must announce itself, not read as silence.
          R_BIOME: ${{ needs.checks.outputs.biome }}
          R_TYPE: ${{ needs.checks.outputs.typecheck }}
          R_LINT: ${{ needs.checks.outputs.lint }}
          R_TEST: ${{ needs.checks.outputs.test }}
          R_E2E: ${{ needs.checks.outputs.e2e }}
        run: |
          set +e -uo pipefail   # errexit OFF — zero-match greps below exit non-zero by design
          tmp="$(mktemp -d)"
          : > "$tmp/e2e.log"; : > "$tmp/biome.log"; : > "$tmp/test.log"
          : > "$tmp/typecheck.log"; : > "$tmp/eslint.log"
          : > "$tmp/runs.tsv"
          printf '%s\t%s\n' "$GITHUB_REPOSITORY" "$RUN_ID" >> "$tmp/runs.tsv"
          if [ -n "${BATCH_RUNS:-}" ] && [ "$BATCH_RUNS" != "[]" ]; then
            printf '%s' "$BATCH_RUNS" \
              | jq -r '.[]? | [.repo, (.run_id|tostring)] | @tsv' 2>/dev/null >> "$tmp/runs.tsv"
          fi
          echo "▶ noise: scanning $(wc -l < "$tmp/runs.tsv") run(s)"
          while IFS="$(printf '\t')" read -r repo run; do
            [ -n "$repo" ] && [ -n "$run" ] || continue
            gh api "repos/${repo}/actions/runs/${run}/jobs" --paginate \
              --jq '.jobs[]? | [(.id|tostring), .name] | @tsv' 2>/dev/null \
              | while IFS="$(printf '\t')" read -r id name; do
                  [ -n "$id" ] || continue
                  # `E2E (shard` and not `E2E`: the plan, build-zone and seed
                  # jobs share the prefix and carry no test output.
                  case "$name" in
                    *"E2E (shard"*)  dest="$tmp/e2e.log" ;;
                    # BOTH arms, permanently: sync-workflows-to-ppap.yml rsyncs
                    # file-by-file across the fleet, so there is a window where a
                    # repo has the new ci-checks and the old ci-pr (or the
                    # reverse). A single-arm match during that window silently
                    # reports `biome_warnings: 0, clean: true`.
                    *"Biome"*|*"Repo gates"*) dest="$tmp/biome.log" ;;
                    *"Unit tests"*)  dest="$tmp/test.log" ;;
                    *"Typecheck"*)   dest="$tmp/typecheck.log" ;;
                    *"ESLint"*)      dest="$tmp/eslint.log" ;;
                    *)               continue ;;
                  esac
                  # GITHUB_TOKEN for this repo, pooled PAT for the fanned-out
                  # batch repos it cannot see. Errors are NO LONGER discarded:
                  # swallowing them is what turned "I could not read the logs"
                  # into "there is nothing to see" for every run.
                  if [ "$repo" = "$GITHUB_REPOSITORY" ]; then tok="$SELF_TOKEN"; else tok="$POOL_PAT"; fi
                  # `--allow-escape-sequences` is REQUIRED, not optional: a job
                  # log is full of ANSI colour, and newer `gh` refuses to print a
                  # response containing escapes without it — erroring out with
                  # "the response contains terminal escape sequences". With the
                  # old `2>/dev/null` that error was invisible, so every fetch
                  # produced an empty file and the scan called every run clean
                  # (#3717). The `sed` below still strips the escapes; this flag
                  # only lets them out of `gh` so there is something to strip.
                  if ! GH_TOKEN="$tok" gh api --allow-escape-sequences \
                       "repos/${repo}/actions/jobs/${id}/logs" 2>"$tmp/fetch.err" \
                       | sed -E 's/\x1b\[[0-9;]*m//g' >> "$dest"; then
                    echo "::warning::could not read logs for job ${id} (${name}) in ${repo}: $(head -c 200 "$tmp/fetch.err")"
                    echo "$repo/$id" >> "$tmp/fetch-failures"
                  fi
                done
          done < "$tmp/runs.tsv"
          # Bytes actually read. Zero across every log means the scan did not
          # run — which is NOT the same as a clean run, and must never be
          # reported as one.
          bytes=0
          for f in e2e biome test typecheck eslint; do
            bytes=$(( bytes + $(wc -c < "$tmp/$f.log") ))
          done
          scan_ok=true
          if [ "$bytes" -eq 0 ]; then
            scan_ok=false
            echo "::warning::noise scan read 0 bytes of job logs — reporting the scan as UNAVAILABLE, not clean (see issue #3717)"
          fi
          echo "▶ noise: read ${bytes} byte(s) of job logs; scan_ok=${scan_ok}"
          # Counters, digest, status line and comment body all come from ONE
          # tested script now (scripts/ci/report.mjs). What stays here is the
          # part only a workflow can do: downloading the logs above, and posting
          # the result below. The composition used to be ~55 lines of grep/awk
          # here plus ~90 in the two steps after it — untestable, and only
          # fixable by a merge to main because this tree syncs to the fleet on
          # merge. See docs/engineering/platform/ppap.md § To CI validation.
          # The RICH e2e payload. Each batch shard wrote a `ci-sites` artifact
          # from Playwright's json report — per-attempt status (so a flake is
          # distinguishable from a break) and the `error-context.md` page
          # snapshot, neither of which survives into the text log. Pulling them
          # here is what lets the PR comment replace an artifact download.
          # Entirely best-effort: no sites simply means a leaner comment.
          sitesdir="$tmp/sites"; mkdir -p "$sitesdir"
          SITES_FLAG=""
          if [ -n "${BATCH_RUNS:-}" ] && [ "$BATCH_RUNS" != "[]" ]; then
            while IFS=$'\t' read -r brepo brun; do
              [ -n "$brepo" ] && [ -n "$brun" ] || continue
              GH_TOKEN="$POOL_PAT" gh run download "$brun" -R "$brepo" -p 'ci-sites-*' \
                -D "$sitesdir/$brun" >/dev/null 2>&1 || true
            done < <(printf '%s' "$BATCH_RUNS" | jq -r '.[]? | [.repo, (.run_id|tostring)] | @tsv' 2>/dev/null)
            if node scripts/ci/payload.mjs --merge "$sitesdir" --out "$tmp/sites.json" 2>/dev/null; then
              [ -s "$tmp/sites.json" ] && SITES_FLAG="--sites $tmp/sites.json"
            fi
          fi
          echo "▶ rich e2e sites: ${SITES_FLAG:-none collected}"

          JOBS="gates=${R_BIOME:-},typecheck=${R_TYPE:-},lint=${R_LINT:-},vitest=${R_TEST:-},e2e=${R_E2E:-}"
          out="$tmp/report"
          SCAN_FLAG=""
          [ "$scan_ok" = true ] || SCAN_FLAG="--scan-unavailable"
          if ! node scripts/ci/report.mjs --dir "$tmp" --jobs "$JOBS" $SCAN_FLAG $SITES_FLAG \
                 --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
                 --out-dir "$out"; then
            echo "::error::scripts/ci/report.mjs failed — the PR would otherwise get a green-looking empty report"
            exit 1
          fi
          [ -s "$tmp/sites.json" ] && cp "$tmp/sites.json" "$RUNNER_TEMP/ci-sites.json" || true
          clean=$(jq -r '.clean' "$out/report.json")
          summary=$(node -e 'const r=require(process.argv[1]);console.log(["flaky","dup_testid","hydration","i18n_missing","font_preload","http_4xx","biome_warnings","vitest_stderr"].map(k=>k+" "+r[k]).join(" · "))' "$out/report.json")
          {
            echo "clean=$clean"
            echo "summary=$summary"
            echo "scan_ok=$scan_ok"
            echo "state=$(cat "$out/state.txt")"
            echo "status=$(cat "$out/status.txt")"
            echo "logdir=$tmp"
            # Multiline, so the delimiter form. The body is markdown this script
            # generated and can never contain the token.
            echo "comment<<__CI_COMMENT__"
            cat "$out/comment.md"
            echo ""
            echo "__CI_COMMENT__"
          } >> "$GITHUB_OUTPUT"
          mkdir -p ci-noise
          cp "$out/report.json" ci-noise/ci-noise-report.json
          cat ci-noise/ci-noise-report.json
          echo "▶ noise: $summary → clean=$clean"
          exit 0

      - name: Upload noise report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-noise-report
          path: ci-noise/ci-noise-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Update CI commit status on erp-namthuan
        id: status
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          # Must match the context the pending status used, or the run leaves a
          # pending check behind forever and posts its verdict under a second one.
          STATUS_CONTEXT: ${{ github.event.client_payload.status_context || 'CI' }}
          R_BIOME: ${{ needs.checks.outputs.biome }}
          R_TYPE: ${{ needs.checks.outputs.typecheck }}
          R_LINT: ${{ needs.checks.outputs.lint }}
          R_TEST: ${{ needs.checks.outputs.test }}
          R_E2E: ${{ needs.checks.outputs.e2e }}
          REPORT_STATE: ${{ steps.noise.outputs.state }}
          REPORT_STATUS: ${{ steps.noise.outputs.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # STATE and DESC are computed by scripts/ci/report.mjs (isGreen /
          # statusLine) and read back here. The rule they enforce is unchanged and
          # still load-bearing: EVERY job in the ci-checks graph must be in the
          # AND, because a job that runs but is missing from it is a job whose
          # failure the PR reports as green — and a job result that is absent
          # counts as failure, never as success. That is now covered by a test per
          # job plus the missing-key case, instead of a conjunction nobody could
          # exercise.
          #
          # The other half of the rule still stands and cannot be tested away:
          # naming an output erp-ci-checks.yml does NOT expose resolves to an empty
          # string and pins STATE to failure forever, so a gate folded into an
          # existing job must NOT get an R_* of its own. It is covered by its host
          # job's result, and named individually in the report's Repo-gates list.
          STATE="${REPORT_STATE:-failure}"
          # A missing REPORT_STATUS means report.mjs never ran at all — e.g. the
          # `refs/pull/N/merge` checkout above 404s whenever the PR is unmergeable
          # against main, which takes the "Check out the digest script" step's
          # `continue-on-error` past the soft "digest absent" case it was written
          # for and into a total checkout failure, so `scripts/ci/report.mjs`
          # itself is gone (MODULE_NOT_FOUND). Refusing to post here used to leave
          # the commit's `pending` status — set when CI was first dispatched —
          # standing forever, because nothing ever replaces it. Every agent
          # lane's CI-wait then polls that stuck `pending` for its FULL budget
          # before giving up, which coalesces into the fleet-wide
          # `terminal-state-unmet` hold (2026-09-21, fingerprint e239a6eaff6c,
          # #3806/PR #3830 among others). Post a generic failure description
          # instead — it still matches STATE's existing "absent means failure"
          # rule two lines up, and a described failure is what actually lets the
          # waiting agent (or a human) act on it.
          DESC="${REPORT_STATUS:-CI reporting failed before it could summarize the run (see the run log) — treating as failure}"
          # Exposed for the Telegram notify step below — computed before the
          # head_sha guard so manual workflow_dispatch re-runs still notify.
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC"  >> "$GITHUB_OUTPUT"
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "No head_sha in payload (manual workflow_dispatch?) — skipping pingback."
            exit 0
          fi
          gh api repos/${{ env.PRIVATE_REPO }}/statuses/"$HEAD_SHA" \
            -f state="$STATE" \
            -f context="${STATUS_CONTEXT:-CI}" \
            -f description="$DESC" \
            -f target_url="$RUN_URL"
          echo "✓ Updated ${STATUS_CONTEXT:-CI} status on $HEAD_SHA — $STATE ($DESC)"

      # Post/refresh a sticky CI report comment on the source PR; flip ANY draft
      # ready-for-review once CI is green + noise-clean; and — for PRs labeled
      # `auto-merge` — squash-merge them on the same green+clean bar. The auto-ready
      # is unconditional (this is the single owner of draft → ready — the /ship-pr,
      # /ship-docs, /open-pr commands no longer flip it themselves); the
      # merge is label-gated. Best-effort: `set +e` + `exit 0` so a comment/ready/merge
      # hiccup (or a PAT missing contents/PR write) never reds this job after the
      # status posted. `/clear-todo` adds the `auto-merge` label, so its PRs
      # merge here on green+clean (which is also why its own classifier-blocked
      # `gh pr merge` is no longer needed — CI lands the merge).
      - name: Report to PR + auto-ready + auto-merge when clean
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ env.RESOLVED_PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          STATE: ${{ steps.status.outputs.state }}
          NOISE_CLEAN: ${{ steps.noise.outputs.clean }}
          NOISE_SUMMARY: ${{ steps.noise.outputs.summary }}
          DESC: ${{ steps.status.outputs.desc }}
          LOGDIR: ${{ steps.noise.outputs.logdir }}
          NOISE_SCAN_OK: ${{ steps.noise.outputs.scan_ok }}
          R_BIOME: ${{ needs.checks.outputs.biome }}
          R_TYPE: ${{ needs.checks.outputs.typecheck }}
          R_LINT: ${{ needs.checks.outputs.lint }}
          R_TEST: ${{ needs.checks.outputs.test }}
          R_E2E: ${{ needs.checks.outputs.e2e }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e -o pipefail
          [ -n "${PR_NUMBER:-}" ] || { echo "No PR number (manual dispatch?) — skipping PR report."; exit 0; }
          REPO="${{ env.PRIVATE_REPO }}"
          NOISE_SUMMARY="${NOISE_SUMMARY:-unknown (scan unavailable)}"
          # PR metadata.
          gh api "repos/$REPO/pulls/$PR_NUMBER" > /tmp/pr.json 2>/dev/null
          # Stale-run guard: with CI fanned out across multiple ppap repos, a
          # superseded run in another org can outlive the cancel sweep (dispatch
          # → run-creation latency). The commit Status above is sha-scoped and
          # safe, but everything below — sticky comment, auto-ready, auto-merge
          # — is PR-scoped, so a stale run must not touch it (a late "✅ green"
          # comment for an old sha would mislead reviewers). Manual
          # workflow_dispatch reruns carry no head_sha → guard intentionally
          # skipped, preserving manual-rerun semantics.
          CURRENT_HEAD=$(jq -r '.head.sha // ""' /tmp/pr.json 2>/dev/null)
          if [ -n "${HEAD_SHA:-}" ]; then
            if [ -z "$CURRENT_HEAD" ]; then
              # Fail CLOSED on a dispatch run: if the metadata fetch failed we
              # can't prove this run isn't stale, and a stale "✅ green" comment
              # is worse than a missing one. (Manual reruns have no HEAD_SHA
              # and never reach here.)
              echo "::warning::could not verify PR #$PR_NUMBER head (metadata fetch failed) — skipping PR report/ready/merge."
              exit 0
            fi
            if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
              echo "Stale run: tested $HEAD_SHA but PR #$PR_NUMBER head is now $CURRENT_HEAD — skipping PR report/ready/merge."
              exit 0
            fi
          fi
          LABELS=$(jq -r '[.labels[].name] | join(",")' /tmp/pr.json 2>/dev/null)
          DRAFT=$(jq -r '.draft // false' /tmp/pr.json 2>/dev/null)
          MERGEABLE=$(jq -r '.mergeable // "null"' /tmp/pr.json 2>/dev/null)
          MERGED=$(jq -r '.merged // false' /tmp/pr.json 2>/dev/null)
          HAS_LABEL=false; case ",$LABELS," in *",auto-merge,"*) HAS_LABEL=true ;; esac

          # Auto-ready: flip ANY draft to ready for review once CI is green +
          # noise-clean — independent of the `auto-merge` label. The draft state
          # keeps the merge button disabled while CI is still being driven; once the
          # run is green + noise-clean there is nothing left to drive, so CI hands the
          # PR to humans by marking it ready. Single run — the PR dispatcher ignores
          # `ready_for_review`, so no re-dispatch loop. (Merging is separate and still
          # requires the `auto-merge` label — see the decision tree below.)
          READY_LINE=""
          if [ "$MERGED" != "true" ] && [ "$DRAFT" = "true" ] && [ "$STATE" = "success" ] && [ "$NOISE_CLEAN" = "true" ]; then
            PR_NODE_ID=$(jq -r '.node_id' /tmp/pr.json 2>/dev/null)
            if [ -n "$PR_NODE_ID" ] && [ "$PR_NODE_ID" != "null" ] \
               && gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
                    -f id="$PR_NODE_ID" >/dev/null 2>&1; then
              DRAFT=false
              READY_LINE="✅ **Marked ready for review** — green + noise-clean."
              echo "✓ marked draft PR #$PR_NUMBER ready for review (green + noise-clean)"
            else
              READY_LINE="⚠️ Could not mark ready for review (PAT missing PR write?)."
              echo "::warning::could not mark PR #$PR_NUMBER ready for review"
            fi
          fi

          # Decide the auto-merge action + human-readable reason. Merging requires the
          # `auto-merge` label (unlike the auto-ready above, which is unconditional).
          # `/clear-todo` adds the label, so its PRs merge here on green+clean.
          MERGE_LINE=""
          if [ "$MERGED" = "true" ]; then
            MERGE_LINE="✅ Already merged."
          elif [ "$HAS_LABEL" != "true" ]; then
            MERGE_LINE="ℹ️ Not auto-merged — add the \`auto-merge\` label to enable."
          elif [ "$NOISE_CLEAN" != "true" ]; then
            MERGE_LINE="⏸️ Labeled \`auto-merge\`, but **noise present** ($NOISE_SUMMARY) — not merged. Clear the noise to auto-merge."
          elif [ "$STATE" != "success" ]; then
            MERGE_LINE="⏸️ Labeled \`auto-merge\`, but **CI is not green** — not merged."
          elif [ "$MERGEABLE" = "false" ]; then
            MERGE_LINE="⚠️ Labeled \`auto-merge\` and green+clean, but **has conflicts** — resolve before it can merge."
          else
            # Eligible: green + noise-clean + labeled + mergeable (true/null). The PR
            # was already flipped ready by the auto-ready block above; squash-merge it.
            # `sha=` makes the merge atomic: GitHub 409s if the head moved between the
            # stale-run guard's read and this call, so a raced push can never merge
            # unvalidated content. (Empty on manual reruns — precondition skipped.)
            MERGE_ARGS=(-f merge_method=squash)
            if [ -n "${HEAD_SHA:-}" ]; then MERGE_ARGS+=(-f sha="$HEAD_SHA"); fi
            if gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" "${MERGE_ARGS[@]}" >/tmp/merge.json 2>/tmp/merge.err; then
              MERGE_LINE="✅ **Auto-merged (squash)** — labeled \`auto-merge\`, CI green, noise-clean."
            else
              MERGE_LINE="⚠️ Auto-merge attempt failed: $(tr -d '\n' </tmp/merge.err | sed 's/\"//g' | cut -c1-160). PR left green + ready."
            fi
          fi

          # Sticky comment (upsert by the hidden marker) — one comment per PR,
          # refreshed each run. The body is rebuilt by the same tested script that
          # produced the status, now that the ready/merge outcome is known; the
          # marker it emits is what keeps this an edit rather than a new comment
          # every run.
          SCAN_FLAG=""
          [ "${NOISE_SCAN_OK:-true}" = true ] || SCAN_FLAG="--scan-unavailable"
          SITES_FLAG=""
          [ -s "$RUNNER_TEMP/ci-sites.json" ] && SITES_FLAG="--sites $RUNNER_TEMP/ci-sites.json"
          BODY=$(node scripts/ci/report.mjs --dir "$LOGDIR" $SCAN_FLAG $SITES_FLAG \
            --jobs "gates=${R_BIOME:-},typecheck=${R_TYPE:-},lint=${R_LINT:-},vitest=${R_TEST:-},e2e=${R_E2E:-}" \
            --run-url "$RUN_URL" --ready-line "$READY_LINE" --merge-line "$MERGE_LINE" \
            --out-dir "$LOGDIR/report2" --print)
          if [ -z "$BODY" ]; then
            echo "::warning::report.mjs produced no comment body — falling back to the status line"
            BODY="<!-- ci-report -->
          ## CI report — $( [ "$STATE" = "success" ] && echo "✅ green" || echo "❌ failing" )

          $DESC

          [View CI run]($RUN_URL)"
          fi
          # ── ONE comment: the latest report, then every run so far ────────
          #
          # These used to be two. The report is REPLACED on every run, so a
          # reader scrolling a PR found the latest verdict and no trace of the
          # ones before it; the log held that sequence but sat in a separate
          # comment the report's own text had to point at. Two comments, two
          # lookups, two PATCHes — and the question a second run actually
          # raises, *did my push change anything*, answered in neither place
          # on its own. Current state on top, history beneath, one comment.
          #
          # `HEAD_SHA` comes from the dispatch payload and is EMPTY on a manual
          # workflow_dispatch re-run — which is exactly how a PR is driven
          # through repeated runs on one tree. `CURRENT_HEAD` is the live sha
          # this step already fetched for the stale guard, so fall back to it:
          # the head column is how a reader tells which runs share a tree, and
          # a column of dashes would make the streak unreadable.
          #
          # Best-effort throughout: the log must never be why the verdict
          # fails to reach the PR, so a failure here falls back to posting the
          # report on its own.
          CID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body|startswith("<!-- ci-report -->"))][0].id' 2>/dev/null)
          PREV=''
          if [ -n "${CID:-}" ] && [ "$CID" != "null" ]; then
            PREV=$(gh api "repos/$REPO/issues/comments/$CID" --jq .body 2>/dev/null || true)
          fi

          # A PR opened before the merge has its history in the OLD standalone
          # log comment. Seed from it so the table carries over instead of
          # restarting at row 1, and retire it once its rows have a new home —
          # otherwise the PR keeps a stale, frozen copy of its own history
          # directly under the live one.
          OLD_LOG_CID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body|startswith("<!-- ci-run-log -->"))][0].id' 2>/dev/null || true)
          if [ -n "${OLD_LOG_CID:-}" ] && [ "$OLD_LOG_CID" != "null" ]; then
            case "$PREV" in
              *ci-run-log-data*) : ;;  # already merged — the old one is just litter
              *) PREV=$(gh api "repos/$REPO/issues/comments/$OLD_LOG_CID" --jq .body 2>/dev/null || printf '%s' "$PREV") ;;
            esac
          fi

          COMBINED=''
          if [ -s "$LOGDIR/report2/data.json" ]; then
            printf '%s' "$BODY" > "$RUNNER_TEMP/ci-report-body.md"
            COMBINED=$(printf '%s' "$PREV" | node scripts/ci/run-log.mjs \
              --report "$LOGDIR/report2/data.json" \
              --report-body "$RUNNER_TEMP/ci-report-body.md" \
              --run-url "$RUN_URL" --head-sha "${HEAD_SHA:-${CURRENT_HEAD:-}}" 2>/dev/null || true)
          fi
          if [ -z "$COMBINED" ]; then
            echo "::warning::run-log render failed — posting the report without the history table"
            COMBINED="$BODY"
          fi

          if [ -n "${CID:-}" ] && [ "$CID" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$COMBINED" >/dev/null 2>&1 \
              && echo "✓ Updated CI comment on PR #$PR_NUMBER" \
              || echo "::warning::could not update CI comment (PAT missing issues:write?)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$COMBINED" >/dev/null 2>&1 \
              && echo "✓ Posted CI comment on PR #$PR_NUMBER" \
              || echo "::warning::could not post CI comment (PAT missing issues:write?)"
          fi

          # Retire the pre-merge log comment only AFTER its rows are safely in
          # the combined one, so a failed PATCH above never loses history.
          if [ -n "${OLD_LOG_CID:-}" ] && [ "$OLD_LOG_CID" != "null" ] && [ "$COMBINED" != "$BODY" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$OLD_LOG_CID" >/dev/null 2>&1 \
              && echo "✓ Retired the standalone run-log comment — its rows are in the report now"
          fi

          # The consolidated comment is up, so the per-job progress comments have
          # served their purpose — remove them and leave the PR with exactly one
          # CI comment, as it looked before progressive reporting existed.
          # Best-effort by construction: a part we cannot delete is cosmetic.
          node scripts/ci/parts.mjs clear --pr "$PR_NUMBER" --repo "$REPO" 2>/dev/null || true
          echo "▶ $MERGE_LINE"
          exit 0
